<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070b16">
<title>Blipwork · Admin</title>
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  /* Her ruling 2026-08-21: admin is a laptop-only page — use the width.
     (The app's own .view stays phone-first at 520px; this page only.) */
  .view.adm{max-width:min(96vw,1500px)}
  .adm-head{margin-bottom:14px}
  .adm-section{margin-bottom:16px}
  .adm-section h2{font-size:18px;margin-bottom:4px}
  .adm-quests,.adm-strug{display:flex;flex-direction:column;margin-top:10px}
  .adm-qrow,.adm-srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 4px;border-bottom:1px solid var(--brd)}
  .adm-qrow:last-child,.adm-srow:last-child{border-bottom:none}
  .switch{position:relative;display:inline-block;width:46px;height:26px;flex:0 0 auto}
  .switch input{opacity:0;width:0;height:0}
  .switch .slider{position:absolute;inset:0;background:rgba(58,160,255,.16);border-radius:99px;transition:.18s;cursor:pointer}
  .switch .slider::before{content:"";position:absolute;height:20px;width:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.18s}
  .switch input:checked + .slider{background:var(--good)}
  .switch input:checked + .slider::before{transform:translateX(20px)}
  .adm-lhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
  .adm-add{display:flex;gap:8px;margin-bottom:12px}
  .adm-add .login-input{flex:1;margin-bottom:0}
  .adm-tablewrap{overflow-x:auto}
  /* actions stack vertically so the chips column gets the width */
  .adm-table{width:100%;border-collapse:collapse;font-size:13px;min-width:580px}
  .adm-table th,.adm-table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--brd);vertical-align:middle}
  .adm-table th{color:var(--muted);font-weight:500;font-size:12px}
  .adm-table .mono{font-family:var(--font-num)}
  /* stacked vertically (2026-08-21) so the chips column gets the width */
  .adm-actions{display:flex;flex-direction:column;gap:4px;white-space:nowrap}
  .adm-actions .btn{width:100%}
  .adm-inactive{color:var(--warn)}
  .btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
  .btn.danger:hover{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel))}
  /* quests grouped by chapter — Open all / Close all per cluster (session 5) */
  .adm-qchap{margin-top:16px;padding-top:14px;border-top:1px solid var(--brd)}
  .adm-qchap:first-of-type{margin-top:10px;padding-top:0;border-top:none}
  .adm-qchead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .adm-qctitle{font-family:var(--font-display);font-weight:600;font-size:15px}
  .adm-qcount{margin-left:2px}
  .adm-qcbtns{display:flex;gap:6px;margin-left:auto}
  .adm-qlist{display:flex;flex-direction:column}
  /* round chips grouped by chapter (learner table, session 5) */
  .adm-table td.chips{padding-top:8px;padding-bottom:8px;width:100%;min-width:min(680px,46vw)}
  /* Wide view (her ruling 2026-08-21: admin is a laptop page) — clusters flow
     side by side and wrap, instead of stacking every chapter vertically. */
  .rclusters{display:flex;flex-wrap:wrap;gap:8px 16px}
  .rcluster{flex:0 0 auto;border-left:2px solid var(--cc,var(--brd));padding-left:8px}
  .rch-head{display:flex;align-items:center;gap:5px;font-family:var(--font-display);font-weight:600;font-size:10.5px;
    text-transform:uppercase;letter-spacing:.3px;color:var(--cc,var(--muted));margin-bottom:3px;white-space:nowrap}
  .rch-ico{font-size:12px}
  .rgrid{display:flex;flex-wrap:wrap;gap:3px;max-width:100%}
  .rchip{display:inline-grid;place-items:center;min-width:26px;height:20px;padding:0 5px;border-radius:var(--r-sm);
    font-family:var(--font-num);font-size:10px;font-weight:700;cursor:default;border:1px solid transparent}
  .rchip.ok{color:var(--good);background:color-mix(in srgb,var(--good) 22%,transparent);border-color:color-mix(in srgb,var(--good) 55%,transparent)}
  .rchip.try{color:var(--warn);background:color-mix(in srgb,var(--warn) 20%,transparent);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
  .rchip.none{color:var(--faint);background:rgba(127,163,212,.08);border-color:var(--brd)}
</style>
</head>
<body>
  <div id="admin"><main class="view"><p class="muted center" style="padding:48px 0">Loading…</p></main></div>
  <script type="module" src="js/admin.js"></script>
</body>
</html>

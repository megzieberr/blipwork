<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator vs. the real fx-991ZA PLUS II · verification</title>
<link rel="stylesheet" href="./css/styles.css">
<style>
  body{font-family:"JetBrains Mono",monospace;padding:24px;max-width:900px;margin:0 auto}
  #status{font-weight:700;font-size:15px;padding:11px 15px;border-radius:12px;margin:12px 0 18px;border:1px solid var(--brd)}
  #status.pass{background:var(--good-bg);color:var(--good)} #status.fail{background:var(--bad-bg);color:var(--bad)}
  h2{font-size:15px;margin:24px 0 8px}
  .row{font-size:12px;line-height:1.7}
  .ok{color:var(--good)} .bad{color:var(--bad);font-weight:700}
  .why{color:var(--muted)}
  #host{position:absolute;left:-9999px;width:340px}
  #fitHost{max-width:340px}
  #summary{font-weight:700;font-size:15px;margin-top:22px}
</style>
</head>
<body>
<h1 style="font-family:'Space Grotesk',sans-serif;font-size:19px">Calculator vs. the real fx-991ZA PLUS II</h1>
<div id="status">running…</div>
<div id="out"></div>
<div id="host"></div>
<div id="fitHost" class="q-calc"></div>
<div id="summary"></div>

<script type="module">
/* ============================================================
   Every row below is one key sequence pressed through the RENDERED
   buttons (a real click on [data-keyid], never calc.press()), and the
   LCD state the real device shows afterwards. The expected values are
   the device's own answers from CASIO-CALCULATOR-SPEC.md (probed on
   Megan's fx-991ZA PLUS II emulator, 3 October 2026); each row names
   the spec line it comes from. Rows marked "Blipwork choice" test a
   decision taken where the spec is silent, so a later probe can
   overturn them.

   Later builds: append your own section with section("Build N …")
   and rows in the same shape. Keep the ONE summary line at the very
   end of the page: tools/harness_run.py reads the last line that
   contains "passed" or "FAIL", so no row text may contain either word.
   ============================================================ */
import { mountCalculator, openCalculator } from "./js/calculator.js";

const out = document.getElementById("out");
const host = document.getElementById("host");
let total = 0, good = 0; const bad = [];

/* key names as printed on the key face → the rendered button's data-keyid */
const KEY = {
  "+": "plus", "−": "minus", "×": "mult", "÷": "div", "=": "eq", ",": "dot",
  "◀": "left", "▶": "right", "▲": "up", "▼": "down",
  "AC": "ac", "DEL": "del", "SHIFT": "shift", "ALPHA": "alpha", "MODE": "mode", "ON": "on",
  "RCL": "rcl", "M+": "mplus", "(−)": "neg", "°'\"": "dms", "hyp": "hyp",
  "sin": "sin", "cos": "cos", "tan": "tan", "(": "lparen", ")": "rparen", "S⇔D": "sd",
  "CALC": "calc", "∫": "intdx", "x²": "x2", "x^": "pow", "√": "sqrt", "frac": "frac",
  "Ans": "ans", "×10x": "exp10", "x⁻¹": "xinv", "log": "log", "ln": "ln", "log□": "logbox", "ENG": "eng",
  "π": "shift exp10",   // Build 3: π is SHIFT ×10^x (two key presses)
};
const keyIds = seq => seq.trim().split(/\s+/).filter(Boolean).flatMap(t => /^\d+$/.test(t) ? t.split("").map(d => "d" + d) : (KEY[t] || t).split(" "));

function freshCalc(h = host, opts = {}) {
  h.innerHTML = "";
  const api = mountCalculator(h, opts);
  const press = seq => keyIds(seq).forEach(id => {
    const b = h.querySelector(`[data-keyid="${id}"]`);
    if (!b) throw new Error(`no rendered key "${id}"`);
    b.click();
  });
  return { api, press, h };
}

/* what the LCD shows right now */
function read(h) {
  const ex = h.querySelector(".lcd-expr"), res = h.querySelector(".lcd-res");
  const cur = ex && ex.querySelector(".calc-cursor");
  let before = null;
  if (cur) { const r = document.createRange(); r.setStart(ex, 0); r.setEndBefore(cur); before = r.toString(); }
  const slot = n => { const s = h.querySelector(`.calc-ind .ind-${n}`); return s ? s.textContent : ""; };
  /* Build 2 fields (only compared when a row names them):
     val   — the result as text, a stacked fraction as top/bottom, a raised
             ×10 power as ^power: "1/2", "√2/2", "1,099511628×10^12"
     frac  — the FIRST fraction on the entry line as top/bottom ("3/" = 3/□)
     idx   — the ˣ√ index box's text on the entry line
     curIn — which box holds the cursor: num, den, idx, body, exp, or line
     err   — the error screen's lines joined by " / " ("" when none)
     mark  — the long-line ◀ marker is showing
     curVis — the cursor sits inside the visible part of the line (clear of ◀) */
  let val = "";
  if (res) {
    const c = res.cloneNode(true);
    c.querySelectorAll(".calc-x10-exp").forEach(s => { s.textContent = "^" + s.textContent; });
    c.querySelectorAll(".calc-frac").forEach(f => f.replaceWith(`${f.querySelector(".calc-frac-num").textContent}/${f.querySelector(".calc-frac-den").textContent}`));
    val = c.textContent;
  }
  const fr = ex && ex.querySelector(".calc-frac");
  const ix = ex && ex.querySelector(".calc-rad-idx");
  const IN = [["calc-frac-num", "num"], ["calc-frac-den", "den"], ["calc-rad-idx", "idx"], ["calc-rad-body", "body"], ["calc-pow-exp", "exp"],
              ["calc-logb-base", "base"], ["calc-logb-body", "logbody"], ["calc-abs-body", "abs"], ["calc-mixed-whole", "whole"]];   // second row: Build 4 boxes
  const inBox = cur ? (IN.find(([cls]) => cur.parentElement.classList.contains(cls)) || [0, "line"])[1] : null;
  /* Build 3 field: resFrac — every stacked fraction in the RESULT as
     [top|bottom], so "one fraction over 4 with √6−√2 on top" can be told
     apart from "√6 − (√2 over 4)", which reads the same as val */
  const resFrac = res ? [...res.querySelectorAll(".calc-frac")].map(f => `[${f.querySelector(".calc-frac-num").textContent}|${f.querySelector(".calc-frac-den").textContent}]`).join("") : "";
  const errBox = h.querySelector(".lcd-err");
  const mk = h.querySelector(".lcd-lmark");
  const markOn = !!mk && !mk.hidden && mk.getBoundingClientRect().width > 0;
  let curVis = false;
  if (cur) {
    const er = ex.getBoundingClientRect(), cr = cur.getBoundingClientRect();
    const left = markOn ? mk.getBoundingClientRect().right : er.left;
    curVis = cr.left >= left - 0.5 && cr.right <= er.right + 0.5;
  }
  /* Build 4 fields: mixed — a mixed-number RESULT as "whole top/bottom"
     ("1 3/4"); title — a menu or prompt title ("Fix 0~9?"); menu — the menu
     items' text; fix — the FIX tag in the status line */
  const mx = res && res.querySelector(".calc-mixed");
  const mixed = mx ? `${mx.textContent.startsWith("−") ? "−" : ""}${mx.querySelector(".calc-mixed-whole").textContent} ${mx.querySelector(".calc-frac-num").textContent}/${mx.querySelector(".calc-frac-den").textContent}` : "";
  const ttl = h.querySelector(".lcd-title"), mnu = h.querySelector(".lcd-menu");
  /* Build 5 fields: sv — the SOLVE answer's two value lines, "X=2 / L−R=0"
     (a raised ×10 power as ^power); big — a prompt shows a TYPED value (the
     big top-left entry) rather than its label. On a prompt, expr is the top
     left (the label or the typed value) and val the value bottom right; on
     the SOLVE answer, expr is the equation line. */
  const sv = [...h.querySelectorAll(".lcd-sv-row")].map(r => {
    const c = r.cloneNode(true);
    c.querySelectorAll(".calc-x10-exp").forEach(s => { s.textContent = "^" + s.textContent; });
    return c.textContent.replace(/\s+/g, "");
  }).join(" / ");
  return {
    sv, big: !!h.querySelector(".lcd-pr-typing"),
    mixed, title: ttl ? ttl.textContent : "", menu: mnu ? mnu.textContent : "", fix: slot("fix"),
    expr: ex ? ex.textContent : "", res: res ? res.textContent : "", cur: before,
    sa: slot("sa"), m: slot("m") === "M", sto: slot("sto") === "STO", rcl: slot("rcl") === "RCL", hist: slot("hist"),
    val, resFrac, frac: fr ? `${fr.querySelector(".calc-frac-num").textContent}/${fr.querySelector(".calc-frac-den").textContent}` : "",
    idx: ix ? ix.textContent : null, curIn: inBox,
    err: errBox ? [...errBox.children].map(d => d.textContent).join(" / ") : "",
    mark: markOn, curVis,
  };
}

function section(title) { out.insertAdjacentHTML("beforeend", `<h2>${title}</h2>`); }
function tick(cond, label, detail = "") {
  total++; if (cond) good++; else bad.push(label + (detail ? " — " + detail : ""));
  out.insertAdjacentHTML("beforeend", `<div class="row ${cond ? "ok" : "bad"}">${cond ? "✓" : "✗"} ${label}${detail ? ` <span class="why">${detail}</span>` : ""}</div>`);
}

/* A row: name, spec reference, then one or more [keys, want] steps on ONE
   fresh calculator. Only the fields named in `want` are compared. */
function row(name, spec, steps) {
  const c = freshCalc();
  const diffs = [];
  try {
    steps.forEach(([keys, want], i) => {
      c.press(keys);
      const got = read(c.h);
      for (const k of Object.keys(want)) {
        if (got[k] !== want[k]) diffs.push(`after "${keys}": ${k} = ${JSON.stringify(got[k])}, want ${JSON.stringify(want[k])}`);
      }
    });
  } catch (e) { diffs.push("threw: " + e.message); }
  tick(diffs.length === 0, `${name} <span class="why">[${spec}]</span>`, diffs.join("; "));
}

/* ============================================================
   BUILD 1 — editing, history, ALPHA, variables, STO, RCL, M
   (spec sections 1 and 2)
   ============================================================ */
section("Build 1 · editing after a result (spec §1)");

row("the reported bug: type a sum, =, ◀, DEL, retype, =", "§1 ◀ after a result edits", [
  ["12 + 35 =", { expr: "12+35", res: "47" }],
  ["◀", { expr: "12+35", res: "", cur: "12+35" }],
  ["DEL", { expr: "12+3", res: "", cur: "12+3" }],
  ["4", { expr: "12+34", res: "", cur: "12+34" }],
  ["=", { expr: "12+34", res: "46" }],
]);
row("◀ after a result: cursor at the END, result gone, typing inserts there", "§1", [
  ["2 + 3 =", { res: "5" }],
  ["◀", { expr: "2+3", res: "", cur: "2+3" }],
  ["4 =", { expr: "2+34", res: "36" }],
]);
row("▶ after a result: cursor at the START, typing inserts there", "§1", [
  ["2 + 3 =", { res: "5" }],
  ["▶", { expr: "2+3", res: "", cur: "" }],
  ["1 =", { expr: "12+3", res: "15" }],
]);
row("◀ then ◀ moves on through the expression (inside edit mode)", "§1 cursor", [
  ["2 + 3 = ◀ ◀", { expr: "2+3", cur: "2+" }],
  ["1 =", { expr: "2+13", res: "15" }],
]);
row("DEL after a result does nothing at all", "§1", [
  ["2 + 3 = DEL", { expr: "2+3", res: "5" }],
  ["DEL DEL", { expr: "2+3", res: "5" }],
]);
row("a digit after a result still starts a fresh line", "§1", [
  ["2 + 3 = 7", { expr: "7", res: "" }],
]);
row("+ after a result still chains from Ans", "§1 / device-verified earlier", [
  ["3 + 4 = +", { expr: "Ans+" }],
  ["5 =", { res: "12" }],
]);
row("a fresh calculator shows an empty line plus the cursor, no 0", "§1 no \"0\" anywhere", [
  ["", { expr: "", res: "", cur: "" }],
]);
row("AC clears the screen to an empty line plus the cursor, no 0", "§1", [
  ["2 + 3 = AC", { expr: "", res: "", cur: "" }],
]);
row("AC then ◀ recalls the last expression, cursor at the end, no result", "§1 AC keeps the history", [
  ["2 + 3 = AC ◀", { expr: "2+3", res: "", cur: "2+3" }],
  ["=", { res: "5" }],
]);
row("AC then ▶ recalls the last expression, cursor at the start", "§1", [
  ["2 + 3 = AC ▶", { expr: "2+3", res: "", cur: "" }],
  ["9 =", { expr: "92+3", res: "95" }],
]);

section("Build 1 · history ▲▼ (spec §1)");

row("after = a small ▲ shows at the top right", "§1", [
  ["1 + 1 =", { res: "2", hist: "▲" }],
]);
row("▲ / ▼ walk three entries; ▲▼ inside the history", "§1, §16 ▲ / ▼ / ▲▼; ▼ alone at the oldest is Blipwork's reading of §16", [
  ["1 + 1 = 2 + 2 = 3 + 3 =", { expr: "3+3", res: "6", hist: "▲" }],
  ["▲", { expr: "2+2", res: "4", hist: "▲▼" }],
  ["▲", { expr: "1+1", res: "2", hist: "▼" }],
  ["▲", { expr: "1+1", res: "2", hist: "▼" }],
  ["▼", { expr: "2+2", res: "4", hist: "▲▼" }],
  ["▼", { expr: "3+3", res: "6", hist: "▲" }],
  ["▼", { expr: "3+3", res: "6", hist: "▲" }],
]);
row("AC then ▲ shows the last calculation WITH its result", "§1", [
  ["1 + 1 = 2 + 2 = AC", { expr: "", res: "" }],
  ["▲", { expr: "2+2", res: "4" }],
  ["▲", { expr: "1+1", res: "2" }],
]);
row("◀ on a history entry edits it; = makes a NEW entry, the old one stays", "§1", [
  ["1 + 1 = 2 + 2 = 3 + 3 = ▲ ▲", { expr: "1+1", res: "2" }],
  ["◀", { expr: "1+1", res: "", cur: "1+1" }],
  ["0 =", { expr: "1+10", res: "11", hist: "▲" }],
  ["▲", { expr: "3+3", res: "6", hist: "▲▼" }],
  ["▲ ▲", { expr: "1+1", res: "2", hist: "▼" }],
]);
row("▶ on a history entry edits it with the cursor at the start", "§1", [
  ["1 + 1 = 2 + 2 = ▲ ▶", { expr: "1+1", res: "", cur: "" }],
  ["5 =", { expr: "51+1", res: "52" }],
]);
row("DEL on a history entry does nothing (a result is on screen)", "§1 DEL after a result", [
  ["1 + 1 = 2 + 2 = ▲ DEL", { expr: "1+1", res: "2", hist: "▼" }],
]);
row("the ▲ hides on an error screen", "§3 \"the ▲ history indicator hides on an error screen\"", [
  ["1 + 1 = + =", { res: "Syntax ERROR", hist: "" }],
]);
{
  // Blipwork choice: the device's limit is by bytes and was not measured; we keep 30 entries
  const c = freshCalc();
  for (let k = 1; k <= 35; k++) c.press(`${k} =`);
  for (let k = 0; k < 40; k++) c.press("▲");
  const g = read(c.h);
  tick(g.expr === "6" && g.res === "6" && g.hist === "▼",
       `history stays bounded: 35 calculations, ▲ ×40 stops at the 6th <span class="why">[Blipwork choice: 30 entries]</span>`,
       `oldest shown "${g.expr}" = "${g.res}", indicator "${g.hist}"`);
}

section("Build 1 · ALPHA (spec §2)");

row("ALPHA lights a boxed A at the far left", "§2", [["ALPHA", { sa: "A" }]]);
row("SHIFT lights a boxed S in the same spot", "§2", [["SHIFT", { sa: "S" }]]);
row("ALPHA ALPHA = off", "§2", [["ALPHA ALPHA", { sa: "" }]]);
row("SHIFT then ALPHA = ALPHA on, SHIFT off", "§2", [["SHIFT ALPHA", { sa: "A" }]]);
row("ALPHA then a key with no red letter (7): nothing typed, ALPHA off", "§2", [["ALPHA 7", { expr: "", sa: "" }]]);
// Build 4 changed this row: it read expr "" ("the constant e is Build 4"); spec §2 "×10^x → e" and §9 "ALPHA ×10^x = the constant e"
row("ALPHA ×10^x types the constant e, ALPHA off", "§2 red letters, §9", [["ALPHA ×10x", { expr: "e", sa: "" }]]);
row("ALPHA is ONE-SHOT: ALPHA (−) (−) types A then a minus", "§2", [["ALPHA (−)", { expr: "A", sa: "" }], ["(−)", { expr: "A−" }]]);
[["(−)", "A"], ["°'\"", "B"], ["hyp", "C"], ["sin", "D"], ["cos", "E"], ["tan", "F"],
 [")", "X"], ["S⇔D", "Y"], ["M+", "M"], ["CALC", "="], ["∫", ":"]].forEach(([k, letter]) =>
  row(`ALPHA ${k} types the red ${letter}`, "§2 red letters", [[`ALPHA ${k}`, { expr: letter, sa: "" }]]));
{
  const c = freshCalc();
  const red = id => { const s = c.h.querySelector(`[data-keyid="${id}"] .kred`); return s ? s.textContent : null; };
  tick(red("calc") === "=" && red("intdx") === ":", `the red "=" on CALC and ":" on ∫ are printed on the key faces <span class="why">[§2]</span>`,
       `CALC "${red("calc")}", ∫ "${red("intdx")}"`);
}
row("every variable starts at 0", "§2 \"A = gives 0\"", [["ALPHA (−) =", { expr: "A", res: "0" }]]);
// Build 2: the error screen shows ONLY its three lines (spec §3), so the
// typed "2=3" is checked after Goto (◀) instead of on the error screen.
row("ALPHA CALC's \"=\" in a COMP line: Syntax ERROR for now (CALC/SOLVE are Build 5)", "build brief; §3 error screen", [
  ["2 ALPHA CALC 3 =", { res: "Syntax ERROR" }],
  ["◀", { expr: "2=3", res: "" }],
]);

section("Build 1 · STO, RCL, variables, M (spec §2)");

row("STO: value, SHIFT RCL shows STO, (−) stores into A with no =", "§2", [

  ["(−)", { expr: "5→A", res: "5", sto: false }],

]);

row("2A² with A = 5 gives 50 (the square binds to A first)", "§2", [
  ["5 SHIFT RCL (−) 2 ALPHA (−) x² =", { expr: "2A²", res: "50" }],
]);
row("letters multiply implicitly: A = 2, B = 3, AB = 6", "§2 implicit ×", [
  ["2 SHIFT RCL (−) 3 SHIFT RCL °'\" ALPHA (−) ALPHA °'\" =", { expr: "AB", res: "6" }],

row("letters multiply implicitly next to brackets: X = 4, 3(X+1) = 15", "§2 implicit ×", [
  ["4 SHIFT RCL ) 3 ( ALPHA ) + 1 ) =", { expr: "3(X+1)", res: "15" }],
]);
row("M+ shows 5M+ with result 5 and lights the M indicator", "§2", [

  ["5 M+", { expr: "5M+", res: "5", m: true }],

]);

/* ---- status line fits at 375 px (DOM bounding boxes, no screenshots) ----
   The worst case lights almost every mark at once: boxed A, M, STO, STAT,
   FREQ, D, Math and ▲▼. Nothing may wrap, overflow its slot, or move the
   D / Math / STAT marks from where they sit with nothing else lit. */
section("Build 1 · status line at 375 px (DOM measurement)");
function measureStatus(where, h, press) {
  const ind = h.querySelector(".calc-ind");
  const box = n => h.querySelector(`.calc-ind .ind-${n}`).getBoundingClientRect();
  press("SHIFT MODE ▼ 4 1 MODE 3 1 AC");          // FREQ on, STAT mode, back to the COMP screen
  const base = { stat: box("stat").left, drg: box("drg").left, math: box("math").left };
  press("5 M+ 1 = 2 = 3 = ▲ SHIFT RCL ALPHA");     // M, a history entry in the middle (▲▼), STO, then ALPHA
  const g = read(h);
  const lit = ["sa", "m", "sto", "stat", "freq", "drg", "math", "hist"];
  const texts = lit.map(n => h.querySelector(`.calc-ind .ind-${n}`).textContent);
  tick(g.sa === "A" && g.m && g.sto && g.hist === "▲▼" && texts.every(Boolean),
       `${where}: the worst case really lights A, M, STO, STAT, FREQ, D, Math, ▲▼`, `"${texts.join(" | ")}"`);
  const tops = lit.map(n => Math.round(box(n).top));
  const clipped = lit.filter(n => { const s = h.querySelector(`.calc-ind .ind-${n}`); return s.scrollWidth > s.clientWidth + 0.5; });
  tick(new Set(tops).size === 1 && ind.scrollWidth <= ind.clientWidth + 0.5 && clipped.length === 0 && ind.getBoundingClientRect().height <= 14,
       `${where}: one line, nothing clipped or overflowing`,
       `status line ${Math.round(ind.getBoundingClientRect().width)}×${Math.round(ind.getBoundingClientRect().height)} px, content ${ind.scrollWidth} px, clipped: ${clipped.join(",") || "none"}`);
  const moved = ["stat", "drg", "math"].filter(n => Math.abs(box(n).left - base[n]) > 0.5);
  tick(moved.length === 0, `${where}: STAT, D and Math do not move when the other marks light up`,
       `moved: ${moved.join(",") || "none"}`);
}
{
  // (a) the real overlay the learner opens from the floating button
  openCalculator();
  const scrim = document.querySelector(".calc-scrim");
  const press = seq => keyIds(seq).forEach(id => scrim.querySelector(`[data-keyid="${id}"]`).click());
  measureStatus(`overlay at ${window.innerWidth} px`, scrim, press);
  scrim.querySelector(".calc-close").click();       // detach it again so the page text ends with the summary
  // (b) the in-question calculator (.q-calc) inside this page's padded column
  const fit = document.getElementById("fitHost");
  const c = freshCalc(fit);
  measureStatus(`in-question calculator, ${Math.round(fit.getBoundingClientRect().width)} px wide`, fit, c.press);
  fit.innerHTML = "";
}

section("Build 2 · a missing \")\" closes itself (spec §4)");

row("sin(30 = ½", "§4 \"sin(30 = gives ½\"", [["sin 30 =", { expr: "sin(30", val: "1/2" }]]);
row("(2+3 = 5", "§4", [["( 2 + 3 =", { expr: "(2+3", val: "5" }]]);
row("sin(30+1 means sin(31) = 0,5150380749", "§4 the open bracket swallows the rest", [["sin 30 + 1 =", { val: "0,5150380749" }]]);

/* ---- DOM measurements: the long line and the error screen must fit the
   LCD at 375 px (the overlay) and in the in-question calculator ---- */
section("Build 2 · long lines and the error screen fit (DOM measurement)");
function measureBuild2(where, h, press) {
  const LONG = Array(6).fill("1234567890").join(" + ");   // 65 characters, about twice the line
  press("AC AC " + LONG);
  let g = read(h);
  let ex = h.querySelector(".lcd-expr");                 // the line is redrawn on every key: re-read it after each press
  const lcd = h.querySelector(".calc-lcd");
  tick(g.mark && g.curVis && ex.scrollLeft > ex.clientWidth / 2,
       `${where}: typing past the edge scrolls the line, the cursor stays in view and ◀ shows`,
       `◀ ${g.mark}, cursor visible ${g.curVis}, scrolled ${Math.round(ex.scrollLeft)} px of ${ex.scrollWidth} (line ${ex.clientWidth} px)`);
  press("=");
  g = read(h);
  tick(g.val === "7407407340" && !g.mark, `${where}: = answers 7407407340 and the line shows from its start (no ◀)`, `"${g.val}", ◀ ${g.mark}`);
  press("◀");
  g = read(h);
  tick(g.mark && g.curVis && g.cur === LONG.replace(/ /g, ""), `${where}: ◀ edits with the cursor at the end, still in view, ◀ shows`, `◀ ${g.mark}, cursor visible ${g.curVis}`);
  press(Array(40).fill("◀").join(" "));
  g = read(h); ex = h.querySelector(".lcd-expr");
  tick(g.mark && g.curVis && g.cur === LONG.replace(/ /g, "").slice(0, 25), `${where}: arrowing back past the left edge keeps the cursor in view, clear of ◀`,
       `◀ ${g.mark}, cursor visible ${g.curVis}, scrolled ${Math.round(ex.scrollLeft)} px`);
  press(Array(30).fill("◀").join(" "));
  g = read(h);
  tick(!g.mark && g.curVis && g.cur === "", `${where}: arrowing back to the start scrolls back, ◀ goes out`, `◀ ${g.mark}, cursor visible ${g.curVis}, before cursor "${g.cur}"`);
  press("AC 1 + 1 =");
  const hRes = lcd.getBoundingClientRect().height;
  press("2 + × 3 + 4 =");
  const hErr = lcd.getBoundingClientRect().height;
  const lines = [...h.querySelectorAll(".lcd-err > div")];
  const over = lines.filter(d => d.scrollWidth > d.clientWidth + 0.5 || d.getBoundingClientRect().right > lcd.getBoundingClientRect().right);
  tick(lines.length === 3 && over.length === 0 && Math.abs(hErr - hRes) < 0.5,
       `${where}: the three error lines fit inside the LCD and do not change its height`,
       `${lines.length} lines, overflowing: ${over.length}, LCD ${Math.round(hRes)} → ${Math.round(hErr)} px`);
  press("AC");
}
{
  openCalculator();
  const scrim = document.querySelector(".calc-scrim");
  const press = seq => keyIds(seq).forEach(id => scrim.querySelector(`[data-keyid="${id}"]`).click());
  press("ON AC");                                        // the overlay is a singleton: clear what the Build 1 block left lit
  measureBuild2(`overlay at ${window.innerWidth} px`, scrim, press);
  scrim.querySelector(".calc-close").click();
  const fit = document.getElementById("fitHost");
  const c = freshCalc(fit);
  measureBuild2(`in-question calculator, ${Math.round(fit.getBoundingClientRect().width)} px wide`, fit, c.press);
  fit.innerHTML = "";
}

/* every multiple of 15° from −360 to 720, sin cos tan, typed through the
   rendered keys: the answer must be EXACT (no decimal comma), and its S⇔D
   decimal must agree with Math.sin/cos/tan to 9 significant digits. tan at
   90° + 180°k must be Math ERROR. */
{
  const c = freshCalc();
  const miss = []; let n = 0;
  const num = s => Number(s.replace(/−/g, "-").replace(",", "."));
  for (let deg = -360; deg <= 720; deg += 15) {
    for (const fn of ["sin", "cos", "tan"]) {
      n++;
      const typed = deg < 0 ? `(−) ${-deg}` : `${deg}`;
      c.press(`AC ${fn} ${typed} =`);
      const g = read(c.h);
      if (fn === "tan" && ((deg % 180) + 180) % 180 === 90) { if (g.res !== "Math ERROR") miss.push(`tan(${deg}) = "${g.val}", want Math ERROR`); continue; }
      if (g.res === "Math ERROR" || g.res === "Syntax ERROR" || g.val.includes(",")) { miss.push(`${fn}(${deg}) = "${g.val}" is not exact`); continue; }
      c.press("S⇔D");
      const shown = num(read(c.h).val);
      const want = Math[fn](deg * Math.PI / 180);
      if (!(Math.abs(shown - want) <= 5e-9 * Math.abs(want) + 1e-12)) miss.push(`${fn}(${deg}) = ${g.val} → ${read(c.h).val}, Math.${fn} gives ${want.toPrecision(10)}`);
    }
  }
  tick(miss.length === 0 && n === 219, `sweep: sin, cos, tan of every multiple of 15° from −360 to 720 are exact and right to 9 significant digits <span class="why">[§5 "multiples of 15°"]</span>`,
       `${n} angles checked${miss.length ? "; " + miss.slice(0, 6).join("; ") : ""}`);
}

/* ---- a two-term stacked fraction and a π form must fit the LCD at 375 px
   (DOM bounding boxes, no screenshots) ---- */
section("Build 3 · exact answers fit the LCD (DOM measurement)");
function measureBuild3(where, h, press) {
  /* the RESULT line is compared with ½'s: a √ template on the ENTRY line
     already makes the LCD a few px taller (as for √2÷2 before Build 3),
     which is the entry line's doing, not the answer's */
  const lcd = h.querySelector(".calc-lcd");
  press("AC AC 1 ÷ 2 =");
  const hHalf = h.querySelector(".lcd-res").getBoundingClientRect().height;
  for (const [keys, want] of [["sin 15 =", "√6−√2/4"], ["sin (−) 105 =", "−√6+√2/4"], ["( √ 999 ▶ + √ 998 ▶ ) ÷ 7 =", "√998+3√111/7"], ["1234 π ÷ 56789 =", "1234/56789π"]]) {
    press("AC " + keys);
    const g = read(h);
    const res = h.querySelector(".lcd-res"), L = lcd.getBoundingClientRect();
    const fr = [...res.querySelectorAll(".calc-frac")].map(f => f.getBoundingClientRect());
    const inside = fr.every(b => b.left >= L.left && b.right <= L.right && b.top >= L.top && b.bottom <= L.bottom);
    const hNow = res.getBoundingClientRect().height;
    tick(g.val === want && res.scrollWidth <= res.clientWidth + 0.5 && inside && Math.abs(hNow - hHalf) < 0.5,
         `${where}: ${want} fits the result line, inside the LCD, as tall as ½`,
         `"${g.val}", line ${res.scrollWidth}/${res.clientWidth} px, fraction inside ${inside}, result line ${Math.round(hHalf)} → ${Math.round(hNow)} px`);
  }
  press("AC");
}
{
  openCalculator();
  const scrim = document.querySelector(".calc-scrim");
  const press = seq => keyIds(seq).forEach(id => scrim.querySelector(`[data-keyid="${id}"]`).click());
  press("AC ON AC");
  measureBuild3(`overlay at ${window.innerWidth} px`, scrim, press);
  scrim.querySelector(".calc-close").click();
  const fit = document.getElementById("fitHost");
  const c = freshCalc(fit);
  measureBuild3(`in-question calculator, ${Math.round(fit.getBoundingClientRect().width)} px wide`, fit, c.press);
  fit.innerHTML = "";
}

/* ---- DOM measurements at 375 px: the FIX tag in the busiest status line,
   the new templates on the entry line, the new result forms, the prompts ---- */
section("Build 4 · new marks, templates and forms fit (DOM measurement)");
function measureBuild4(where, h, press) {
  const lcd = h.querySelector(".calc-lcd");
  const L = () => lcd.getBoundingClientRect();
  const inside = el => { const b = el.getBoundingClientRect(), l = L(); return b.left >= l.left - 0.5 && b.right <= l.right + 0.5 && b.top >= l.top - 0.5 && b.bottom <= l.bottom + 0.5; };
  // (1) the busiest status line, now with FIX: A, M, STO, STAT, FREQ, FIX, D, Math, ▲▼
  press("ON AC SHIFT 9 3 = SHIFT MODE ▼ 4 1 MODE 3 1 AC");
  const box = n => h.querySelector(`.calc-ind .ind-${n}`).getBoundingClientRect();
  const base = { stat: box("stat").left, drg: box("drg").left, math: box("math").left };
  press("SHIFT MODE 6 2 5 M+ 1 = 2 = 3 = ▲ SHIFT RCL ALPHA");
  const ind = h.querySelector(".calc-ind");
  const lit = ["sa", "m", "sto", "stat", "freq", "fix", "drg", "math", "hist"];
  const texts = lit.map(n => h.querySelector(`.calc-ind .ind-${n}`).textContent);
  const clipped = lit.filter(n => { const s = h.querySelector(`.calc-ind .ind-${n}`); return s.scrollWidth > s.clientWidth + 0.5; });
  const tops = new Set(lit.map(n => Math.round(box(n).top)));
  const moved = ["stat", "drg", "math"].filter(n => Math.abs(box(n).left - base[n]) > 0.5);
  tick(texts.every(Boolean) && texts[5] === "FIX" && tops.size === 1 && clipped.length === 0 && ind.scrollWidth <= ind.clientWidth + 0.5 && moved.length === 0,
       `${where}: A, M, STO, STAT, FREQ, FIX, D, Math, ▲▼ all lit on one line, nothing clipped, STAT/D/Math unmoved`,
       `"${texts.join(" | ")}", ${Math.round(ind.getBoundingClientRect().width)} px line, content ${ind.scrollWidth} px, clipped: ${clipped.join(",") || "none"}, moved: ${moved.join(",") || "none"}`);
  press("ON AC SHIFT 9 3 =");
  // (2) each new template, alone on the entry line, sits inside the LCD and the line does not overflow
  for (const [keys, sel, what] of [["log□", ".calc-logb", "log□(□)"], ["SHIFT hyp", ".calc-abs", "|□|"], ["SHIFT frac", ".calc-mixed", "□ □/□"],
                                   ["SHIFT log", ".calc-tenpow", "10^□"], ["SHIFT ln", ".calc-tenpow", "e^□"], ["5 SHIFT ÷ 2", ".calc-comb", "5C2"], ["3 ×10x 5", ".calc-x10", "3×10 5"]]) {
    press("AC " + keys);
    const t = h.querySelector(".lcd-expr " + sel), ex = h.querySelector(".lcd-expr");
    tick(!!t && inside(t) && ex.scrollWidth <= ex.clientWidth + 0.5, `${where}: ${what} on the entry line sits inside the LCD`,
         t ? `line ${ex.scrollWidth}/${ex.clientWidth} px` : "not rendered");
  }
  // (3) the new result forms fit the result line, inside the LCD
  for (const [keys, want, field] of [["30 °'\" 15 °'\" 36 °'\" =", "30°15'36\"", "val"], ["100 ÷ 3 = SHIFT S⇔D", "33 1/3", "mixed"], ["SHIFT MODE 6 9 2 ÷ 3 = S⇔D", "0,666666667", "val"]]) {
    press("AC " + keys);
    const g = read(h), res = h.querySelector(".lcd-res");
    tick(g[field] === want && res.scrollWidth <= res.clientWidth + 0.5 && inside(res), `${where}: ${want} fits the result line, inside the LCD`,
         `"${g[field]}", line ${res.scrollWidth}/${res.clientWidth} px`);
  }
  // (4) SETUP page 1 with 8:Norm keeps its four rows (two columns, spec §16) inside the LCD;
  //     the two prompts sit inside the LCD and do not change its height
  press("AC");
  const h0 = L().height;
  press("SHIFT MODE");
  const items = [...h.querySelectorAll(".lcd-mi")];
  const rows = new Set(items.map(i => Math.round(i.getBoundingClientRect().top))).size;
  const lastTwo = items.slice(-2).map(i => i.textContent).join(" ");
  tick(items.length === 8 && rows === 4 && lastTwo === "7:Sci 8:Norm" && items.every(inside) && [...h.querySelectorAll(".calc-main > *")].every(inside),
       `${where}: SETUP page 1 shows 8 items in 4 rows, 7:Sci 8:Norm last, all inside the LCD`, `${items.length} items, ${rows} rows, last row "${lastTwo}"`);
  press("AC");
  for (const [keys, label] of [["SHIFT MODE 6", "the Fix 0~9? prompt"], ["SHIFT MODE 8", "the Norm 1~2? prompt"]]) {
    press(keys);
    const parts = [...h.querySelectorAll(".calc-main > *")];
    tick(parts.length > 0 && parts.every(inside) && Math.abs(L().height - h0) < 0.5, `${where}: ${label} sits inside the LCD and does not change its height`,
         `${parts.length} parts, LCD ${Math.round(h0)} → ${Math.round(L().height)} px`);
    press("AC");
  }
  press("SHIFT 9 3 = AC");
}
{
  openCalculator();
  const scrim = document.querySelector(".calc-scrim");
  const press = seq => keyIds(seq).forEach(id => scrim.querySelector(`[data-keyid="${id}"]`).click());
  measureBuild4(`overlay at ${window.innerWidth} px`, scrim, press);
  scrim.querySelector(".calc-close").click();
  const fit = document.getElementById("fitHost");
  const c = freshCalc(fit);
  measureBuild4(`in-question calculator, ${Math.round(fit.getBoundingClientRect().width)} px wide`, fit, c.press);
  fit.innerHTML = "";
}

{
  let good5 = 0; const misses = [];
  for (const [name, eq, guess, root] of SWEEP) {
    const c = freshCalc();
    let why = "";
    try {
      c.press(`${eq} SOLVE ${guess} =`);
      const g = read(c.h);
      const [xs = "", lrs = ""] = g.sv.split(" / ").map(s => s.slice(s.indexOf("=") + 1));
      const X = c.api.state().vars.X, stored = Number(X.n) / Number(X.d);
      const tol = 1e-9 * Math.max(1, Math.abs(root));
      const lr = shownNum(lrs);
      if (!g.sv) why = `no answer screen (${g.err || g.res || g.expr})`;
      else if (!(Math.abs(stored - root) <= tol)) why = `X stored ${stored}, want ${root}`;
      else if (!(Math.abs(shownNum(xs) - root) <= tol)) why = `X shown ${xs}, want ${root}`;
      else if (!(lrs === "0" || Math.abs(lr) <= 1e-9)) why = `L−R shown ${lrs}`;
    } catch (e) { why = "threw: " + e.message; }
    if (why) misses.push(`${name}: ${why}`); else good5++;
  }
  tick(misses.length === 0, `solver sweep: ${good5} of ${SWEEP.length} equations (linear, quadratics from both sides, finance exponentials, fraction equations, √, sin) land within 1e-9, L−R 0 or tiny <span class="why">[§11]</span>`,
       misses.join("; "));
  tick(SWEEP.length >= 30, `the sweep holds at least 30 equations <span class="why">[build brief]</span>`, `${SWEEP.length}`);
}

section("Build 5 · prompt and SOLVE screens fit (DOM measurement)");
function measureBuild5(where, h, press) {
  const lcd = h.querySelector(".calc-lcd");
  const L = () => lcd.getBoundingClientRect();
  const inside = el => { const b = el.getBoundingClientRect(), l = L(); return b.left >= l.left - 0.5 && b.right <= l.right + 0.5 && b.top >= l.top - 0.5 && b.bottom <= l.bottom + 0.5; };
  const textRight = el => { const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().right; };
  press("ON AC SHIFT 9 3 = AC 1 + 1 =");
  const h0 = L().height;
  // (1) the CALC prompt: label top left, value bottom right
  press("AC X x² + 1 CALC");
  let lab = h.querySelector(".lcd-pr-label"), res = h.querySelector(".lcd-res");
  const l = L(), lb = lab.getBoundingClientRect(), rb = res.getBoundingClientRect();
  tick(lb.left - l.left < 14 && lb.bottom <= rb.top + 0.5 && l.right - textRight(res) < 14 && inside(lab) && inside(res) && Math.abs(L().height - h0) < 0.5,
       `${where}: X? sits top left, the value 0 bottom right, both inside the LCD, height unchanged`,
       `label ${Math.round(lb.left - l.left)} px from the left, value ${Math.round(l.right - textRight(res))} px from the right, label bottom ${Math.round(lb.bottom)} vs value top ${Math.round(rb.top)}, LCD ${Math.round(h0)} → ${Math.round(L().height)} px`);
  const fLab = parseFloat(getComputedStyle(lab).fontSize);
  // (2) typing: big at the top left; a typed fraction keeps the LCD height
  press("3");
  let ex = h.querySelector(".lcd-expr"), fBig = parseFloat(getComputedStyle(ex).fontSize);
  tick(fBig > fLab && ex.getBoundingClientRect().left - L().left < 14 && h.querySelector(".lcd-res").textContent === "0",
       `${where}: a typed value shows BIG at the top left (${fBig}px against the label's ${fLab}px), the old value stays`, `font ${fBig}/${fLab} px`);
  press("AC X x² + 1 CALC frac 1 ▼ 2");
  const parts = [...h.querySelectorAll(".calc-main > *")];
  tick(parts.every(inside) && Math.abs(L().height - h0) < 0.5, `${where}: a typed fraction at the prompt fits and keeps the LCD height`,
       `LCD ${Math.round(h0)} → ${Math.round(L().height)} px`);
  press("AC X x² − 4 SOLVE");
  lab = h.querySelector(".lcd-pr-label");
  tick(lab && lab.textContent === "Solve for X" && inside(lab) && lab.getBoundingClientRect().height < 20, `${where}: "Solve for X" sits on one line inside the LCD`,
       lab ? `${Math.round(lab.getBoundingClientRect().width)}×${Math.round(lab.getBoundingClientRect().height)} px` : "missing");
  // (3) the SOLVE answer: three small lines, values right-aligned
  press("=");
  const rows = [...h.querySelectorAll(".lcd-sv-row")], eq = h.querySelector(".lcd-sv-eq");
  const fs = [eq, ...rows].map(e => parseFloat(getComputedStyle(e).fontSize));
  const flush = rows.every(r => { const v = r.querySelector(".lcd-sv-val"); return Math.abs(textRight(v) - r.getBoundingClientRect().right) < 1; });
  tick(rows.length === 2 && fs.every(f => f === fs[0] && f <= 13) && flush && [eq, ...rows].every(inside) && Math.abs(L().height - h0) < 0.5,
       `${where}: the answer is three small lines (${fs.join("/")} px), X= and L−R= values right-aligned, inside the LCD`,
       `${rows.length + 1} lines, right-aligned ${flush}, LCD ${Math.round(h0)} → ${Math.round(L().height)} px`);
  // (4) an equation too long for one line (with a fraction in it): cut off at the right, never wrapped
  press("AC frac X ▼ 3 ▶ + 1000 ( 1 , 08 ) x^ X ▶ + 123456789 X EQS 987654321 + 2 X + 1 + 5555 SOLVE =");
  const g = read(h);
  const eq2 = h.querySelector(".lcd-sv-eq"), rows2 = [...h.querySelectorAll(".lcd-sv-row")];
  const fr = eq2 && eq2.querySelector(".calc-frac");
  tick(g.sv.startsWith("X=8,0000") && eq2.scrollWidth > eq2.clientWidth && eq2.getBoundingClientRect().height < 40 && inside(eq2) && rows2.every(inside)
       && rows2.every(r => r.scrollWidth <= r.clientWidth + 0.5) && Math.abs(L().height - h0) < 0.5 && fr && inside(fr),
       `${where}: a long equation is cut off at the right on its one line, X= and L−R= still fit, LCD height unchanged`,
       `"${g.sv}", line ${eq2.scrollWidth}/${eq2.clientWidth} px, ${Math.round(eq2.getBoundingClientRect().height)} px high, LCD ${Math.round(h0)} → ${Math.round(L().height)} px`);
  // (5) Can't Solve: the three error lines fit
  press("AC X x² + 1 SOLVE =");
  const lines = [...h.querySelectorAll(".lcd-err > div")];
  tick(lines.length === 3 && lines.every(inside) && lines.every(d => d.scrollWidth <= d.clientWidth + 0.5) && Math.abs(L().height - h0) < 0.5,
       `${where}: Can't Solve shows its three lines inside the LCD`, `${lines.map(d => d.textContent).join(" / ")}`);
  press("AC SHIFT 9 3 = AC");
}

/* Build 6 fields, read by readT (read() plus the table): tbl — the 3
   visible rows, each "rownumber|X|F(X)[|G(X)]" (a raised ×10 power as
   ^power), joined by " / "; head — the column headings "X|F(X)|G(X)";
   lit — the lit heading; sel — the selected cell as "rownumber:heading"
   ("1:X"). On the table screen val / res are the bottom line. */
function readT(h) {
  const g = read(h), t = h.querySelector(".lcd-tbl");
  if (!t) return { ...g, tbl: "", head: "", lit: "", sel: "" };
  const txt = c => { const k = c.cloneNode(true); k.querySelectorAll(".calc-x10-exp").forEach(s => { s.textContent = "^" + s.textContent; }); return k.textContent; };
  const heads = [...t.rows[0].cells].slice(1).map(txt);
  const sc = t.querySelector("td.lcd-tbl-sel"), lit = t.querySelector("th.lcd-tbl-lit");
  const sel = sc ? `${sc.parentElement.cells[0].textContent}:${heads[[...sc.parentElement.cells].indexOf(sc) - 1]}` : "";
  return { ...g, tbl: [...t.rows].slice(1).map(r => [...r.cells].map(txt).join("|")).join(" / "), head: heads.join("|"), lit: lit ? lit.textContent : "", sel };
}
function trow(name, spec, steps) {
  const c = freshCalc();
  const diffs = [];
  try {
    steps.forEach(([keys, want]) => {
      c.press(keys);
      const got = readT(c.h);
      for (const k of Object.keys(want)) {
        if (got[k] !== want[k]) diffs.push(`after "${keys}": ${k} = ${JSON.stringify(got[k])}, want ${JSON.stringify(want[k])}`);
      }
    });
  } catch (e) { diffs.push("threw: " + e.message); }
  tick(diffs.length === 0, `${name} <span class="why">[${spec}]</span>`, diffs.join("; "));
}

/* ---- DOM measurements at 375 px: the table with f AND g and the widest
   cells, the empty lit row, Insufficient MEM, a long f(X)= line ---- */
section("Build 6 · the table fits the LCD (DOM measurement)");
function measureBuild6(where, h, press) {
  const lcd = h.querySelector(".calc-lcd");
  const L = () => lcd.getBoundingClientRect();
  const inside = el => { const b = el.getBoundingClientRect(), l = L(); return b.left >= l.left - 0.5 && b.right <= l.right + 0.5 && b.top >= l.top - 0.5 && b.bottom <= l.bottom + 0.5; };
  const textRight = el => { const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().right; };
  const unclipped = el => el.scrollWidth <= el.clientWidth + 0.5;
  press("AC ON AC SHIFT 9 3 = AC");
  const h0 = L().height;
  // (1) f = −X⁷ and g = −1÷X from 18 to 20: row numbers + X + F(X) + G(X), the widest cells (×10 forms, −0,055)
  press("MODE 7 (−) X x^ 7 ▶ = (−) 1 ÷ X = 18 = 20 = 1 =");
  const t = h.querySelector(".lcd-tbl");
  const cells = t ? [...t.querySelectorAll("th,td")] : [];
  const g = readT(h);
  tick(!!t && g.head === "X|F(X)|G(X)" && cells.length === 16 && cells.every(inside) && cells.every(unclipped) && unclipped(t.parentElement) && Math.abs(L().height - h0) < 0.5,
       `${where}: the table (row numbers, X, F(X), G(X)) sits inside the LCD, no cell cut, LCD height unchanged`,
       `"${g.tbl}", LCD ${Math.round(h0)} → ${Math.round(L().height)} px, ${cells.filter(c => !inside(c)).length} cells outside, ${cells.filter(c => !unclipped(c)).length} clipped`);
  const nCell = t && t.rows[1].cells[0], xCell = t && t.rows[1].cells[1];
  tick(!!t && nCell.getBoundingClientRect().width < xCell.getBoundingClientRect().width / 2 && parseFloat(getComputedStyle(nCell).fontSize) < parseFloat(getComputedStyle(xCell).fontSize),
       `${where}: the row-number column is narrow and its numbers small`,
       t ? `${Math.round(nCell.getBoundingClientRect().width)} px / ${getComputedStyle(nCell).fontSize} against ${Math.round(xCell.getBoundingClientRect().width)} px / ${getComputedStyle(xCell).fontSize}` : "no table");
  const lcdBg = getComputedStyle(lcd).backgroundColor, lcdInk = getComputedStyle(lcd).color;
  const rev = el => !!el && getComputedStyle(el).backgroundColor === lcdInk && getComputedStyle(el).color === lcdBg;
  const plain = t && t.rows[2].cells[2];
  tick(rev(t && t.querySelector("td.lcd-tbl-sel")) && rev(t && t.querySelector("th.lcd-tbl-lit")) && getComputedStyle(plain).backgroundColor === "rgba(0, 0, 0, 0)",
       `${where}: the selected cell and its column heading are in reverse colours, the others not`, `ink ${lcdInk}, LCD ${lcdBg}`);
  // (2) the bottom line: big, right-aligned, the longest values fit
  const fCell = xCell ? parseFloat(getComputedStyle(xCell).fontSize) : NaN;   // read before the next key redraws the table
  press("▶ ▼ ▼");
  const res = h.querySelector(".lcd-res");
  const fRes = parseFloat(getComputedStyle(res).fontSize);
  tick(readT(h).val === "−1280000000" && inside(res) && unclipped(res) && L().right - textRight(res) < 14 && fRes > 2 * fCell && Math.abs(L().height - h0) < 0.5,
       `${where}: the bottom line −1280000000 is big (${fRes}px against ${fCell}px cells), right-aligned and whole`,
       `"${readT(h).val}", ${Math.round(L().right - textRight(res))} px from the right, LCD ${Math.round(L().height)} px`);
  // (3) the empty lit row past the end keeps the height
  press("▼");
  tick(readT(h).sel === "4:F(X)" &&[...h.querySelectorAll(".lcd-tbl th,.lcd-tbl td")].every(inside) && Math.abs(L().height - h0) < 0.5,
       `${where}: the empty lit row fits, LCD height unchanged`, `${readT(h).tbl}`);
  // (4) Insufficient MEM: the three lines fit
  press("AC AC MODE 7 X = = 1 = 21 = 1 =");
  const lines = [...h.querySelectorAll(".lcd-err > div")];
  tick(lines.length === 3 && lines[0].textContent === "Insufficient MEM" && lines.every(inside) && lines.every(unclipped) && Math.abs(L().height - h0) < 0.5,
       `${where}: Insufficient MEM shows its three lines inside the LCD`, lines.map(d => d.textContent).join(" / "));
  // (5) a long f(X)= line scrolls with the cursor, ◀ marker showing
  press("AC AC X x² + 123456789 X + 987654321 X + 5555 X + 1234567 X + 7654321");
  const r5 = read(h);
  tick(r5.mark && r5.curVis && Math.abs(L().height - h0) < 0.5, `${where}: a long f(X)= line scrolls, the cursor in view and the ◀ marker showing`,
       `mark ${r5.mark}, cursor visible ${r5.curVis}, LCD ${Math.round(L().height)} px`);
  press("AC ON AC SHIFT 9 3 = AC");
}
{

/* ============================================================
   BUILD 7 — EQN = MODE 5 (spec section 13)
   ============================================================ */
/* Build 7 fields, read by readE (read() plus the coefficient grid): head —
   the column headings on show, "a|b|c"; grid — each row's cells "v|v|v",
   with "n:" in front for the systems' row numbers, rows joined by " / ";
   sel — the selected cell "row:heading" ("1:a"; row 1 for one-row grids
   too); brk — the matrix brackets on show, "[]", "[", "]" or ""; typed —
   the entry at the bottom left ("" when nothing is typed); ineq — the
   inequality under an INEQ grid. On the grid, val is the bottom-right
   value; on an answer, expr is the label (top left) and val the value. */
function readE(h) {
  const g = read(h), t = h.querySelector(".lcd-eqn");
  const ti = h.querySelector(".lcd-eqn-in .lcd-expr"), iq = h.querySelector(".lcd-ineq");
  const base = { ...g, typed: ti ? ti.textContent : "", ineq: iq ? iq.textContent : "" };
  if (!t) return { ...base, head: "", grid: "", sel: "", brk: "" };
  const data = row => [...row.cells].filter(c => !c.classList.contains("lcd-tbl-n") && !c.classList.contains("lcd-eqn-bk"));
  const txt = c => { const k = c.cloneNode(true); k.querySelectorAll(".calc-x10-exp").forEach(s => { s.textContent = "^" + s.textContent; }); return k.textContent; };
  const heads = data(t.rows[0]).map(c => c.textContent), rows = [...t.rows].slice(1);
  const grid = rows.map(r => { const n = r.querySelector(".lcd-tbl-n"); return (n ? n.textContent + ":" : "") + data(r).map(txt).join("|"); }).join(" / ");
  const sc = t.querySelector("td.lcd-tbl-sel");
  const sel = sc ? `${rows.indexOf(sc.parentElement) + 1}:${heads[data(sc.parentElement).indexOf(sc)]}` : "";
  const brk = (t.querySelector(".lcd-eqn-bl") ? "[" : "") + (t.querySelector(".lcd-eqn-br") ? "]" : "");
  return { ...base, head: heads.join("|"), grid, sel, brk };
}
function erow(name, spec, steps) {
  const c = freshCalc();
  const diffs = [];
  try {
    steps.forEach(([keys, want]) => {
      c.press(keys);
      const got = readE(c.h);
      for (const k of Object.keys(want)) {
        if (got[k] !== want[k]) diffs.push(`after "${keys}": ${k} = ${JSON.stringify(got[k])}, want ${JSON.stringify(want[k])}`);
      }
    });
  } catch (e) { diffs.push("threw: " + e.message); }
  tick(diffs.length === 0, `${name} <span class="why">[${spec}]</span>`, diffs.join("; "));
}
/* a number as keys: (−) for a negative */
const nk = n => (n < 0 ? `(−) ${-n}` : String(n));
/* the exact answer the LCD shows for p/q, as read() reads it ("−1/4", "3") */
const gcd7 = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
const fr7 = (p, q = 1) => { if (q < 0) { p = -p; q = -q; } const g = gcd7(p, q); p /= g; q /= g; return (p < 0 ? "−" : "") + Math.abs(p) + (q === 1 ? "" : "/" + q); };
/* a deterministic random source for the sweeps */
let seed7 = 20261004;
const rnd7 = (lo, hi) => { seed7 = (Math.imul(seed7, 1103515245) + 12345) >>> 0; return lo + ((seed7 >>> 8) % (hi - lo + 1)); };
/* type every coefficient of a grid, each followed by =, then = to solve */
const fillKeys = cs => cs.map(n => `${nk(n)} =`).join(" ") + " =";

section("Build 7 · more systems, roots and errors (Blipwork choices where the spec is silent)");

]);

  ["MODE 5 4 1 = 0 = 0 = (−) 1 = =", { expr: "X₁=", val: "1" }], ["=", { expr: "X₂=", val: "−1/2+(√3/2)i" }], ["=", { expr: "X₃=", val: "−1/2−(√3/2)i" }],
]);

]);

]);

  [`7 SHIFT RCL ) 1 + 1 = ${QD} MODE 1 Ans =`, { val: "2" }], ["RCL )", { expr: "X", val: "7" }],
]);

/* ---- sweeps: answers computed here, independently of calculator.js ---- */
section("Build 7 · sweep: 44 quadratics with whole-number roots");
for (let k = 0; k < 44; k++) {
  const a = [1, -1, 2, -2, 3, -3, 1, 1][rnd7(0, 7)];
  const r1 = rnd7(-9, 9), r2 = k % 9 === 0 ? r1 : rnd7(-9, 9);
  const b = -a * (r1 + r2), c = a * r1 * r2, mm = a > 0 ? "Minimum" : "Maximum";
  const want = r1 === r2 ? [["X=", fr7(r1)]] : [["X₁=", fr7(Math.max(r1, r2))], ["X₂=", fr7(Math.min(r1, r2))]];
  want.push([`X-Value ${mm}=`, fr7(r1 + r2, 2)], [`Y-Value ${mm}=`, fr7(-a * (r1 - r2) ** 2, 4)]);
  const steps = want.map(([expr, val], i) => [i === 0 ? `MODE 5 3 ${fillKeys([a, b, c])}` : "=", { expr, val }]);
  steps.push(["=", { sel: "1:a", grid: [a, b, c].map(n => fr7(n)).join("|") }]);
  erow(`${a}X² ${b < 0 ? "−" : "+"} ${Math.abs(b)}X ${c < 0 ? "−" : "+"} ${Math.abs(c)}: roots ${r1}, ${r2}`, "§13 sweep", steps);
}

section("Build 7 · sweep: 24 systems of two equations");
for (let k = 0; k < 24; k++) {
  let a1, b1, a2, b2, det;
  do { a1 = rnd7(-9, 9); b1 = rnd7(-9, 9); a2 = rnd7(-9, 9); b2 = rnd7(-9, 9); det = a1 * b2 - b1 * a2; } while (det === 0);
  let c1, c2;
  if (k % 2 === 0) { const x = rnd7(-9, 9), y = rnd7(-9, 9); c1 = a1 * x + b1 * y; c2 = a2 * x + b2 * y; }   // whole-number answers
  else { c1 = rnd7(-20, 20); c2 = rnd7(-20, 20); }                                                        // fraction answers
  const X = fr7(c1 * b2 - b1 * c2, det), Y = fr7(a1 * c2 - c1 * a2, det);
  erow(`${a1}x+${b1}y=${c1}, ${a2}x+${b2}y=${c2} → X= ${X}, Y= ${Y}`, "§13 sweep", [
    [`MODE 5 1 ${fillKeys([a1, b1, c1, a2, b2, c2])}`, { expr: "X=", val: X }], ["=", { expr: "Y=", val: Y }], ["=", { sel: "1:a" }],
  ]);
}

section("Build 7 · sweep: 8 systems of three equations, 12 cubics, 16 quadratics checked as decimals");
for (let k = 0; k < 8; k++) {
  let A, det;
  do {
    A = [0, 1, 2].map(() => [0, 1, 2].map(() => rnd7(-5, 5)));
    det = A[0][0] * (A[1][1] * A[2][2] - A[1][2] * A[2][1]) - A[0][1] * (A[1][0] * A[2][2] - A[1][2] * A[2][0]) + A[0][2] * (A[1][0] * A[2][1] - A[1][1] * A[2][0]);
  } while (det === 0);
  const s = [rnd7(-5, 5), rnd7(-5, 5), rnd7(-5, 5)];
  const cs = A.flatMap(r => [...r, r[0] * s[0] + r[1] * s[1] + r[2] * s[2]]);
  erow(`three unknowns → X= ${s[0]}, Y= ${s[1]}, Z= ${s[2]}`, "§13 sweep", [
    [`MODE 5 2 ${fillKeys(cs)}`, { expr: "X=", val: fr7(s[0]) }], ["=", { expr: "Y=", val: fr7(s[1]) }], ["=", { expr: "Z=", val: fr7(s[2]) }],
  ]);
}
for (let k = 0; k < 12; k++) {
  const a = rnd7(0, 1) ? 1 : -1, rs = [rnd7(-6, 6), rnd7(-6, 6), k % 4 === 0 ? null : rnd7(-6, 6)];
  if (rs[2] === null) rs[2] = rs[0];   // some with a repeated root
  const [p, q, r] = rs;
  const cs = [a, -a * (p + q + r), a * (p * q + p * r + q * r), -a * p * q * r];
  const distinct = [...new Set(rs)].sort((x, y) => x - y);
  const order = [distinct[0], ...distinct.slice(1).reverse()];   // the Blipwork rule: smallest, then the rest bigger first
  const labels = order.length === 1 ? ["X="] : order.map((_, i) => `X${"₁₂₃"[i]}=`);
  erow(`cubic with roots ${rs.join(", ")} → ${order.join(", ")}`, "§13 sweep; order rule", [
    ...order.map((v, i) => [i === 0 ? `MODE 5 4 ${fillKeys(cs)}` : "=", { expr: labels[i], val: fr7(v) }]), ["=", { sel: "1:a" }],
  ]);
}
{
  const fails = [];
  for (let k = 0; k < 16; k++) {
    const a = (rnd7(1, 5)) * (rnd7(0, 1) ? 1 : -1), b = rnd7(-12, 12), c = rnd7(-12, 12), D = b * b - 4 * a * c;
    const cc = freshCalc();
    cc.press(`MODE 5 3 ${fillKeys([a, b, c])}`);
    const num = s => Number(s.replace(/−/g, "-").replace(",", "."));
    const g1 = readE(cc.h);
    const close = (s, w) => Math.abs(num(s) - w) <= 1e-9 * Math.max(1, Math.abs(w));
    if (D > 0) {
      const want = [(-b + Math.sqrt(D)) / (2 * a), (-b - Math.sqrt(D)) / (2 * a)].sort((x, y) => y - x);
      cc.press("S⇔D"); const x1 = readE(cc.h);
      cc.press("= S⇔D"); const x2 = readE(cc.h);
      if (g1.expr !== "X₁=" || x2.expr !== "X₂=" || !close(x1.val, want[0]) || !close(x2.val, want[1])) fails.push(`${a},${b},${c}: ${x1.val} / ${x2.val}, want ${want.join(" / ")}`);
      cc.press("=");   // → X-Value
    } else if (D === 0) {
      cc.press("S⇔D"); const x = readE(cc.h);
      if (g1.expr !== "X=" || !close(x.val, -b / (2 * a))) fails.push(`${a},${b},${c}: double root ${x.val}`);
      cc.press("=");
    } else {
      if (g1.expr !== "X₁=" || !g1.val.endsWith("i")) fails.push(`${a},${b},${c}: ${g1.expr} ${g1.val}`);
      cc.press("= =");
    }
    cc.press("S⇔D");
    const mm = readE(cc.h), xv = -b / (2 * a);
    if (mm.expr !== `X-Value ${a > 0 ? "Minimum" : "Maximum"}=` || Math.abs(num(mm.val) - xv) > 1e-9) fails.push(`${a},${b},${c}: ${mm.expr} ${mm.val}, want ${xv}`);
  }
  tick(fails.length === 0, `16 random quadratics: the exact roots, as decimals, match (−b ± √D)/2a, bigger root first; the turning point's X matches <span class="why">[§13 sweep]</span>`, fails.join("; "));
}

/* ---- DOM measurements at 375 px: the type menu, the widest grid, a typed
   fraction, the slid cubic view, the long X-Value Minimum= label, a long
   decimal complex root, the error screen ---- */
section("Build 7 · the EQN screens fit the LCD (DOM measurement)");
function measureBuild7(where, h, press) {
  const lcd = h.querySelector(".calc-lcd");
  const L = () => lcd.getBoundingClientRect();
  const inside = el => { const b = el.getBoundingClientRect(), l = L(); return b.left >= l.left - 0.5 && b.right <= l.right + 0.5 && b.top >= l.top - 0.5 && b.bottom <= l.bottom + 0.5; };
  const textRight = el => { const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().right; };
  const unclipped = el => el.scrollWidth <= el.clientWidth + 0.5;
  const same = h0 => Math.abs(L().height - h0) < 0.5;
  press("AC ON AC SHIFT 9 3 = AC");
  const h0 = L().height;
  // (1) the type menu: four items, one per line
  press("MODE 5");
  const items = [...h.querySelectorAll(".lcd-mi")];
  const tops = new Set(items.map(i => Math.round(i.getBoundingClientRect().top))).size;
  tick(items.length === 4 && tops === 4 && items.every(inside) && items.every(i => i.getBoundingClientRect().height < 20) && same(h0),
       `${where}: MODE 5 shows the four types one per line, inside the LCD, height unchanged`, `${items.length} items on ${tops} lines, LCD ${Math.round(h0)} → ${Math.round(L().height)} px`);
  // (2) the three-unknown grid with the widest cells: row numbers, brackets, 3 rows
  press(`2 ${["(−) 12345", "123456", "(−) 1 ÷ 3", "(−) 99999", "(−) 1 ÷ 7", "2 x^ 30", "1 ÷ 3"].map(s => s + " =").join(" ")} ◀ ◀ ◀ ▶`);
  const t = h.querySelector(".lcd-eqn"), cells = t ? [...t.querySelectorAll("th,td")] : [];
  const g = readE(h);
  tick(!!t && g.grid === "1:−12345|123456|−0,333 / 2:−0,142|1,07×10^9|0,3333 / 3:0|0|0" && cells.every(inside) && cells.every(unclipped) && unclipped(t.parentElement) && same(h0),
       `${where}: the three-row grid (row numbers, brackets, the widest cells) sits inside the LCD, no cell cut, height unchanged`,
       `"${g.grid}", LCD ${Math.round(L().height)} px, ${cells.filter(c => !inside(c)).length} outside, ${cells.filter(c => !unclipped(c)).length} cut`);
  const lbr = t && t.querySelector("td.lcd-eqn-bl"), first = t && t.rows[1].cells[2];
  tick(!!lbr && !!first && getComputedStyle(lbr).borderLeftStyle === "solid" && lbr.getBoundingClientRect().right <= first.getBoundingClientRect().left + 0.5
       && t.rows[1].cells[0].getBoundingClientRect().right <= lbr.getBoundingClientRect().left + 0.5,
       `${where}: the "[" sits between the row numbers and column a`, "");
  const lcdBg = getComputedStyle(lcd).backgroundColor, lcdInk = getComputedStyle(lcd).color;
  const rev = el => !!el && getComputedStyle(el).backgroundColor === lcdInk && getComputedStyle(el).color === lcdBg;
  const selCell = t && t.querySelector("td.lcd-tbl-sel"), others = t ? [...t.querySelectorAll("td:not(.lcd-tbl-sel), th")] : [];
  tick(rev(selCell) && selCell.textContent === "1,07×109" && others.every(c => !rev(c)),
       `${where}: the selected cell (2^30, row 2 column b) is in reverse colours, no other cell or heading is`, `ink ${lcdInk}, LCD ${lcdBg}`);
  const res = h.querySelector(".lcd-res");
  tick(g.val === "1073741824" && inside(res) && L().right - textRight(res) < 14 && same(h0),
       `${where}: the selected value shows big at the bottom right`, `"${g.val}", ${Math.round(L().right - textRight(res))} px from the right`);
  // (3) a typed fraction at the bottom left keeps the height
  press("frac 1 ▼ 3");
  const tin = h.querySelector(".lcd-eqn-in");
  tick(!!tin && inside(tin) && tin.getBoundingClientRect().left - L().left < 14 && [...h.querySelectorAll(".calc-main > *")].every(inside) && same(h0),
       `${where}: a typed fraction shows at the bottom LEFT, inside the LCD, height unchanged`, `LCD ${Math.round(h0)} → ${Math.round(L().height)} px`);
  // (4) the slid view of the cubic
  press("AC MODE 5 4 ▶ ▶ ▶");
  const g4 = readE(h), c4 = [...h.querySelectorAll(".lcd-eqn th,.lcd-eqn td")];
  tick(g4.head === "b|c|d" && g4.brk === "]" && c4.every(inside) && same(h0), `${where}: the cubic's view slides to b c d with "]", inside the LCD`, `${g4.head} ${g4.brk}`);
  // (5) the long label and an answer
  press(`AC MODE 5 3 1 = (−) 5 = 6 = = = =`);
  const lab = h.querySelector(".lcd-pr-label"), val = h.querySelector(".lcd-res");
  tick(!!lab && lab.textContent === "X-Value Minimum=" && inside(lab) && lab.getBoundingClientRect().height < 20 && inside(val) && L().right - textRight(val) < 14 && same(h0),
       `${where}: "X-Value Minimum=" sits on one line top left, the value bottom right, height unchanged`,
       lab ? `${Math.round(lab.getBoundingClientRect().width)}×${Math.round(lab.getBoundingClientRect().height)} px, LCD ${Math.round(L().height)} px` : "missing");
  // (6) complex roots, exact and as long decimals, fit on their line
  press("AC MODE 5 3 3 = 2 = 1 = =");
  const v6 = () => h.querySelector(".lcd-res");
  const ok6a = inside(v6()) && unclipped(v6()) && same(h0) && readE(h).val === "−1/3+(√2/3)i";
  press("S⇔D");
  tick(ok6a && readE(h).val === "−0,3333333333+0,4714045208i" && inside(v6()) && unclipped(v6()) && same(h0),
       `${where}: a complex root fits, exact and as a long decimal (the font steps down)`, `font ${getComputedStyle(v6()).fontSize}, ${v6().scrollWidth}/${v6().clientWidth} px`);
  // (7) Math ERROR from solving: the three lines fit
  press("AC MODE 5 3 =");
  const lines = [...h.querySelectorAll(".lcd-err > div")];
  tick(lines.length === 3 && lines[0].textContent === "Math ERROR" && lines.every(inside) && lines.every(unclipped) && same(h0),
       `${where}: Math ERROR shows its three lines inside the LCD`, lines.map(d => d.textContent).join(" / "));
  press("AC ON AC SHIFT 9 3 = AC");
}
{
  openCalculator();
  const scrim = document.querySelector(".calc-scrim");
  const press = seq => keyIds(seq).forEach(id => scrim.querySelector(`[data-keyid="${id}"]`).click());
  measureBuild7(`overlay at ${window.innerWidth} px`, scrim, press);
  scrim.querySelector(".calc-close").click();
  const fit = document.getElementById("fitHost");
  const c = freshCalc(fit);
  measureBuild7(`in-question calculator, ${Math.round(fit.getBoundingClientRect().width)} px wide`, fit, c.press);
  fit.innerHTML = "";
}

/* ============================================================
   ONE summary line, at the very end (tools/harness_run.py)
   ============================================================ */
const ok = good === total;
const status = document.getElementById("status");
status.className = ok ? "pass" : "fail";
status.textContent = ok ? `✓ all ${total} rows match the device` : `✗ ${total - good} of ${total} rows do not match`;
document.getElementById("summary").textContent = ok
  ? `Casio calculator spec: ${good}/${total} passed`
  : `FAIL: ${total - good} of ${total} rows (${good}/${total} matching)`;
window.__VERIFY__ = { total, passed: good, ok, fails: bad };
console.log(`[verify-calc-casio] ${good}/${total} — ${ok ? "OK" : "FAIL"}`);
if (bad.length) console.log("MISMATCHES:\n" + bad.join("\n"));
</script>

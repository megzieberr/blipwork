<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equations &amp; Inequalities · verification</title>
<link rel="stylesheet" href="./css/styles.css">
<style>
  body{font-family:"JetBrains Mono",monospace;padding:24px;max-width:1100px;margin:0 auto}
  #banner{font-weight:700;font-size:18px;padding:14px 18px;border-radius:14px;margin:14px 0 22px;border:1px solid var(--brd)}
  #banner.pass{background:var(--good-bg);color:var(--good)} #banner.fail{background:var(--bad-bg);color:var(--bad)}
  pre{white-space:pre-wrap;font-size:12px;color:var(--muted);background:rgba(255,255,255,.03);padding:12px;border-radius:10px;border:1px solid var(--brd)}
  h2{font-size:15px;margin:22px 0 10px}
  .sample{background:rgba(255,255,255,.03);border:1px solid var(--brd);border-radius:12px;padding:12px;margin:8px 0}
  .sample .p{font-size:14px;margin-bottom:8px}
  .sample .o{font-size:12px;color:var(--muted)} .sample .o b{color:var(--good)}
  .sample .g svg{max-width:420px}
</style>
</head>
<body>
<h1 style="font-family:'Space Grotesk',sans-serif">Equations &amp; Inequalities · verification</h1>
<div id="banner">running…</div>

<h2>Quests — 9 theory quests (mc / yesno, some with to-scale parabola sketches)</h2>
<pre id="quests">…</pre>

<h2>eq9 “Two, one or no solution?” — the classification table, swept</h2>
<pre id="eq9">…</pre>

<h2>One live sample per skill (eyeball the maths &amp; the marked answer)</h2>
<div id="samples"></div>

<script type="module">
import { questDef } from "./js/quests/index.js";
import { CHAPTERS } from "./js/config.js";
import { getConcept } from "./js/concepts.js";
import { renderFunction, verifyFunction } from "./js/engine/function-graph.js";
import { solutionCount, OPT_TWO, OPT_ONE, OPT_NONE } from "./js/quests/queseq9-solution-count.js";

let total = 0, passed = 0; const fails = [];
const tick = (cond, label) => { total++; if (cond) passed++; else fails.push(label); return cond; };

const chapter = CHAPTERS.find(c => c.id === "eqn");
const RUNS = 400;
const lines = [];
let qTotalChecks = 0, qFails = 0, graphsChecked = 0, graphFails = 0;
const samples = [];

chapter.quests.forEach(qmeta => {
  const def = questDef(qmeta.id);
  const skillIssues = {};
  if (!def) { tick(false, `${qmeta.id} has no def`); lines.push(`✗ ${qmeta.id} — no quest def registered`); return; }
  def.skills.forEach(skill => {
    if (!getConcept(skill.concept)) skillIssues[skill.id] = `missing concept "${skill.concept}"`;
    let firstQ = null;
    for (let i = 0; i < RUNS; i++) {
      let q;
      try { q = skill.gen(); }
      catch (e) { skillIssues[skill.id] = "threw: " + e.message; break; }
      if (!firstQ) firstQ = q;
      qTotalChecks++;
      if (!q.prompt || !String(q.prompt).trim()) { skillIssues[skill.id] = "empty prompt"; qFails++; }
      if (!q.answerLabel) { skillIssues[skill.id] = "no answerLabel"; qFails++; }
      if (q.concept && !getConcept(q.concept)) { skillIssues[skill.id] = `q.concept "${q.concept}" not found`; qFails++; }
      if (q.type === "mc" || q.type === "reason") {
        const labels = q.options.map(o => o.label);
        const corrects = q.options.filter(o => o.correct).length;
        if (corrects !== 1) { skillIssues[skill.id] = `has ${corrects} correct options`; qFails++; }
        if (labels.length !== new Set(labels).size) { skillIssues[skill.id] = `duplicate options: ${labels.join(" | ")}`; qFails++; }
        if (q.options.length < 3) { skillIssues[skill.id] = `only ${q.options.length} options`; qFails++; }
      } else if (q.type === "yesno") {
        if (typeof q.yes !== "boolean") { skillIssues[skill.id] = "q.yes not boolean"; qFails++; }
      } else {
        skillIssues[skill.id] = `unexpected type "${q.type}" (theory chapter expects mc/yesno)`; qFails++;
      }
      // every generated parabola sketch must verify TO SCALE with the engine's own prover
      if (q.graph) {
        graphsChecked++;
        if (q.graph.type !== "function") { skillIssues[skill.id] = `graph type "${q.graph.type}" (expected function)`; graphFails++; }
        else {
          try {
            const rep = verifyFunction(q.graph);
            const bad = rep.filter(r => !r.ok);
            if (bad.length) { skillIssues[skill.id] = `graph verify: ${bad.map(b => b.label).join("; ")}`; graphFails++; }
          } catch (e) { skillIssues[skill.id] = "graph verify threw: " + e.message; graphFails++; }
        }
      }
    }
    if (firstQ) samples.push({ quest: qmeta.id, skill: skill.id, q: firstQ });
  });
  const bad = Object.keys(skillIssues);
  tick(bad.length === 0, `${qmeta.id} ${qmeta.title}`);
  lines.push(`${bad.length === 0 ? "✓" : "✗"} ${qmeta.id}  ${qmeta.title}  (${def.skills.length} skills × ${RUNS})`
    + (bad.length ? "\n    " + bad.map(b => `${b}: ${skillIssues[b]}`).join("\n    ") : ""));
});

document.getElementById("quests").textContent =
  `${qTotalChecks} generations checked · ${qFails} integrity failures\n`
  + `${graphsChecked} parabola sketches verified to scale · ${graphFails} graph failures\n\n`
  + lines.join("\n");

/* ============================================================
   eq9 "Two, one or no solution?" (2026-08-23) — the round is nothing
   BUT a classification, so the classification gets its own section.

   Three things are proved here, and none of them reads the round's
   own answer text to do it:

   1. THE TABLE ITSELF, swept exhaustively. `solutionCount()` (the one
      place the rule is written down in js/quests/queseq9-solution-count.js)
      is compared against an INDEPENDENT copy typed out below, straight
      from her handwritten "Important Notes" box, over every (p, q, sign)
      with p, q ≤ 9 and gcd(p, q) = 1 — both signs, so every branch of
      her three rules is hit many times over.
   2. EVERY GENERATED ITEM, 500 per skill. A classification item has
      EXACTLY THREE options, always in her fixed order, and the one
      marked correct is the one the table demands for that item's own
      (p, q, sign). A solve item has exactly FOUR, and the same table
      decides which of them is right.
   3. THE ROUND'S SHAPE. Ten questions; a whole simulated round shows
      each of "two", "one" and "no solution" at least twice (her ask:
      "sign mixed so all three outcomes appear"); and every skill
      resolves its concept card.
   ============================================================ */
{
  const eq9lines = [];
  const def9 = questDef("eq9");
  const LABELS = { two: OPT_TWO, one: OPT_ONE, none: OPT_NONE };

  /* --- her box, typed out again, deliberately NOT imported --- */
  function expected(p, q, negative) {
    if (negative) {
      // "even number in num. OR denom.  ->  ✗ negative ans (no solution)"
      if (p % 2 === 0 || q % 2 === 0) return "none";
      // "only odd numbers in num. AND denom.  ->  ✓ negative answer"
      return "one";
    }
    // "even numerator  ->  ± answer"; an odd numerator gives a single value
    return p % 2 === 0 ? "two" : "one";
  }
  const gcd9 = (a, b) => (b ? gcd9(b, a % b) : a);
  let sweep = 0, sweepBad = 0;
  const branchSeen = { two: 0, one: 0, none: 0 };
  for (let p = 1; p <= 9; p++) for (let q = 1; q <= 9; q++) {
    if (gcd9(p, q) !== 1) continue;
    for (const neg of [false, true]) {
      sweep++;
      const got = solutionCount(p, q, neg);
      branchSeen[got] = (branchSeen[got] || 0) + 1;
      if (got !== expected(p, q, neg)) {
        sweepBad++;
        if (sweepBad < 6) eq9lines.push(`    ✗ x^(${p}/${q}) = ${neg ? "−" : "+"}c → ${got}, her box says ${expected(p, q, neg)}`);
      }
    }
  }
  tick(sweepBad === 0, `eq9 classification table: ${sweepBad} of ${sweep} (p,q,sign) cases disagree with her box`);
  tick(branchSeen.two > 0 && branchSeen.one > 0 && branchSeen.none > 0, "eq9 sweep exercised all three outcomes");
  eq9lines.push(`${sweep} (p, q, sign) combinations swept against her handwritten box · ${sweepBad} disagreements`);
  eq9lines.push(`  outcomes reached: two=${branchSeen.two} · one=${branchSeen.one} · none=${branchSeen.none}`);

  /* --- 500 generations per skill --- */
  const RUNS9 = 500;
  const ORDER = [OPT_TWO, OPT_ONE, OPT_NONE].join(" | ");
  let gen9 = 0, bad9 = 0, three = 0, four = 0;
  const perSkill = [];
  if (!def9) {
    tick(false, "eq9 has no quest def registered");
    eq9lines.push("✗ eq9 — no quest def registered");
  } else {
    tick(def9.skills.length === 10, `eq9 has ten questions in a round (got ${def9.skills.length})`);
    def9.skills.forEach(skill => {
      const issues = [];
      const kinds = {};
      let revealFrames = 0;
      for (let i = 0; i < RUNS9; i++) {
        let q;
        try { q = skill.gen(); } catch (e) { issues.push("threw: " + e.message); break; }
        gen9++;
        if (!getConcept(skill.concept)) issues.push(`missing concept "${skill.concept}"`);
        if (q.type !== "mc") issues.push(`type "${q.type}" (eq9 is all mc)`);
        if (!q.meta) { issues.push("no meta — the harness cannot check the answer"); continue; }
        const p = q.meta.p, pq = q.meta.q, neg = q.meta.neg;
        const want = solutionCount(p, pq, neg);
        if (want !== q.meta.kind) issues.push(`meta.kind "${q.meta.kind}" is not the table's "${want}" for x^(${p}/${pq})`);
        kinds[want] = (kinds[want] || 0) + 1;
        const corrects = q.options.filter(o => o.correct);
        if (corrects.length !== 1) issues.push(`${corrects.length} correct options`);
        const labels = q.options.map(o => o.label);
        if (labels.length !== new Set(labels).size) issues.push(`duplicate options: ${labels.join(" | ")}`);
        if (q.meta.three) {
          three++;
          if (q.options.length !== 3) issues.push(`classification item with ${q.options.length} options (want exactly 3)`);
          if (labels.join(" | ") !== ORDER) issues.push(`option order drifted: ${labels.join(" | ")}`);
          if (corrects.length === 1 && corrects[0].label !== LABELS[want]) issues.push(`marked "${corrects[0].label}", table says "${LABELS[want]}"`);
        } else if (q.meta.four) {
          four++;
          if (q.options.length !== 4) issues.push(`solve item with ${q.options.length} options (want exactly 4)`);
          /* the four values are always ±A · A · −A · No solution, and the
             table alone decides which one is marked */
          const A = q.meta.A;
          const wantLabel = want === "two" ? `x = ±${A}`
            : want === "one" && neg ? `x = −${A}`
              : want === "one" ? `x = ${A}` : OPT_NONE;
          if (corrects.length === 1 && corrects[0].label !== wantLabel) issues.push(`solve item marked "${corrects[0].label}", table says "${wantLabel}"`);
        } else issues.push("meta says neither a 3-option nor a 4-option item");
        if (Array.isArray(q.reveal)) revealFrames = q.reveal.length;
        if (!q.answerLabel) issues.push("no answerLabel");
        if (!q.hint) issues.push("no hint");
        if (!q.prompt || !String(q.prompt).trim()) issues.push("empty prompt");
      }
      const uniq = [...new Set(issues)];
      if (uniq.length) bad9 += uniq.length;
      tick(uniq.length === 0, `eq9/${skill.id}: ${uniq.join("; ")}`);
      perSkill.push(`  ${uniq.length ? "✗" : "✓"} ${skill.id.padEnd(18)} ${RUNS9} gens · `
        + Object.entries(kinds).map(([k, n]) => `${k}=${n}`).join(" ")
        + (revealFrames ? ` · ${revealFrames} teaching frames` : "")
        + (uniq.length ? "\n      " + uniq.join("\n      ") : ""));
    });

    /* teach FIRST: the first two questions must carry teaching frames,
       and the input stays hidden until the last one is up (mountReveal) */
    const f1 = def9.skills[0].gen(), f2 = def9.skills[1].gen();
    tick(Array.isArray(f1.reveal) && f1.reveal.length >= 4, "eq9 question 1 teaches first (her reciprocal move + the three rules)");
    tick(Array.isArray(f2.reveal) && f2.reveal.length === 4, "eq9 question 2 teaches first (her four worked examples)");

    /* a WHOLE round, 300 times: all three answers at least twice */
    let rounds = 0, roundBad = 0;
    for (let r = 0; r < 300; r++) {
      const c = { two: 0, one: 0, none: 0 };
      def9.skills.forEach(sk => { const q = sk.gen(); if (q.meta) c[q.meta.kind]++; });
      rounds++;
      if (!(c.two >= 2 && c.one >= 2 && c.none >= 2)) roundBad++;
    }
    tick(roundBad === 0, `eq9: ${roundBad} of ${rounds} whole rounds failed "every outcome at least twice"`);
    eq9lines.push(`${rounds} whole simulated rounds · ${roundBad} that did not show all three answers at least twice`);
  }
  eq9lines.push(`${gen9} eq9 generations checked · ${three} three-option classification items · ${four} four-option solve items · ${bad9} distinct issues`);
  document.getElementById("eq9").textContent = eq9lines.join("\n") + "\n\n" + perSkill.join("\n");
}

// render one sample per skill so the author can sanity-check the maths
const shost = document.getElementById("samples");
samples.forEach(s => {
  const card = document.createElement("div");
  card.className = "sample";
  let opts = "";
  if (s.q.type === "yesno") {
    opts = `<div class="o">Yes / No → correct: <b>${s.q.yes ? "Yes" : "No"}</b></div>`;
  } else {
    opts = `<div class="o">` + s.q.options.map(o => `${o.correct ? "<b>✓ " : "· "}${o.label}${o.correct ? "</b>" : ""}`).join("<br>") + `</div>`;
  }
  const g = s.q.graph ? `<div class="g">${renderFunction(s.q.graph)}</div>` : "";
  card.innerHTML = `<div class="p"><b>${s.quest}·${s.skill}</b> — ${s.q.prompt}</div>${g}${opts}`
    + `<div class="o" style="margin-top:8px">answer: ${s.q.answerLabel || "—"}</div>`;
  shost.appendChild(card);
});

const banner = document.getElementById("banner");
const ok = passed === total && qFails === 0 && graphFails === 0;
banner.className = ok ? "pass" : "fail";
banner.textContent = ok
  ? `✓ ALL GOOD — ${passed}/${total} quest checks passed, ${qTotalChecks} generations clean, ${graphsChecked} sketches to scale`
  : `✗ ${total - passed} quest(s) failed; ${qFails} generation failures; ${graphFails} graph failures — see below`;

window.__VERIFY__ = { total, passed, qTotalChecks, qFails, graphsChecked, graphFails, ok, fails };
console.log(`[verify-eq] quests ${passed}/${total}, generations ${qTotalChecks}, graphs ${graphsChecked}, failures ${qFails + graphFails} — ${ok ? "OK" : "FAIL"}`);
if (fails.length) console.log("FAILS:\n" + fails.slice(0, 40).join("\n"));
</script>
</body>
</html>

  // a level gate the server owns, not the panel
  const tooHigh = await LocalBackend.buyItem(wu, "pw12", "techy-bed");
  tick(!tooHigh.ok && tooHigh.error === "locked" && tooHigh.minLevel === 8,
    `a level-1 learner bought a Lv 8 capsule bed: ${JSON.stringify(tooHigh)}`);
  // equipping something you do not own is refused — this is the check that
  // would pass for the WRONG reason if the slot were missing from
  // VALID_SLOTS, so the owned case below is what really proves the slot.
  const unowned = await LocalBackend.equip(wu, "pw12", { slot: 1, equipped: { bed: "princess-bed" } });
  tick(!unowned.ok && unowned.error === "bad_equipped", `an unowned bed was equipped: ${JSON.stringify(unowned)}`);

  /* buy + equip + unequip, on EVERY slot including `wall`.
     ⚠️ The entry piece is the slot's default where it has one, and its free
     Lv-1 row where it does not (shelves) — which is the whole point of
     running this loop over the optional slots too: the July cape bug is
     "row seeded, key missing from mhq_equip", and a shelf is exactly as
     capable of hitting it as a bed was. The bean bag has NO free row (Lv 6,
     90💎), so it is bought further down with earned crystals rather than
     skipped — an unexercised new slot is how that bug ships. */
  const ENTRY_PIECE = { "shelf-left": "shelf-wood-left", "shelf-right": "shelf-wood-right" };
  for (const slot of [...FURNITURE_SLOTS, WALL_SLOT]) {
    if (slot === "beanbag") continue; // no free row — exercised below, for real
    const id = DEFAULT_FURNITURE[slot] || ENTRY_PIECE[slot];
    tick(!!id, `slot "${slot}" has neither a default nor a free entry piece — nothing to exercise it with`);
    if (!id) continue;
    const goldBefore = (await LocalBackend.getState(wu, "pw12")).gold;
    const buy = await LocalBackend.buyItem(wu, "pw12", id);
    tick(buy.ok, `buying the free ${slot} (${id}) failed: ${JSON.stringify(buy)}`);
    tick(buy.gold === goldBefore, `a free ${slot} changed the gold balance (${goldBefore} -> ${buy.gold})`);
    tick((buy.owned || []).includes(id), `${id} is not in owned_items after buying`);

    const on = await LocalBackend.equip(wu, "pw12", { slot: 1, equipped: { [slot]: id } });
    tick(on.ok, `equipping the "${slot}" slot was REJECTED — this is the July cape bug: ${JSON.stringify(on)}`);
    const worn = await LocalBackend.getState(wu, "pw12");
    tick(worn.blip.equipped && worn.blip.equipped[slot] === id, `${id} did not stick in the ${slot} slot`);
    // and it must NOT have become something Blip wears
    tick(!(worn.blip.equipped.hat === id || worn.blip.equipped.back === id), `${id} ended up in a cosmetic slot`);

    const off = await LocalBackend.equip(wu, "pw12", { slot: 1, equipped: { [slot]: "" } });
    tick(off.ok, `taking the ${slot} out failed: ${JSON.stringify(off)}`);
    const bareAgain = await LocalBackend.getState(wu, "pw12");
    if (slot === WALL_SLOT) {
      tick(roomShellSrc(bareAgain.blip.equipped).endsWith("room-shell.png"),
        "an emptied wall slot did not go back to the plain shell");
    } else if (OPTIONAL_FURNITURE_SLOTS.includes(slot)) {
      tick(roomFurniture(bareAgain.blip.equipped)[slot] === null,
        `an emptied "${slot}" slot came back with something in it — decor must be removable`);
    } else {
      tick(roomFurniture(bareAgain.blip.equipped)[slot] === DEFAULT_FURNITURE[slot],
        `an emptied "${slot}" slot did not fall back to its free default`);
    }
  }

  /* THE BEAN BAG, for real — the one new slot with no free way in, so it is
     also the only one whose equip key is never touched by the loop above.
     Bought with crystals this learner actually earned, at a level gate the
     server owns. */
  {
    let bs = await LocalBackend.getState(wu, "pw12");
    tick(bs.levelInfo.level === 1, `expected the furniture learner at level 1, got ${bs.levelInfo.level}`);
    const tooEarly = await LocalBackend.buyItem(wu, "pw12", "beanbag");
    tick(!tooEarly.ok && tooEarly.error === "locked" && tooEarly.minLevel === 6,
      `a level-1 learner bought a Lv 6 bean bag: ${JSON.stringify(tooEarly)}`);
    /* Earn past the gate. ⚠️ DO NOT compute this as one XP number: cost(L) =
       200 + 60(L-1) puts level 6 at 1,600 XP, but this learner has already
       replayed q1-q3 thirty times and a REPLAY pays 25% (the economy's own
       rule), so a single 1,700-XP submit banked 425 and landed on level 2.
       Submitting until the level is reached is right whatever the replay
       rate is, and bounded so a rule change fails the check instead of
       hanging the page. */
    let guard = 0;
    while (bs.levelInfo.level < 6 && guard++ < 40) {
      await LocalBackend.submitQuest(wu, "pw12", "q" + ((guard % 3) + 1), { score: 1, xp: 600 });
      bs = await LocalBackend.getState(wu, "pw12");
    }
    tick(bs.levelInfo.level >= 6, `could not reach level 6 in ${guard} submits — got ${bs.levelInfo.level} on ${bs.xp} XP`);
    const goldBefore = bs.gold;
    const buy = await LocalBackend.buyItem(wu, "pw12", "beanbag");
    tick(buy.ok, `buying the bean bag at Lv ${bs.levelInfo.level} failed: ${JSON.stringify(buy)}`);
    if (buy.ok) tick(buy.gold === goldBefore - 90, `the bean bag cost ${goldBefore - buy.gold}, expected 90`);
    const on = await LocalBackend.equip(wu, "pw12", { slot: 1, equipped: { beanbag: "beanbag" } });
    tick(on.ok, `equipping the "beanbag" slot was REJECTED — the July cape bug on a new slot: ${JSON.stringify(on)}`);
    const sat = await LocalBackend.getState(wu, "pw12");
    tick(roomFurniture(sat.blip.equipped).beanbag === "beanbag", "the bean bag did not stick in the room");
    const off = await LocalBackend.equip(wu, "pw12", { slot: 1, equipped: { beanbag: "" } });
    tick(off.ok && roomFurniture((await LocalBackend.getState(wu, "pw12")).blip.equipped).beanbag === null,
      "the bean bag could not be taken back out");
  }

  /* A WALLPAPER IS NOT A COSMETIC AND NOT A LAYER. It rides the same equip
     machinery, so the risk is it leaking somewhere a room shell would be
     drawn on Blip. */
  {
    const st2 = await LocalBackend.getState(wu, "pw12");
    tick((st2.blip.owned || []).includes("wall-plain"), "the wallpaper was not really owned after buying");
    tick(!st2.shop.some((it) => it.id.startsWith("wall-")), "a wallpaper reached the cosmetic shop payload");
    /* ⚠️ NOT asserted here: that the SERVER refuses a wallpaper in the hat
       slot. It does not, and never has for any item — mhq_equip checks that
       the KEY is a known slot and that the VALUE is owned, and has never
       policed which slot an id belongs to (a hat can be equipped as a back
       item today, and could before this change). What actually keeps a room
       shell off Blip is the client: the renderer draws the `hat` key through
       ACCESSORIES, and no furniture id is in it — asserted for every piece
       in the per-item loop above. Writing the server-side check here would
       have failed for a reason that is pre-existing, deliberate and nothing
       to do with wallpaper. */
    tick(!ACCESSORIES["wall-plain"] && !ACCESSORIES["wall-stripes"],
      "a wallpaper is in ACCESSORIES — the renderer would try to draw a room on Blip");
  }

  // a door colour costs what it says, and a trinket is STILL not buyable
  // (the same guard in mhq_buy_item lets furniture through and must not
  // have widened any further than that)
  {
    const before = (await LocalBackend.getState(wu, "pw12")).gold;
    const buy = await LocalBackend.buyItem(wu, "pw12", "door-mint");
    tick(buy.ok && buy.gold === before - 10, `the mint door cost ${before - buy.gold}, expected 10`);
    const again = await LocalBackend.buyItem(wu, "pw12", "door-mint");
    tick(!again.ok && again.error === "owned", `the mint door was bought twice: ${JSON.stringify(again)}`);
    const trinket = await LocalBackend.buyItem(wu, "pw12", "rubber-duck");
    tick(!trinket.ok && trinket.error === "no_item", `a trinket became purchasable when furniture did: ${JSON.stringify(trinket)}`);
    const wearTrinket = await LocalBackend.equip(wu, "pw12", { slot: 1, equipped: { bed: "rubber-duck" } });
    tick(!wearTrinket.ok, "a trinket was equippable into a furniture slot");
  }

  // furniture must never touch the cosmetic side of the closet: a bed is in
  // owned_items (that is how ownership works) but it is not an accessory, so
  // the Inventory panel — which filters by COSMETIC_SLOTS — must not show it
  {
    const after = await LocalBackend.getState(wu, "pw12");
    const closetish = (after.blip.owned || []).filter((id) => COSMETIC_SLOTS.includes(accessorySlot(id)));
    tick(!closetish.some((id) => FURNITURE_IDS.includes(id)), "a piece of furniture would show up in the cosmetic Inventory");
    tick(!after.shop.some((it) => FURNITURE_IDS.includes(it.id)), "furniture leaked into the cosmetic shop payload");
  }
  say("furniture round-trip: all EIGHT slots buy → equip → unequip (defaults fall back, decor slots really empty, wall returns to the plain shell); bean bag bought past its Lv 6 gate with earned crystals; unowned rejected; Lv 8 gate held at Lv 1; door colours priced; trinkets still unbuyable");
}

/* ---------- 6k. THE ROOM IS HOME (room build §1, 2026-08-09) ----------
   The routing itself (app.js/auth.js -> go("blip"); the desk's tap ->
   go("hub")) lives in blip.js/app.js/auth.js, which this page does not
   import — DOM screens are the browser-walk's job, not this file's (see
   PROJECT-STATUS.md). What IS assertable here without a full render:
     - hasActiveAssignment() is the exact condition the desk badge uses,
       and it must agree with renderAssignmentCard's own "nothing to pin"
       logic — they are two hand-synced copies in assignment.js, and this
       is what would catch them drifting apart.
     - homeworkBadgeLayer() really disappears on a failed image load — no
       drawn placeholder, no broken-image icon, per her art rule (the
       badge art, assets/companion/homework-badge.png, may not even be in
       the repo yet — this must stay green either way). */
{
  const fakeApp = (assignment) => ({ state: { assignment } });
  tick(hasActiveAssignment(fakeApp(null)) === false, "hasActiveAssignment(null) should be false");
  tick(hasActiveAssignment(fakeApp(undefined)) === false, "hasActiveAssignment(undefined) should be false");
  tick(hasActiveAssignment(fakeApp({})) === false, "an assignment with no questId should be false");
  tick(hasActiveAssignment(fakeApp({ questId: "not-a-real-quest" })) === false,
    "an assignment pointing at an unknown quest id should be false — matches renderAssignmentCard's 'unknown quest id — fail quiet' rule");
  // "stats" / "q1" are real ids from config.js (CHAPTERS) — a genuinely resolvable assignment
  tick(hasActiveAssignment(fakeApp({ questId: "q1", chapterId: "stats" })) === true,
    "a real, resolvable assignment should read as active");
  // Review fix 2026-08-09: DONE homework must not badge the desk. The card
  // still pins its gentle ✓ state, but a red "!" has no done state — "no
  // nagging repeat once it's done" (assignment.js header ruling).
  tick(hasActiveAssignment(fakeApp({ questId: "q1", chapterId: "stats", done: true })) === false,
    "a DONE assignment must not show the desk badge — no nagging repeat once it's done");
  tick(hasActiveAssignment({}) === false && hasActiveAssignment(null) === false,
    "hasActiveAssignment must not throw on a bare/missing app");

  const host = document.createElement("div");
  document.body.appendChild(host);
  const badge = homeworkBadgeLayer();
  host.appendChild(badge);
  tick(host.contains(badge), "homeworkBadgeLayer() did not attach to its host");
  const img = badge.querySelector("img");
  tick(!!img, "homeworkBadgeLayer() has no <img>");
  tick(!!img && /(^|\/)assets\/companion\/homework-badge\.png$/.test(img.getAttribute("src") || ""),
    `homework badge points at "${img && img.getAttribute("src")}", expected assets/companion/homework-badge.png`);
  if (img) img.dispatchEvent(new Event("error"));
  tick(!host.contains(badge), "a failed homework-badge image load should remove the badge, not leave a broken-image icon");
  host.remove();
  say("room home screen: hasActiveAssignment() matches renderAssignmentCard's own decision; homework badge hides itself on a failed image load");
}

/* ---------- 7. buying, wearing and taking off actually work ----------
   Was "the free cape" — cape is priced now (price-the-free-tier, 2026-08-21),
   so this buys it for real gold instead, using the same deterministic gold
   source as section 6h (a submitted round pays a flat 10💎 with xp:0, which
   keeps this account at level 1 so nothing else unlocks underfoot). */
{
  const capeRow = shop.find((it) => it.id === "cape");
  tick(!!capeRow && capeRow.price > 0, "cape should be a real, priced item now — nothing may be free once kids are playing");
  for (let i = 0; i < 2; i++) await LocalBackend.submitQuest(uname, "pw12", "q" + ((i % 3) + 1), { score: 0.9, xp: 0 });
  const before = (await LocalBackend.getState(uname, "pw12")).gold;
  tick(before >= capeRow.price, `test account has ${before}💎, needs ${capeRow.price} to buy the cape`);
  const buy = await LocalBackend.buyItem(uname, "pw12", "cape", 1);
  tick(buy && buy.ok, "buying the cape failed: " + JSON.stringify(buy));
  const after = await LocalBackend.getState(uname, "pw12");
  tick(after.gold === before - capeRow.price, `buying the cape (${capeRow.price}💎) charged the wrong amount (${before} -> ${after.gold})`);
  tick((after.blip.owned || []).includes("cape"), "cape not in owned_items after buying");

  const wear = await LocalBackend.equip(uname, "pw12", { slot: 1, equipped: { back: "cape" } });
  tick(wear && wear.ok, "equipping to the new BACK slot was rejected: " + JSON.stringify(wear));
  const worn = await LocalBackend.getState(uname, "pw12");
  tick(worn.blip.equipped && worn.blip.equipped.back === "cape", "cape did not stick in the back slot");

  const off = await LocalBackend.equip(uname, "pw12", { slot: 1, equipped: { back: "" } });
  tick(off && off.ok, "taking the cape off failed");

  const bogus = await LocalBackend.equip(uname, "pw12", { slot: 1, equipped: { back: "not-a-real-item" } });
  tick(bogus && !bogus.ok, "the back slot accepted an item the learner does not own");
}

/* ---------- 7b. buying wears it immediately (phone-walk polish, 2026-08-09) ----------
   mhq_buy_item never equips server-side (unchanged) — js/blip.js's cosmeticCard
   and furnitureCard buy handlers now CHAIN an equip call right after a
   successful buy, so the learner sees it worn in the same render instead of
   having to open Inventory/Furniture and tap Wear separately. This headless
   harness can't drive the DOM buy button itself, so it replicates blip.js's
   exact call shape — buyItem() then equip({slot, equipped: {...current,
   [slot]: id}}), built from the equipped set as it stood BEFORE the buy,
   exactly like the closure in cosmeticCard/furnitureCard does — on both a
   cosmetic and a furniture slot: the July cape bug's exact shape (buy ->
   equip -> unequip), extended one step further to prove the CHAINED equip
   sticks, not just a manually-triggered one.
   Second half: her explicit edge case — at dress-lock (health stage >= 2)
   a learner can still buy but must NOT end up wearing it, and the failed
   equip must be the specific BLIP_TOO_SICK error the UI's quiet-skip
   depends on, never some other code that would slip past it unnoticed. */
{
  const bu = "verify_buyequip_" + Math.random().toString(36).slice(2, 8);
  await LocalBackend.signup(bu, "BuyEquip", "pw12");
  for (let i = 0; i < 10; i++) await LocalBackend.submitQuest(bu, "pw12", "q" + ((i % 3) + 1), { score: 0.9, xp: 0 });

  // cosmetic: buy the beanie (priced 2026-08-21; this account earned 100💎
  // above, plenty), chain-equip it exactly like cosmeticCard's buy handler does.
  {
    const before = await LocalBackend.getState(bu, "pw12");
    tick(!(before.blip.equipped || {}).hat, "the buy-equip learner should start with no hat equipped");
    const buy = await LocalBackend.buyItem(bu, "pw12", "beanie", 1);
    tick(buy && buy.ok, `buying the beanie failed: ${JSON.stringify(buy)}`);
    const nextEquipped = { ...(before.blip.equipped || {}), hat: "beanie" };
    const chained = await LocalBackend.equip(bu, "pw12", { slot: 1, equipped: nextEquipped });
    tick(chained && chained.ok, `the chained equip after buying the beanie was REJECTED — this is the July cape bug: ${JSON.stringify(chained)}`);
    const worn = await LocalBackend.getState(bu, "pw12");
    tick(worn.blip.equipped && worn.blip.equipped.hat === "beanie", "the beanie did not stick after the chained buy->equip");
    const off = await LocalBackend.equip(bu, "pw12", { slot: 1, equipped: { ...worn.blip.equipped, hat: "" } });
    tick(off && off.ok, "taking the chain-equipped beanie back off failed");
  }

  // furniture: same chain, on the door slot (a paid item, unlike the free
  // furniture defaults every other furniture test in this file reaches for).
  {
    const before = await LocalBackend.getState(bu, "pw12");
    const goldBefore = before.gold;
    const buy = await LocalBackend.buyItem(bu, "pw12", "door-mint", 1);
    tick(buy && buy.ok && buy.gold === goldBefore - 10, `buying the mint door failed or charged the wrong amount: ${JSON.stringify(buy)}`);
    const nextEquipped = { ...(before.blip.equipped || {}), door: "door-mint" };
    const chained = await LocalBackend.equip(bu, "pw12", { slot: 1, equipped: nextEquipped });
    tick(chained && chained.ok, `the chained equip after buying the mint door was REJECTED — this is the July cape bug, on furniture: ${JSON.stringify(chained)}`);
    const worn = await LocalBackend.getState(bu, "pw12");
    tick(roomFurniture(worn.blip.equipped).door === "door-mint", "the mint door did not stick after the chained buy->equip");
    const off = await LocalBackend.equip(bu, "pw12", { slot: 1, equipped: { ...worn.blip.equipped, door: "" } });
    tick(off && off.ok, "taking the chain-equipped door back off failed");
    tick(roomFurniture((await LocalBackend.getState(bu, "pw12")).blip.equipped).door === DEFAULT_FURNITURE.door,
      "emptying the door slot did not fall back to the free default");
  }

  // the dress-lock edge case: buy must still succeed, the chained equip must
  // fail QUIETLY (BLIP_TOO_SICK specifically) and the item must stay unworn.
  {
    await LocalBackend.adminSetTerm("admin", true);
    let sick = await LocalBackend.getState(bu, "pw12");
    for (let d = 0; d < 21 && sick.health.stage < 2; d++) {
      globalThis.__BLIP_DEV__.skipDays(1);
      sick = await LocalBackend.getState(bu, "pw12");
    }
    tick(sick.health.stage >= 2 && sick.health.locks.dress === true,
      `could not reach the dress-locked stage to test the quiet-skip guard, stuck at ${JSON.stringify(sick.health)}`);

    const buy = await LocalBackend.buyItem(bu, "pw12", "door-sky", 1);
    tick(buy && buy.ok, `buying while dress-locked should still succeed (her ruling: can buy, just not wear): ${JSON.stringify(buy)}`);

    const nextEquipped = { ...(sick.blip.equipped || {}), door: "door-sky" };
    const chained = await LocalBackend.equip(bu, "pw12", { slot: 1, equipped: nextEquipped });
    tick(chained && !chained.ok && chained.error === "BLIP_TOO_SICK",
      `equip while dress-locked should refuse with BLIP_TOO_SICK specifically (that is the error js/blip.js's lockedByDress check pre-empts), got: ${JSON.stringify(chained)}`);
    const afterSick = await LocalBackend.getState(bu, "pw12");
    tick(roomFurniture(afterSick.blip.equipped).door !== "door-sky",
      "a door bought while dress-locked must NOT end up worn — the chained equip must be skipped, this is the edge case her brief called out");
    tick((afterSick.blip.owned || []).includes("door-sky"), "the sky door should still be owned even though it could not be equipped");

    globalThis.__BLIP_DEV__.reset();
    await LocalBackend.adminSetTerm("admin", false);
  }
  say("buy-now-equips: a free beanie and a paid door both chain-equip right after buying (the July cape bug's shape, extended to the chained call) and unequip cleanly; while dress-locked the buy still succeeds but the chained equip is refused with BLIP_TOO_SICK and the item stays unworn");
}

/* ---------- 10. the room tutorial (bubble walkthrough, 2026-08-09) ----------
   Ported from WhenWorks' app/tour.js — the mechanism itself (spotlight
   positioning, resize handling) is proven there and isn't re-tested here;
   what's asserted is the port's own behaviour: a step whose control isn't
   on screen drops silently, skip/Escape/tap-the-dim-area all count as
   "seen", the seen flag is a VERSION NUMBER under the "mhq." prefix (so
   this page's own storage wipe above always exercises the first-run
   path), and the always-on "?" replay plus the auto-fire call are really
   wired into js/blip.js — not just present in tour.js in isolation. */
{
  const { TOUR_VERSION, startTour, maybeStartTour, tourSeen } = await import("./js/companion/tour.js");
  const TKEY = "mhq.tourSeen";

  tick(TOUR_VERSION === 1, `TOUR_VERSION is ${TOUR_VERSION}, expected 1 (bump it, don't add a boolean flag, to re-show a rewritten tour)`);
  localStorage.removeItem(TKEY);
  tick(tourSeen() === 0, "tourSeen() should read 0 with no stored value");

  // A throwaway room, off-screen, with only SOME of the seven anchors —
  // the same "plain divs, not the real screen" approach section 6i uses
  // for the drag gesture, so this doesn't need to mount the whole room.
  const mount = document.createElement("div");
  mount.style.cssText = "position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;z-index:-1;overflow:visible";
  const PRESENT = ["blip", "desk", "cookie", "door", "gallery"]; // 5 of 7 — tray + furniture omitted on purpose
  for (const tag of PRESENT) {
    const anchor = document.createElement("div");
    anchor.dataset.tour = tag;
    anchor.style.cssText = "position:fixed;left:10px;top:10px;width:20px;height:20px";
    mount.appendChild(anchor);
  }
  document.body.appendChild(mount);

  // ---- step-dropping: a step whose control isn't on screen is silently skipped ----
  let handle = startTour(mount);
  tick(!!handle, "startTour returned nothing with 5 real anchors present");
  tick(handle && handle.length === PRESENT.length,
    `startTour should keep exactly ${PRESENT.length} steps (tray/furniture have no anchor here), got ${handle && handle.length}`);
  tick(!!document.querySelector(".tour"), "startTour did not mount the overlay");
  tick(!!document.querySelector(".tour__bubble .tour__title"), "the first step's bubble never rendered");

  // ---- Escape closes, and closing (even by Escape) counts as seen ----
  document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
  await new Promise((res) => setTimeout(res, 250)); // the .tour fade-out is a real 200ms CSS transition, not rAF-driven
  tick(!document.querySelector(".tour"), "Escape did not remove the tour overlay");
  tick(tourSeen() === TOUR_VERSION, "closing via Escape did not mark the tour as seen");
  tick(localStorage.getItem(TKEY) === String(TOUR_VERSION),
    `the seen flag must live under "${TKEY}" so this page's own mhq.* wipe covers it, got raw value ${JSON.stringify(localStorage.getItem(TKEY))}`);

  // ---- a device that has already seen this version gets nothing automatically ----
  tick(maybeStartTour(mount) === null, "maybeStartTour ran again on a device that already saw this TOUR_VERSION");
  tick(!document.querySelector(".tour"), "maybeStartTour mounted an overlay it should have suppressed");

  // ---- a version bump re-shows it (the whole reason it's a number, not a flag) ----
  localStorage.removeItem(TKEY);
  const auto = maybeStartTour(mount);
  tick(!!auto, "maybeStartTour did not run for a device with no stored version");
  tick(!!document.querySelector(".tour"), "maybeStartTour (fresh device) did not mount the overlay");

  // ---- skipping counts as seen too, and the skip button is reachable by a tap ----
  const skipBtn = document.querySelector(".tour__skip");
  tick(!!skipBtn && !skipBtn.hidden, "the Skip button should be visible on a non-final step");
  skipBtn.dispatchEvent(new MouseEvent("click", { bubbles: true }));
  await new Promise((res) => setTimeout(res, 250));
  tick(!document.querySelector(".tour"), "Skip did not remove the tour overlay");
  tick(tourSeen() === TOUR_VERSION, "Skip did not mark the tour as seen");

  // ---- tapping the dimmed area advances instead of closing ----
  localStorage.removeItem(TKEY);
  handle = startTour(mount);
  const before = document.querySelector(".tour__count").textContent;
  document.querySelector(".tour").dispatchEvent(new MouseEvent("click", { bubbles: true }));
  tick(document.querySelector(".tour__count").textContent !== before,
    `tapping the dimmed area should advance to the next step, count stayed "${before}"`);
  handle.close();
  await new Promise((res) => setTimeout(res, 250));

  // ---- an empty room (no anchors at all) starts nothing ----
  localStorage.removeItem(TKEY);
  const emptyMount = document.createElement("div");
  tick(startTour(emptyMount) === null, "startTour should return null when not one of the seven controls is on screen");
  tick(maybeStartTour(emptyMount) === null, "maybeStartTour should return null on an anchorless mount too");

  document.body.removeChild(mount);
  localStorage.removeItem(TKEY); // leave storage clean for anything that runs after this section

  // ---- the port is really wired into js/blip.js, not just present in tour.js ----
  const blipSrc = await (await fetch("./js/blip.js")).text();
  tick(blipSrc.includes('from "./companion/tour.js"'), "js/blip.js no longer imports the tour module");
  tick(blipSrc.includes("tour-replay-btn"), 'js/blip.js: the always-available "?" replay button is missing from the room header (her ruling 4 — it must never be first-open-only)');
  tick(blipSrc.includes('data-tour="gallery"'), "js/blip.js: the gallery button lost its tour anchor");
  tick(/dataset\.tour\s*=\s*"desk"/.test(blipSrc), "js/blip.js: the desk furniture layer lost its tour anchor");
  tick(/dataset\.tour\s*=\s*"door"/.test(blipSrc), "js/blip.js: the door furniture layer lost its tour anchor");
  tick(/dataset\.tour\s*=\s*"furniture"/.test(blipSrc), "js/blip.js: the bed (redecorate step) lost its tour anchor");
  tick(blipSrc.includes('dataset.tour = "cookie"'), "js/blip.js: the daily cookie lost its tour anchor");
  tick(blipSrc.includes('dataset.tour = "tray"'), "js/blip.js: the tray strip lost its tour anchor");
  tick(blipSrc.includes("maybeStartTour(host)"), "js/blip.js: the room screen no longer auto-fires the tutorial on first landing");
  // The desk step's own copy is the one place the homework badge is
  // explained in words (her ruling: no separate step anchored to the
  // badge, since it's usually absent) — assert the mention survives.
  const tourSrc = await (await fetch("./js/companion/tour.js")).text();
  tick(/desk[\s\S]{0,400}homework/i.test(tourSrc), 'the desk step\'s copy should mention homework (the red "!" badge), per the brief');
  tick(!/requestAnimationFrame\s*\(/.test(tourSrc), "js/companion/tour.js must never CALL requestAnimationFrame — this project's preview pane never fires it (mentioning the name in a comment is fine)");

  say(`room tutorial: TOUR_VERSION ${TOUR_VERSION} · step-drop verified (5/7 anchors -> ${PRESENT.length} steps) · Escape/Skip/tap-dim all mark "mhq.tourSeen" · a version bump re-shows it · wired into js/blip.js's header ("?") and first-landing auto-fire`);
}

/* ---------- 6j. roster login (CQ-BRIDGE-PLAN.md Part 1, 2026-08-21) ----------
   Self sign-up is retired; a learner now picks their name from a
   teacher-seeded roster. Exercises the LocalBackend mirror of
   mhq_list_students / mhq_first_login end to end, and cross-checks the
   migration file for the objects it must define. */
{
  // ---- the picker payload: FAKE_ROSTER, hidden rows excluded ----
  const roster = await LocalBackend.listStudents();
  const thabo = roster.find((s) => s.display_name === "Thabo Test");
  const lerato = roster.find((s) => s.display_name === "Lerato Test");
  tick(!!thabo, `the picker mirror is missing the seeded "Thabo Test" fixture: ${JSON.stringify(roster.map((s) => s.display_name))}`);
  tick(!!lerato, `the picker mirror is missing the seeded "Lerato Test" fixture: ${JSON.stringify(roster.map((s) => s.display_name))}`);
  if (thabo) tick(thabo.has_password === false, `"Thabo Test" should read has_password:false (the "new" tag case), got ${JSON.stringify(thabo)}`);
  if (lerato) tick(lerato.has_password === true, `"Lerato Test" should read has_password:true (the returning-login case), got ${JSON.stringify(lerato)}`);

  // ---- payload shape: no password ever leaks, and nothing beyond the spec ----
  // The brief spec'd display_name + has_password only, mirroring Circle Quest's
  // cgg_list_students. This build adds `username` too — a deliberate, documented
  // deviation (see migration-roster-login.sql's header): every OTHER mhq_* RPC
  // still authenticates via _mhq_auth(p_username, ...), unchanged, so the picker
  // needs a username to reach mhq_login for a RETURNING student. The invariant
  // that actually matters — no password, no extra fields — is what this asserts.
  for (const s of roster) {
    const keys = Object.keys(s).sort().join(",");
    tick(keys === "display_name,has_password,username",
      `mhq_list_students mirror entry for "${s.display_name}" has keys [${keys}] — expected exactly display_name, has_password, username (no password, nothing else)`);
  }
  say(`picker payload: ${roster.length} visible row(s), keys [username, display_name, has_password] on every row — no password field, hidden rows excluded`);

  // ---- first login: sets the password exactly once ----
  const first = await LocalBackend.firstLogin("Thabo Test", "pw1234");
  tick(first.ok && first.username === "thabo_test", `first login for "Thabo Test" should succeed with username "thabo_test", got ${JSON.stringify(first)}`);
  const rosterAfter = await LocalBackend.listStudents();
  const thaboAfter = rosterAfter.find((s) => s.display_name === "Thabo Test");
  tick(!!thaboAfter && thaboAfter.has_password === true, `"Thabo Test" should read has_password:true immediately after first login, got ${JSON.stringify(thaboAfter)}`);

  // a second first-login attempt on the same name must be refused
  const second = await LocalBackend.firstLogin("Thabo Test", "anotherpw");
  tick(!second.ok && second.error === "already_set", `a second first-login on "Thabo Test" should be refused as already_set, got ${JSON.stringify(second)}`);

  // and the password it actually set is the real one, usable to log in
  const loginOk = await LocalBackend.login("thabo_test", "pw1234");
  tick(loginOk.ok, `logging in with the password first_login just set failed: ${JSON.stringify(loginOk)}`);

  // ---- wrong password on an account that already has one is refused ----
  const wrong = await LocalBackend.login("lerato_test", "not-the-password");
  tick(!wrong.ok && wrong.error === "wrong_password", `a wrong password for "Lerato Test" should be refused as wrong_password, got ${JSON.stringify(wrong)}`);
  const right = await LocalBackend.login("lerato_test", "demo1234");
  tick(right.ok, `the real password for "Lerato Test" (seeded in FAKE_ROSTER) was refused: ${JSON.stringify(right)}`);

  say(`roster login round-trip: picker -> first login (sets password once, a replay is refused) -> log in with it; a wrong password on an existing account is refused, the real one works`);

  // ---- no client code path still calls the retired mhq_signup RPC ----
  // Not literally every file in js/ — the files that could plausibly still
  // reference an auth RPC by name: the two backends, the login screen, the
  // api layer's doc comment, the app shell and the admin panel.
  const SIGNUP_SCAN_FILES = ["js/supabase.js", "js/local-backend.js", "js/auth.js", "js/api.js", "js/app.js", "js/admin.js"];
  for (const f of SIGNUP_SCAN_FILES) {
    try {
      const src = await (await fetch(`./${f}`)).text();
      tick(!src.includes("mhq_signup"), `${f} still references the retired mhq_signup RPC`);
    } catch (e) { tick(false, `could not read ${f}: ` + e.message); }
  }

  // ---- the migration file names every new object, with search_path pinned ----
  try {
    const raw = await (await fetch("./supabase/migration-roster-login.sql")).text();
    const sql = raw.replace(/--[^\n]*/g, "");
    tick(/add column if not exists cq_name\s+text\s+unique/i.test(sql), "migration-roster-login.sql does not add students.cq_name (text unique)");
    tick(/add column if not exists hidden\s+boolean\s+not null default false/i.test(sql), "migration-roster-login.sql does not add students.hidden (boolean not null default false)");
    for (const fn of ["mhq_list_students", "mhq_first_login", "mhq_admin_add_student"]) {
      const re = new RegExp(`create or replace function public\\.${fn}\\([^)]*\\)[\\s\\S]{0,260}?set search_path = public, extensions`, "i");
      tick(re.test(sql), `migration-roster-login.sql: ${fn} is missing or does not pin search_path = public, extensions`);
    }
    tick(/drop function if exists public\.mhq_signup\(text,\s*text,\s*text\)/i.test(sql), "migration-roster-login.sql does not drop mhq_signup(text, text, text) by its exact signature");
    tick(/grant execute on function[\s\S]*?public\.mhq_list_students\(\)[\s\S]*?to anon, authenticated/i.test(sql), "mhq_list_students is not granted to anon, authenticated");
    tick(/grant execute on function[\s\S]*?public\.mhq_first_login\(text, text\)[\s\S]*?to anon, authenticated/i.test(sql), "mhq_first_login is not granted to anon, authenticated");
    tick(/grant execute on function[\s\S]*?public\.mhq_admin_add_student\(text, text, text, text\)[\s\S]*?to anon, authenticated/i.test(sql), "mhq_admin_add_student is not granted to anon, authenticated");
    say("migration-roster-login.sql: both new columns present, all three new RPCs pin search_path, mhq_signup is dropped by exact signature, all three new RPCs are granted");
  } catch (e) { tick(false, "could not read supabase/migration-roster-login.sql: " + e.message); }
}

/* ---------- 6k. Circle Geo tab + login fallback (CQ-BRIDGE-PLAN.md Part 2
   + the session-1 review rider, 2026-08-21) ----------
   Both pieces are UI wiring with no server round-trip to exercise, so —
   matching this file's existing convention for that case (see the room
   tutorial's blip.js/tour.js wiring checks above) — these are static
   source-pattern checks, not live DOM/backend assertions. */
{
  // ---- config.js: the CQ out-link is a real, exact constant ----
  const configSrc = await (await fetch("./js/config.js")).text();
  tick(/export const CQ_URL\s*=\s*"https:\/\/megzieberr\.github\.io\/circle-geo-quest\/"/.test(configSrc),
    "js/config.js does not export CQ_URL as the exact Circle Quest URL");

  // ---- screens.js: the third hub tab, always shown, one plain card ----
  const screensSrc = await (await fetch("./js/screens.js")).text();
  tick(/import\s*\{[^}]*\bCQ_URL\b[^}]*\}\s*from\s*"\.\/config\.js"/.test(screensSrc),
    "js/screens.js does not import CQ_URL from ./config.js");
  tick(/id:\s*"cgeo"/.test(screensSrc), 'js/screens.js: TABS is missing the "cgeo" tab');
  tick(/label:\s*"⭕ Circle Geo"/.test(screensSrc), 'js/screens.js: the cgeo tab is missing its "⭕ Circle Geo" label');
  tick(/t\.id === "cgeo" \|\| byTerm\(t\.id\)\.length/.test(screensSrc),
    "js/screens.js: the cgeo tab must always show — it should bypass the byTerm() chapter-count filter other tabs use");
  tick(/function circleGeoCard/.test(screensSrc), "js/screens.js is missing circleGeoCard()");
  tick(/href="\$\{CQ_URL\}"[^>]*target="_blank"[^>]*rel="noopener"/.test(screensSrc),
    'js/screens.js: the "Open Circle Quest" anchor must have href={CQ_URL}, target="_blank" and rel="noopener" together');
  tick(/el\("div",\s*"cg-collect"\)/.test(screensSrc), "js/screens.js is missing the .cg-collect mount div");
  tick(/setAttribute\("data-mount",\s*"cq-collect"\)/.test(screensSrc),
    'js/screens.js: the mount div is missing data-mount="cq-collect"');
  say('Circle Geo tab: third hub tab (always shown), one .cg-card with the CQ out-link (new tab, noopener) and an empty .cg-collect[data-mount="cq-collect"] for session 3 to fill');

  // ---- auth.js: the ?u=1 classic-login fallback ----
  const authSrc = await (await fetch("./js/auth.js")).text();
  tick(/function wantsClassicLogin/.test(authSrc), "js/auth.js is missing wantsClassicLogin()");
  tick(/URLSearchParams\(location\.search\)\.get\("u"\)\s*===\s*"1"/.test(authSrc),
    'js/auth.js: wantsClassicLogin() should read ?u=1 the same way api.js\'s forceLocal() reads ?local — a plain URLSearchParams check, so the two compose');
  tick(/if \(wantsClassicLogin\(\)\) return renderClassicLogin\(\)/.test(authSrc),
    "js/auth.js: renderLogin() does not branch to renderClassicLogin() on wantsClassicLogin()");
  const classicBody = (/function renderClassicLogin\(\)\s*\{([\s\S]*?)\n  \}\n/.exec(authSrc) || [])[1] || "";
  tick(!!classicBody, "js/auth.js: could not isolate renderClassicLogin()'s body — check it wasn't renamed or reshaped");
  tick(/btn\.disabled = true;[\s\S]*await api\.login\(/.test(classicBody),
    "js/auth.js: renderClassicLogin() must disable its button BEFORE the api.login() await (the double-submit rule)");
  tick(/errMsg\(r\.error \|\| "wrong_password"\)/.test(classicBody),
    "js/auth.js: renderClassicLogin() should show the same errMsg() wrong-password copy as the picker");
  say("?u=1 classic login: wantsClassicLogin() branches renderLogin() to a plain username+password form calling api.login() directly, disable-before-await, same error copy as the picker");

  // ---- nowhere in the UI points at it (URL-only, by design) ----
  const NOLINK_SCAN_FILES = ["index.html", "js/app.js", "js/screens.js", "js/blip.js", "js/ui.js"];
  for (const f of NOLINK_SCAN_FILES) {
    try {
      const src = await (await fetch(`./${f}`)).text();
      tick(!/wantsClassicLogin|[?&]u=1/.test(src), `${f} references the ?u=1 fallback — it must be reachable by URL only, never linked or hinted at`);
    } catch (e) { tick(false, `could not read ${f}: ` + e.message); }
  }
}

/* ---------- 6l. XP -> diamonds bridge (CQ-BRIDGE-PLAN.md Part 3, build
   session 3, 2026-08-21) ----------
   Three layers: the migration's SQL objects (static parse, same idiom as
   6j), the local round-trip (a live exercise of the watermark maths, via
   a fresh isolated test account — never thabo_test/lerato_test, so this
   section has no ordering dependency on 6j/6k), and the Collect panel's
   client wiring (static source-pattern, same idiom as 6k — there is no
   server round-trip to exercise for the UI shell itself). */
{
  // ================= migration-cq-bridge.sql =================
  let sql = "";
  try {
    const raw = await (await fetch("./supabase/migration-cq-bridge.sql")).text();
    sql = raw.replace(/--[^\n]*/g, "");
    tick(/add column if not exists cq_xp_credited\s+int\s+not null default 0/i.test(sql),
      "migration-cq-bridge.sql does not add students.cq_xp_credited (int not null default 0)");
    tick(/insert into public\.app_config \(key, value\) values \('cq_rate',\s*'30'\)[\s\S]{0,60}on conflict \(key\) do nothing/i.test(sql),
      "migration-cq-bridge.sql does not seed app_config.cq_rate = '30' (idempotent, on conflict do nothing)");

    for (const fn of [
      { name: "mhq_credit_cq", args: "p_student_id uuid, p_cq_total int", sig: "uuid, int" },
      { name: "mhq_cq_link", args: "p_username text, p_password text", sig: "text, text" },
    ]) {
      const bodyRe = new RegExp(`create or replace function public\\.${fn.name}\\([^)]*\\)[\\s\\S]{0,260}?set search_path = public, extensions`, "i");
      tick(bodyRe.test(sql), `migration-cq-bridge.sql: ${fn.name} is missing or does not pin search_path = public, extensions`);

      // ⚠️ THE CHECK THAT MATTERS MOST IN THIS SESSION: both new RPCs must
      // be revoked from public/anon/authenticated AND granted to
      // service_role ONLY — Postgres grants EXECUTE to PUBLIC by default on
      // CREATE FUNCTION, so a missing revoke would let anyone mint diamonds.
      const revokeRe = new RegExp(`revoke execute on function public\\.${fn.name}\\(${fn.sig}\\) from public,\\s*anon,\\s*authenticated;`, "i");
      const grantRe = new RegExp(`grant execute on function public\\.${fn.name}\\(${fn.sig}\\) to service_role;`, "i");
      tick(revokeRe.test(sql), `migration-cq-bridge.sql: ${fn.name}(${fn.sig}) is missing "revoke execute ... from public, anon, authenticated" — without it, PUBLIC's default EXECUTE grant would let anon mint diamonds`);
      tick(grantRe.test(sql), `migration-cq-bridge.sql: ${fn.name}(${fn.sig}) is missing "grant execute ... to service_role" — without it, nothing (not even the edge function) could call it`);
    }

    // ---- mhq_get_state: carries the ONE new field, and the copy-forward
    // tripwire (sentinel fields from the pre-existing body must survive) ----
    const isolateFn = (text, name) => (new RegExp(`create or replace function public\\.${name}[\\s\\S]*?\\nend; \\$\\$;`).exec(text) || [null])[0];
    const migGetState = isolateFn(sql, "mhq_get_state");
    tick(!!migGetState, "migration-cq-bridge.sql: could not isolate the re-created mhq_get_state body");
    if (migGetState) {
      tick(migGetState.includes("'cqLinked'") && /cqLinked['"]?,\s*\(st\.cq_name is not null\)/.test(migGetState),
        "migration-cq-bridge.sql: mhq_get_state's re-created body is missing the new cqLinked field (boolean, st.cq_name is not null)");
      for (const sentinel of ["furnitureShop", "termRunning", "canFeedToday", "levelInfo"]) {
        tick(migGetState.includes(sentinel),
          `migration-cq-bridge.sql: mhq_get_state's re-created body lost "${sentinel}" — the copy-forward tripwire (a past real incident, see schema.sql's header)`);
      }
    }

    // ---- the strongest form of "diff against schema.sql before committing":
    // schema.sql is supposed to carry the exact SAME bodies, byte-for-byte.
    // Pulled in raw (not comment-stripped) since a dropped/changed COMMENT
    // is still real drift between the two files. ----
    // DICE-PLAN.md, session 0b (2026-08-21): mhq_get_state was re-created
    // AGAIN, by migration-dice.sql (adds the `dice` field on top of
    // everything this section already checks for above) — so schema.sql's
    // copy was compared against THAT file for a while, not this section's
    // own migration-cq-bridge.sql.
    // Foreman build day, session B (2026-08-21): mhq_get_state was
    // re-created a THIRD time, by migration-mood-cravings.sql (adds
    // `mood`/`craving` to every blips[] entry, on top of dice's own `dice`
    // field and everything before it) — so schema.sql's copy is now
    // compared against THAT file, the new latest carrier in the chain
    // (cq-bridge -> dice -> mood-cravings). mhq_credit_cq/mhq_cq_link are
    // untouched by either later migration and still compare against
    // migration-cq-bridge.sql.
    const schemaRaw = await (await fetch("./supabase/schema.sql")).text();
    const moodRaw = await (await fetch("./supabase/migration-mood-cravings.sql")).text();
    const bodySrc = { mhq_get_state: { text: moodRaw, name: "migration-mood-cravings.sql" },
                       mhq_credit_cq: { text: raw, name: "migration-cq-bridge.sql" },
                       mhq_cq_link:   { text: raw, name: "migration-cq-bridge.sql" } };
    for (const fn of ["mhq_get_state", "mhq_credit_cq", "mhq_cq_link"]) {
      const src = bodySrc[fn];
      const migBody = isolateFn(src.text, fn);
      const schemaBody = isolateFn(schemaRaw, fn);
      tick(!!migBody && !!schemaBody, `could not isolate ${fn} in both ${src.name} and schema.sql`);
      if (migBody && schemaBody) {
        tick(migBody === schemaBody,
          `${fn}'s body differs between ${src.name} and schema.sql — the mirror-back must be byte-identical (comments included), or schema.sql silently stops matching live`);
      }
    }

    say("migration-cq-bridge.sql: cq_xp_credited column + cq_rate=30 seed present; mhq_credit_cq/mhq_cq_link both pin search_path AND are revoked from public/anon/authenticated + granted to service_role only; mhq_get_state carries cqLinked without losing its existing fields; all three re-created function bodies are byte-identical to schema.sql");
  } catch (e) { tick(false, "could not read/parse supabase/migration-cq-bridge.sql: " + e.message); }

  // ================= the collect-cq edge function =================
  try {
    const fnSrc = await (await fetch("./supabase/functions/collect-cq/index.ts")).text();
    tick(/req\.method === "OPTIONS"/.test(fnSrc), "collect-cq: missing an OPTIONS/CORS preflight branch");
    tick(/Access-Control-Allow-Origin/.test(fnSrc), "collect-cq: missing CORS headers — the browser calls this directly, unlike send-push");
    tick(/req\.method !== "POST"/.test(fnSrc) && /405/.test(fnSrc), "collect-cq: missing the 405-on-non-POST guard");
    tick(/admin\.rpc\(\s*["']mhq_cq_link["']/.test(fnSrc), "collect-cq: does not call mhq_cq_link via the service-role client");
    tick(/admin\.rpc\(\s*["']mhq_credit_cq["']/.test(fnSrc), "collect-cq: does not call mhq_credit_cq via the service-role client");
    tick(/error:\s*"not_linked"/.test(fnSrc), 'collect-cq: missing the {ok:false, error:"not_linked"} branch for an unlinked learner');
    tick((fnSrc.match(/error:\s*"cq_down"/g) || []).length >= 3,
      'collect-cq: expected at least 3 cq_down soft-fail sites (missing env, CQ fetch failing/non-200, CQ payload shape) — got fewer');
    tick(/Deno\.env\.get\("CQ_URL"\)/.test(fnSrc) && /Deno\.env\.get\("CQ_SERVICE_KEY"\)/.test(fnSrc),
      "collect-cq: does not read CQ_URL / CQ_SERVICE_KEY from the environment");
    tick(/display_name=eq\./.test(fnSrc) && /xp_events\?student_id=eq\./.test(fnSrc),
      "collect-cq: does not read CQ's students (by display_name) then xp_events (by student_id) over REST");

    // ---- xp_events paging (foreman review, 2026-08-21): Supabase's REST
    // layer silently caps an unpaged response at its own max-rows setting —
    // no error, just a truncated array — so the xp_events read MUST page
    // (limit/offset) rather than trust one fetch, or a learner who ever
    // crosses that line is permanently underpaid with no error anywhere. ----
    tick(/xp_events[\s\S]{0,120}limit=\$\{?XP_PAGE_SIZE\}?[\s\S]{0,60}offset=\$\{?offset\}?/.test(fnSrc),
      "collect-cq: the xp_events fetch does not page with limit=/offset= — an unpaged fetch silently truncates at Supabase's REST max-rows setting");
    tick(/for \(let page = 0; page < XP_MAX_PAGES; page\+\+\)/.test(fnSrc),
      "collect-cq: the xp_events read is missing its paging loop (for (let page = 0; page < XP_MAX_PAGES; page++))");
    tick(/rows\.length < XP_PAGE_SIZE\)\s*break;/.test(fnSrc),
      "collect-cq: the paging loop does not terminate on a short page (rows.length < XP_PAGE_SIZE)");
    // hitting the cap must be treated as cq_down, NEVER as a partial sum —
    // the whole point of the fix is that an undercounted total must never
    // reach mhq_credit_cq, so this line has to be a return, not a fallthrough.
    tick(/page === XP_MAX_PAGES - 1\)\s*return json\(\{\s*ok:\s*false,\s*error:\s*"cq_down"\s*\}\)/.test(fnSrc),
      'collect-cq: filling the page cap must return {ok:false, error:"cq_down"} — crediting a partial (truncated) total would be a silent, permanent underpay');
    tick(/const XP_MAX_PAGES = 50/.test(fnSrc) && /const XP_PAGE_SIZE = 1000/.test(fnSrc),
      "collect-cq: expected XP_PAGE_SIZE = 1000 and XP_MAX_PAGES = 50 (absurd-but-finite cap, 50k events/learner)");
    // the page-cap return must sit INSIDE the xp_events try block, so a page
    // that throws (not just a bad status) is still caught as cq_down too
    const xpBlock = (/let cqTotal = 0;[\s\S]*?\n  \}\n/.exec(fnSrc) || [""])[0];
    tick(xpBlock.includes("XP_MAX_PAGES") && xpBlock.includes("catch"),
      "collect-cq: the paging loop and its cap-check must live inside the same try/catch as the rest of the xp_events read");

    // never logs either credential (the header's own rule)
    const loggingLines = fnSrc.split("\n").filter((l) => /console\./.test(l));
    const leaky = loggingLines.filter((l) => /username|password/i.test(l));
    tick(leaky.length === 0, `collect-cq: ${leaky.length} console call(s) appear to reference username/password — neither may ever be logged: ${JSON.stringify(leaky)}`);
    say("collect-cq edge function: CORS + OPTIONS handled, POST-only, calls mhq_cq_link then mhq_credit_cq via the service-role client, soft-fails cq_down on a missing/unreachable/malformed CQ read, never logs the learner's credentials");
  } catch (e) { tick(false, "could not read supabase/functions/collect-cq/index.ts: " + e.message); }

  // ================= client: nothing calls the service-role RPCs directly =================
  // A bare substring ban would false-positive on the explanatory comments in
  // js/api.js and js/supabase.js (which name these RPCs to say WHY they are
  // never called directly) — so this checks for an actual rpc()-style
  // invocation, not the name appearing at all.
  const RPC_CALL_SCAN_FILES = ["js/supabase.js", "js/local-backend.js", "js/cq-collect.js", "js/screens.js", "js/api.js", "js/blip.js", "js/app.js"];
  for (const f of RPC_CALL_SCAN_FILES) {
    try {
      const src = await (await fetch(`./${f}`)).text();
      tick(!/rpc\(\s*["']mhq_credit_cq["']/.test(src), `${f} calls mhq_credit_cq via rpc() — that RPC is service_role-only; only the collect-cq edge function may call it`);
      tick(!/rpc\(\s*["']mhq_cq_link["']/.test(src), `${f} calls mhq_cq_link via rpc() — that RPC is service_role-only; only the collect-cq edge function may call it`);
    } catch (e) { tick(false, `could not read ${f}: ` + e.message); }
  }
  // and the client DOES reach the function the intended way
  const supabaseSrc = await (await fetch("./js/supabase.js")).text();
  tick(/functions\.invoke\(\s*name/.test(supabaseSrc) || /functions\.invoke\(/.test(supabaseSrc),
    "js/supabase.js: collectCq should reach collect-cq via supabase-js's functions.invoke(), not a hand-rolled fetch");
  tick(/invokeFn\("collect-cq"/.test(supabaseSrc), 'js/supabase.js: collectCq does not invoke the "collect-cq" function by name');

  // ================= local round-trip (live exercise) =================
  // A FRESH, isolated test account — never thabo_test/lerato_test — so this
  // section has no ordering dependency on 6j. setCqTotal() both links
  // cq_name (to the display_name, mirroring the seed's "copied verbatim"
  // rule) on first call and re-sets the fake CQ total on later calls;
  // calling it again with the SAME total is used purely as a read-back
  // (cq_xp_credited/cq_total are otherwise private to the local store).
  {
    const cqUser = "verify_cq_" + Math.random().toString(36).slice(2, 8);
    await LocalBackend.signup(cqUser, "Verify CQ", "pw1234");

    const beforeLink = await LocalBackend.getState(cqUser, "pw1234");
    tick(beforeLink.ok && beforeLink.cqLinked === false,
      `a freshly signed-up account should read cqLinked:false before any CQ link exists, got ${JSON.stringify(beforeLink && beforeLink.cqLinked)}`);

    const seeded = globalThis.__BLIP_DEV__.setCqTotal(250, cqUser);
    tick(seeded.cqName === "Verify CQ", `setCqTotal should link cq_name to the display_name, got ${JSON.stringify(seeded)}`);
    tick(seeded.cqTotal === 250 && seeded.cqXpCredited === 0, `fresh link should start at total 250, watermark 0, got ${JSON.stringify(seeded)}`);

    const afterLink = await LocalBackend.getState(cqUser, "pw1234");
    tick(afterLink.ok && afterLink.cqLinked === true,
      `after setCqTotal links the account, getState should read cqLinked:true, got ${JSON.stringify(afterLink && afterLink.cqLinked)}`);

    // rate 30, fake total 250, watermark 0 -> pays 8 (240 spent), gold +8
    const r1 = await LocalBackend.collectCq(cqUser, "pw1234");
    tick(r1.ok && r1.paid === 8, `rate 30 / total 250 / watermark 0 should pay 8 diamonds, got ${JSON.stringify(r1)}`);
    tick(r1.gold === 8, `first collect should leave gold at 8 (started at 0), got ${JSON.stringify(r1)}`);
    let peek = globalThis.__BLIP_DEV__.setCqTotal(250, cqUser); // read-back, total unchanged
    tick(peek.cqXpCredited === 240, `watermark should advance to 240 (8 * 30), got ${peek.cqXpCredited}`);

    // second collect, same total -> pays 0, moves nothing (double-tap safety)
    const r2 = await LocalBackend.collectCq(cqUser, "pw1234");
    tick(r2.ok && r2.paid === 0, `a second collect at the same total should pay 0, got ${JSON.stringify(r2)}`);
    tick(r2.gold === 8, `a zero-pay collect must not move gold, got ${JSON.stringify(r2)}`);
    peek = globalThis.__BLIP_DEV__.setCqTotal(250, cqUser);
    tick(peek.cqXpCredited === 240, `a zero-pay collect must not move the watermark, got ${peek.cqXpCredited}`);

    // raise the fake total to 275 -> delta 35 -> pays 1, remainder (5) banked
    globalThis.__BLIP_DEV__.setCqTotal(275, cqUser);
    const r3 = await LocalBackend.collectCq(cqUser, "pw1234");
    tick(r3.ok && r3.paid === 1, `total 275 (delta 35 from watermark 240) should pay 1 diamond (35/30 floored), got ${JSON.stringify(r3)}`);
    tick(r3.gold === 9, `third collect should leave gold at 9, got ${JSON.stringify(r3)}`);
    peek = globalThis.__BLIP_DEV__.setCqTotal(275, cqUser);
    tick(peek.cqXpCredited === 270, `watermark should be 270 (240 + 30) — the remaining 5 XP banked, never lost, got ${peek.cqXpCredited}`);

    // an unlinked account is refused with not_linked, never crediting anything
    const unlinkedUser = "verify_cq_unlinked_" + Math.random().toString(36).slice(2, 8);
    await LocalBackend.signup(unlinkedUser, "Verify Unlinked", "pw1234");
    const r4 = await LocalBackend.collectCq(unlinkedUser, "pw1234");
    tick(!r4.ok && r4.error === "not_linked", `collecting on an unlinked account should return {ok:false, error:"not_linked"}, got ${JSON.stringify(r4)}`);

    say("local round-trip: rate 30 · total 250, watermark 0 -> pays 8, gold +8, watermark 240 · repeat pays 0, moves nothing · total raised to 275 -> pays 1, watermark 270 (5 XP banked) · an unlinked account is refused not_linked");
  }

  // ================= Collect panel: client wiring (static, no server round-trip) =================
  const collectSrc = await (await fetch("./js/cq-collect.js")).text();
  tick(/if \(!app \|\| !app\.state \|\| !app\.state\.cqLinked\) return;/.test(collectSrc),
    "js/cq-collect.js: mountCqCollect must render nothing (return early) unless app.state.cqLinked — the plan's 'no broken collect UI' rule");
  tick(/btn\.disabled = true;[\s\S]*await api\.collectCq\(/.test(collectSrc),
    "js/cq-collect.js: the Collect button must disable BEFORE the api.collectCq() await (the double-submit rule)");
  tick(/app\.state\.gold = r\.gold/.test(collectSrc) && /\.goldchip b/.test(collectSrc),
    "js/cq-collect.js: a paid collect should patch app.state.gold AND the .goldchip b HUD text node in place");
  tick(/Nothing new to collect — go play a round!/.test(collectSrc), 'js/cq-collect.js: missing the paid:0 copy ("Nothing new to collect — go play a round!")');
  tick(/Couldn't reach Circle Quest — try again later\./.test(collectSrc), 'js/cq-collect.js: missing the cq_down soft-fail copy');

  const screensSrc2 = await (await fetch("./js/screens.js")).text();
  tick(/import\s*\{\s*mountCqCollect\s*\}\s*from\s*"\.\/cq-collect\.js"/.test(screensSrc2), "js/screens.js does not import mountCqCollect from ./cq-collect.js");
  tick(/mountCqCollect\(app,\s*card\.querySelector\(["']\.cg-collect["']\)\)/.test(screensSrc2), "js/screens.js: circleGeoCard() does not mount the Collect panel into .cg-collect");
  tick(/circleGeoCard\(app\)/.test(screensSrc2), "js/screens.js: circleGeoCard is not called with app (it needs app.state.cqLinked)");

  say("Collect panel wiring: mounts only when cqLinked, disable-before-await on the button, HUD gold chip patched in place (not a full app.refresh()), both the paid and paid:0 reveal copy present, wired into circleGeoCard()");
}

/* ---------- 6m. MOOD METER + CRAVINGS (foreman build day session B,
   2026-08-21) ----------
   supabase/migration-mood-cravings.sql is WRITTEN NOT RUN — this section
   parses it (like section 6's SQL<->client cross-checks) and exercises
   the whole round-trip against the local backend (like 6h/6h2). */
{
  // ---- SQL cross-checks ----
  let moodSql = "";
  try {
    moodSql = (await (await fetch("./supabase/migration-mood-cravings.sql")).text()).replace(/--[^\n]*/g, "");
  } catch (e) { tick(false, "could not read supabase/migration-mood-cravings.sql: " + e.message); }

  tick(/alter table public\.blips add column if not exists mood int not null default 0;/.test(moodSql),
    "migration-mood-cravings.sql should add blips.mood (int not null default 0)");
  tick(/alter table public\.blips add column if not exists mood_day date;/.test(moodSql),
    "migration-mood-cravings.sql should add blips.mood_day (date)");

  const moodFnCount = (moodSql.match(/create or replace function public\./g) || []).length;
  const moodSpCount = (moodSql.match(/set search_path/g) || []).length;
  /* ⚠️ SIX, not the brief's "exactly three [copy-forward] functions" — a
     documented deviation. Two brand-new helpers (_mhq_mood_effective,
     _mhq_craving) plus FOUR re-created RPCs: mhq_get_state/mhq_feed/
     mhq_eat_food (the three named in the brief) PLUS mhq_care, which the
     design section separately requires ("soup/medicine also +1 when
     consumed via care") and which has no other home. Flagged loudly in
     the migration's own header for the foreman to review. */
  tick(moodFnCount === 6, `migration-mood-cravings.sql should define 6 functions (2 new helpers + mhq_get_state/mhq_feed/mhq_eat_food/mhq_care re-created), got ${moodFnCount}`);
  tick(moodSpCount >= moodFnCount, `migration-mood-cravings.sql: ${moodFnCount} functions but only ${moodSpCount} search_path pins — every one must be pinned (house rule)`);
  tick(/create or replace function public\.mhq_care/.test(moodSql),
    'migration-mood-cravings.sql should re-create mhq_care too (the +1-on-a-care-day gain has no other home) — see the header\'s judgement-call note');

  // literals: the SQL must agree with js/config.js's MOOD block, not a
  // copy of the numbers frozen at write time.
  tick(new RegExp(`least\\(${MOOD.max},`).test(moodSql), `migration-mood-cravings.sql should cap mood at MOOD.max (${MOOD.max}) via least(${MOOD.max}, ...)`);
  tick(new RegExp(`${MOOD.dailyDecay} \\* greatest`).test(moodSql), `_mhq_mood_effective should decay by MOOD.dailyDecay (${MOOD.dailyDecay}) per day`);
  tick(new RegExp(`then ${MOOD.cravingGain} else ${MOOD.foodGain} end`).test(moodSql), `mhq_eat_food's gain should be MOOD.cravingGain (${MOOD.cravingGain}) on a hit, else MOOD.foodGain (${MOOD.foodGain})`);
  tick(/item_id not in \('soup', 'medicine', 'treat'\)/.test(moodSql), "_mhq_craving should exclude soup/medicine/treat from the craving pool (treat is never edible via mhq_eat_food, so craving it would make the bonus unearnable)");
  tick(/order by item_id/.test(moodSql), "_mhq_craving should order by item_id for a stable index (shop_items has no bare `id` column)");

  say(`SQL: migration-mood-cravings.sql — ${moodFnCount} functions (2 helpers + get_state/feed/eat_food/care), ${moodSpCount} search_path pins, columns + MOOD literals present`);

  // ---- local-backend round trip ----
  const mu = "verify_mood_" + Math.random().toString(36).slice(2, 8);
  await LocalBackend.signup(mu, "Moodling", "pw12");
  // stay level 1 the same deterministic way section 6h does: 0-xp rounds
  for (let i = 0; i < 10; i++) await LocalBackend.submitQuest(mu, "pw12", "q" + ((i % 3) + 1), { score: 0.9, xp: 0 });
  let st = await LocalBackend.getState(mu, "pw12");
  tick(st.blips && st.blips[0] && typeof st.blips[0].mood === "number", `a fresh blip should carry a numeric mood field, got ${JSON.stringify(st.blips && st.blips[0])}`);
  tick(st.blips[0].mood === 0, `a never-fed blip should read mood 0, got ${st.blips[0].mood}`);
  tick(typeof st.blips[0].craving === "string" && !!st.blips[0].craving, `a fresh Lv1 blip should still have a craving of the day, got ${JSON.stringify(st.blips[0].craving)}`);
  tick(!NON_GROCERY_FOOD.includes(st.blips[0].craving), `the craving must never be soup/medicine/treat, got "${st.blips[0].craving}"`);
  const cravedRow0 = (st.foodShop || []).find((f) => f.id === st.blips[0].craving);
  tick(!!cravedRow0 && cravedRow0.minLevel <= 1, `the craving must come from an UNLOCKED tier (Lv1 learner) — "${st.blips[0].craving}" has minLevel ${cravedRow0 && cravedRow0.minLevel}`);

  // deterministic for a fixed day: two reads, same craving, no day skip
  const stAgain = await LocalBackend.getState(mu, "pw12");
  tick(stAgain.blips[0].craving === st.blips[0].craving, `the craving should be stable within the same day, got "${st.blips[0].craving}" then "${stAgain.blips[0].craving}"`);

  // ---- eat NON-craved food: +MOOD.foodGain, economy untouched ----
  const craving = st.blips[0].craving;
  const plainFood = FOOD_IDS.find((id) => id !== craving);
  await LocalBackend.buyItem(mu, "pw12", plainFood);
  const beforeEat = await LocalBackend.getState(mu, "pw12");
  const eatPlain = await LocalBackend.eatFood(mu, "pw12", plainFood);
  tick(eatPlain.ok && eatPlain.craved === false && eatPlain.moodGain === MOOD.foodGain,
    `eating a non-craved food should pay MOOD.foodGain (${MOOD.foodGain}) and report craved:false, got ${JSON.stringify(eatPlain)}`);
  tick(eatPlain.blips[0].mood === Math.min(MOOD.max, beforeEat.blips[0].mood + MOOD.foodGain),
    `mood after a plain eat should be beforeEat.mood + MOOD.foodGain (capped), got ${eatPlain.blips[0].mood} (was ${beforeEat.blips[0].mood})`);
  const afterEat = await LocalBackend.getState(mu, "pw12");
  tick(afterEat.xp === beforeEat.xp && afterEat.gold === beforeEat.gold && afterEat.levelInfo.level === beforeEat.levelInfo.level
    && afterEat.blips[0].feedCount === beforeEat.blips[0].feedCount && afterEat.blips[0].growthStage === beforeEat.blips[0].growthStage,
    `eating must not touch xp/gold/level/growth — mood is not allowed to leak into the economy. before ${JSON.stringify({ xp: beforeEat.xp, gold: beforeEat.gold, lvl: beforeEat.levelInfo.level, fc: beforeEat.blips[0].feedCount })}, after ${JSON.stringify({ xp: afterEat.xp, gold: afterEat.gold, lvl: afterEat.levelInfo.level, fc: afterEat.blips[0].feedCount })}`);

  // ---- eat the CRAVED food: +MOOD.cravingGain ----
  const beforeCraved = await LocalBackend.getState(mu, "pw12");
  await LocalBackend.buyItem(mu, "pw12", craving);
  const eatCraved = await LocalBackend.eatFood(mu, "pw12", craving);
  tick(eatCraved.ok && eatCraved.craved === true && eatCraved.moodGain === MOOD.cravingGain,
    `eating the day's craved food ("${craving}") should pay MOOD.cravingGain (${MOOD.cravingGain}) and report craved:true, got ${JSON.stringify(eatCraved)}`);
  tick(eatCraved.blips[0].mood === Math.min(MOOD.max, beforeCraved.blips[0].mood + MOOD.cravingGain),
    `mood after a craved eat should be beforeCraved.mood + MOOD.cravingGain (capped), got ${eatCraved.blips[0].mood} (was ${beforeCraved.blips[0].mood})`);

  // ---- cap at MOOD.max, however many gains stack up ----
  for (let i = 0; i < 6; i++) {
    await LocalBackend.buyItem(mu, "pw12", plainFood);
    await LocalBackend.eatFood(mu, "pw12", plainFood);
  }
  const capped = await LocalBackend.getState(mu, "pw12");
  tick(capped.blips[0].mood === MOOD.max, `mood should cap at MOOD.max (${MOOD.max}) after repeated feeding, got ${capped.blips[0].mood}`);

  // ---- decay: skip days, mood falls by MOOD.dailyDecay per day, floored at 0 ----
  globalThis.__BLIP_DEV__.skipDays(1);
  const oneDayOn = await LocalBackend.getState(mu, "pw12");
  tick(oneDayOn.blips[0].mood === Math.max(0, MOOD.max - MOOD.dailyDecay),
    `after 1 day with no feed, mood should decay by MOOD.dailyDecay (${MOOD.dailyDecay}), got ${oneDayOn.blips[0].mood} (was ${MOOD.max})`);
  globalThis.__BLIP_DEV__.skipDays(10);
  const longGone = await LocalBackend.getState(mu, "pw12");
  tick(longGone.blips[0].mood === 0, `mood should never decay below 0, got ${longGone.blips[0].mood} after a 10-day skip`);
  globalThis.__BLIP_DEV__.reset();

  // ---- the free cookie is +MOOD.cookieGain too ----
  const beforeCookie = await LocalBackend.getState(mu, "pw12");
  const cookie = await LocalBackend.feed(mu, "pw12");
  tick(cookie.ok && cookie.blips[0].mood === Math.min(MOOD.max, beforeCookie.blips[0].mood + MOOD.cookieGain),
    `the free cookie should pay MOOD.cookieGain (${MOOD.cookieGain}), got ${JSON.stringify(cookie.blips && cookie.blips[0])} (was ${beforeCookie.blips[0].mood})`);

  say(`local round-trip (${mu}): fresh blip mood 0, craving from an unlocked non-care tier and stable within a day · plain eat +${MOOD.foodGain} · craved eat +${MOOD.cravingGain} (xp/gold/level/growth untouched by either) · caps at ${MOOD.max} · decays ${MOOD.dailyDecay}/day, floors at 0 · cookie +${MOOD.cookieGain}`);

  // ---- a genuine care day is +1 mood too (mhq_care, the 4th re-created function) ----
  {
    const cu = "verify_mood_care_" + Math.random().toString(36).slice(2, 8);
    await LocalBackend.signup(cu, "Careling", "pw12");
    for (let i = 0; i < 10; i++) await LocalBackend.submitQuest(cu, "pw12", "q" + ((i % 3) + 1), { score: 0.9, xp: 0 });
    await LocalBackend.buyItem(cu, "pw12", "soup");
    await LocalBackend.buyItem(cu, "pw12", "medicine");
    await LocalBackend.adminSetTerm("admin", true);
    let sick = await LocalBackend.getState(cu, "pw12");
    for (let d = 0; d < 14 && sick.health.stage < 2; d++) {
      globalThis.__BLIP_DEV__.skipDays(1);
      sick = await LocalBackend.getState(cu, "pw12");
    }
    tick(sick.health.stage >= 2, `stepping days should have made him sick enough for care, got ${JSON.stringify(sick.health)}`);
    const beforeCare = sick.blips[0].mood;
    const care = await LocalBackend.care(cu, "pw12");
    tick(care.ok, `a fully-supplied, genuinely sick, qualifying-day care should succeed, got ${JSON.stringify(care)}`);
    const afterCare = await LocalBackend.getState(cu, "pw12");
    tick(afterCare.blips[0].mood === Math.min(MOOD.max, beforeCare + 1),
      `a real care day should pay +1 mood ("being cared for feels good"), got ${afterCare.blips[0].mood} (was ${beforeCare})`);
    globalThis.__BLIP_DEV__.reset();
    await LocalBackend.adminSetTerm("admin", false);
    say(`care-day mood (${cu}): genuinely sick + supplied + qualifying day -> care() succeeds and pays +1 mood, streak/heal logic itself untouched`);
  }

  // ---- client wiring (static): hearts are their own sibling, never inside
  // the name-editor's cleared container; feed feedback fires on both paths;
  // spontaneous moments reuse playTapReaction's own sick/sleep/recovering
  // guards rather than re-implementing them ----
  const blipSrc = await (await fetch("./js/blip.js")).text();
  tick(/titleWrap\.appendChild\(nameRow\);\s*[\s\S]{0,400}titleWrap\.appendChild\(moodHeartsRow\(activeBlip\.mood\)\)/.test(blipSrc),
    "js/blip.js: the hearts row must be appended to titleWrap AFTER nameRow, as nameRow's sibling — never inside nameWrap (mountNameEditor clears that container every render)");
  tick(/function moodHeartsRow/.test(blipSrc) && /function floatMoodGain/.test(blipSrc) && /function cravingBubble/.test(blipSrc),
    "js/blip.js is missing one of moodHeartsRow/floatMoodGain/cravingBubble");
  tick(/floatMoodGain\(roomStage, MOOD\.cookieGain\)/.test(blipSrc), "js/blip.js: the cookie feed path must call floatMoodGain(roomStage, MOOD.cookieGain)");
  tick(/floatMoodGain\(roomStage, gain\)/.test(blipSrc), "js/blip.js: the grocery feed path must call floatMoodGain with the server-reported gain");
  tick(/playTapReaction\(blipHandle\)/.test(blipSrc), "js/blip.js: spontaneous mood expression should reuse playTapReaction (its own sick/sleep/recovering guards), not a hand-rolled animation call");
  tick(/\(activeBlip\.mood \|\| 0\) >= 4/.test(blipSrc), "js/blip.js: spontaneous moments should be gated on mood >= 4, per the brief");
  tick(/host\.isConnected/.test(blipSrc) && /spontaneousMoodTimer/.test(blipSrc), "js/blip.js: the spontaneous-moment interval must self-clear (no unmount hook exists on this screen) and be cleared again on every fresh render");
  say("client wiring: hearts row is nameRow's sibling (never cleared by mountNameEditor), feed feedback wired on both the cookie and grocery paths, spontaneous moments reuse playTapReaction's guards and are gated on mood>=4, the interval self-clears");
}

/* ---------- report ---------- */
const banner = document.getElementById("banner");
banner.className = fails.length ? "fail" : "pass";
banner.textContent = fails.length
  ? `${fails.length} of ${total} checks FAILED`
  : `all ${total} checks passed`;
say("");
say(fails.length ? "FAILURES:\n" + fails.map((f) => "  ✗ " + f).join("\n") : "no failures");
document.getElementById("log").textContent = lines.join("\n");
</script>
</body>
</html>

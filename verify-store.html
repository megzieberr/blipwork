<h2>Assertions</h2>
<pre id="log">…</pre>

<h2>Every accessory, alone on the body (eyeball these)</h2>
<div class="grid" id="solo"></div>

<h2>Full outfits — one item in every slot at once</h2>
<div class="grid" id="outfits"></div>

<script>
/* Test isolation (review fix, 2026-08-09). The local backend lives in
   localStorage, and a previous run — or a ?local=1 walk of the app in the
   same browser — leaves accounts, XP and PENDING MILESTONE BOXES behind.
   The box tests then read counts like {pending:2} and fail on a suite
   that is actually healthy: three false-reds that cost a review session
   a diagnosis today. This page is dev-only, so a clean slate per run is
   always correct. Classic (non-module) script so it runs BEFORE the
   module below evaluates its imports. */
(function () {
  const mine = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.indexOf("mhq.") === 0) mine.push(k);
  }
  mine.forEach((k) => localStorage.removeItem(k));
})();
</script>

<script type="module">
import { ACCESSORIES, ATTACH, COLOURS, renderCompanion, tintedImageSrc } from "./js/companion/renderer.js";
import { ITEM_LABELS, itemRarity, accessorySlot, COSMETIC_SLOTS, SLOT_LABELS } from "./js/companion/blip-ui.js";
import { LocalBackend } from "./js/local-backend.js";
import { levelInfo, costForLevel, MAX_LEVEL, MILESTONE_LEVELS } from "./js/companion/level.js";
import { TRINKETS, TRINKET_IDS, trinketLabel } from "./js/companion/trinkets.js";
import {
  COLLECTIONS, COLLECTION_ORDER, collectionForItem,
  FOOD_COLLECTIONS, FOOD_COLLECTION_ORDER, foodCollectionForItem,
  FURNITURE_COLLECTIONS, FURNITURE_COLLECTION_ORDER, furnitureCollectionForItem,
} from "./js/companion/collections.js";
import {
  FURNITURE, FURNITURE_IDS, FURNITURE_SLOTS, DEFAULT_FURNITURE, SLOT_PLACEMENT,
  furnitureLabel, furnitureImgSrc, placementFor, roomFurniture, homeworkBadgeLayer,
} from "./js/companion/furniture.js";
import { FOODS, FOOD_IDS, NON_GROCERY_FOOD, foodLabel, foodImgSrc } from "./js/companion/food.js";
import { makeDraggable, isOverTarget, DEFAULT_DROP_PAD_PX } from "./js/companion/drag-feed.js";
import { hasActiveAssignment } from "./js/assignment.js";

let total = 0; const fails = [];
const tick = (cond, label) => { total++; if (!cond) fails.push(label); return cond; };
const lines = [];
const say = (s) => lines.push(s);

/* ---------- the client's own catalogue mirror ---------- */
// local-backend keeps SHOP_ITEMS module-private, so read the catalogue the
// way the app does: through a real signed-up learner's state payload.
const uname = "verify_store_" + Math.random().toString(36).slice(2, 8);
await LocalBackend.signup(uname, "Verify", "pw12");
const state = await LocalBackend.getState(uname, "pw12");
const shop = (state.shop || []);
// S4: the pharmacy/grocery array. Separate payload key, separate mirror —
// a food row must never turn up in `shop` and vice versa.
const foodShop = (state.foodShop || []);
// S5v2: the furniture array. Third separate payload key, third separate
// mirror — furniture must never turn up in `shop` (it would be offered as a
// wearable AND land in both treasure-box loot pools) and vice versa.
const furnShop = (state.furnitureShop || []);
say(`shop payload: ${shop.length} cosmetic items · ${foodShop.length} food items · ${furnShop.length} furniture items`);

/* ---------- 1. every sellable id can actually be drawn ---------- */
for (const it of shop) {
  tick(!!ACCESSORIES[it.id], `shop item "${it.id}" has no ACCESSORIES entry (would render as an empty card)`);
  tick(!!ITEM_LABELS[it.id], `shop item "${it.id}" has no friendly label (would show its raw id)`);
  if (ACCESSORIES[it.id]) {
    tick(ACCESSORIES[it.id].slot === it.slot,
      `slot mismatch for "${it.id}": shop says ${it.slot}, renderer says ${ACCESSORIES[it.id].slot}`);
  }
}

/* ---------- 2. every drawable accessory has a home ---------- */
for (const [id, def] of Object.entries(ACCESSORIES)) {
  tick(!!ATTACH[def.slot], `accessory "${id}" uses slot "${def.slot}" with no ATTACH point`);
  tick(!!ITEM_LABELS[id], `accessory "${id}" has no friendly label`);
  tick(typeof def.widthPct === "number" && def.widthPct > 0, `accessory "${id}" has no widthPct`);
  // An accessory is drawn EITHER as inline SVG or as a Tripo PNG, never both.
  tick(!!def.svg !== !!def.img, `accessory "${id}" must have exactly one of svg / img`);
  if (def.svg) {
    tick(/viewBox="0 0 \d+ \d+"/.test(def.svg), `accessory "${id}" svg has no plain viewBox`);
    // {{UID}} placeholders must be paired with an internal id, else a stray
    // token ends up in the DOM
    tick(!def.svg.includes("{{UID}}") || /id="[^"]*\{\{UID\}\}/.test(def.svg),
      `accessory "${id}" uses {{UID}} but defines no id with it`);
  } else {
    tick(/^[a-z0-9-]+\.png$/.test(def.img), `accessory "${id}" img must be a bare .png filename`);
  }
}

/* ---------- 2b. every Tripo PNG accessory's art is actually there ----------
   The renderer drops a layer whose image 404s (so a missing file is silent
   in the app on purpose). That makes this the only place it gets caught. */
{
  const pngItems = Object.entries(ACCESSORIES).filter(([, d]) => d.img);
  const missing = [];
  await Promise.all(pngItems.map(async ([id, d]) => {
    try {
      // Cache-bust: sw.js serves images CACHE-FIRST and its cache.match does
      // not ignore search params, so a unique query is the only way to ask
      // the network. Without it a deleted file still reported present.
      const r = await fetch(`./assets/companion/items/${d.img}?v=${Date.now()}`, { method: "HEAD" });
      if (!r.ok) missing.push(id);
    } catch { missing.push(id); }
  }));
  tick(missing.length === 0,
    `${missing.length} Tripo item PNG(s) missing: ${missing.join(", ")} — ` +
    `run tools/tripo_sheet.py over the sheets in art-source/tripo/`);
  say(`Tripo PNG items: ${pngItems.length - missing.length}/${pngItems.length} present`);
}

/* ---------- 3. the free tier really does cover every slot ---------- */
for (const slot of COSMETIC_SLOTS) {
  const inSlot = shop.filter((it) => it.slot === slot);
  tick(inSlot.length >= 2, `slot "${slot}" sells ${inSlot.length} item(s) — the point of this work was a real choice in every slot`);
  const free = inSlot.filter((it) => it.price === 0 && it.minLevel === 1);
  tick(free.length >= 1, `slot "${slot}" has no free level-1 item — a new learner can't fill it`);
}
say(`slots: ${COSMETIC_SLOTS.map((s) => `${SLOT_LABELS[s]} ${shop.filter((i) => i.slot === s).length}`).join(" · ")}`);

/* ---------- 4. rarity bands ---------- */
tick(itemRarity(0) === "free" && itemRarity(50) === "common" && itemRarity(120) === "rare" && itemRarity(200) === "rare",
  "itemRarity bands are wrong");
const rare = shop.filter((it) => itemRarity(it.price) === "rare");
tick(rare.every((it) => it.minLevel >= 6), "a rare item is buyable below level 6");
say(`rares: ${rare.map((r) => `${r.id}(L${r.minLevel}/${r.price})`).join(", ")}`);

/* ---------- 5. free items must not be treasure-box loot ---------- */
// The box pool is `price > 0 && minLevel <= level && !owned`. Rebuilt here
// from the same payload the backend filters, so a free item creeping back
// into the pool shows up as a failure rather than as a sad box on a phone.
const freeIds = new Set(shop.filter((it) => it.price === 0).map((it) => it.id));
tick(freeIds.size === COSMETIC_SLOTS.length,
  `expected one free item per slot (${COSMETIC_SLOTS.length}), found ${freeIds.size}`);
const levelOnePool = shop.filter((it) => it.price > 0 && it.minLevel <= 1);
tick(levelOnePool.every((it) => !freeIds.has(it.id)), "a free item is inside the level-1 loot pool");
tick(levelOnePool.length > 0, "the level-1 loot pool is empty — every box would pay gold instead");
say(`level-1 loot pool: ${levelOnePool.length} paid items (${levelOnePool.map((i) => i.id).join(", ")})`);

/* ---------- 6. the SQL seed and the client mirror agree ---------- */
// This is the drift that bites: a new item added to one side only. Parse the
// ids straight out of the migration and compare sets.
const MIGRATIONS = [
  ["migration-store-expansion.sql", 16],
  ["migration-effects-slot.sql", 12],
  ["migration-tripo-wave2.sql", 10],
  ["migration-neck-slot.sql", 1],
  ["migration-neck-necklaces.sql", 5],
  ["migration-neck-chunky-chain.sql", 1],
  // S2 (2026-08-08): six TRINKET rows. These are category 'trinket', so they
  // are cross-checked against js/companion/trinkets.js rather than against the
  // shop payload — a trinket must never appear in the shop.
  ["migration-level-curve-40.sql", 6],
  // S3 (2026-08-08): wave-3 themed collections. star-wand is deliberately
  // NOT among these 16 — see the "star-wand stays cut" check below.
  ["migration-wave3-collections.sql", 16],
  // Seeds nothing — it only DELETES crystal-orbit and neural-crown, which
  // the retired scan above picks up and then enforces are absent from the
  // client mirror.
  ["migration-cut-items.sql", 0],
  // S4 (2026-08-08): the grocery store. These are category 'food' / slot
  // 'food', so they are cross-checked against the foodShop payload, NOT the
  // cosmetic shop — and against their ABSENCE from it.
  ["migration-food-shop.sql", 44],
  // S5v2 (2026-08-08): furniture. Four NEW SLOTS, so this file gets the full
  // "is the slot named in BOTH shop_items_slot_cat_check AND mhq_equip?"
  // treatment below — that pair is what the July cape bug was.
  ["migration-furniture-slots.sql", 18],
];
// An applied migration is never edited — it is the record of what actually
// ran — so an item that is seeded by one migration and later dropped by a
// newer one is STILL in the older file, and must not be demanded of the
// client mirror. Collect those first (shadow-crown went this way).
const retired = new Set();
for (const [file] of MIGRATIONS) {
  try {
    const t = (await (await fetch(`./supabase/${file}`)).text()).replace(/--[^\n]*/g, "");
    for (const m of t.matchAll(/delete\s+from\s+public\.shop_items\s+where\s+item_id\s*=\s*'([a-z0-9-]+)'/gi)) retired.add(m[1]);
    for (const m of t.matchAll(/set\s+active\s*=\s*false[^;]*?item_id\s+in\s*\(([^)]*)\)/gis))
      for (const q of m[1].matchAll(/'([a-z0-9-]+)'/g)) retired.add(q[1]);
  } catch { /* reported per-file below */ }
}
if (retired.size) say(`retired by a later migration (not expected in the client): ${[...retired].join(", ")}`);
for (const id of retired) {
  tick(!shop.some((it) => it.id === id), `"${id}" is retired in SQL but still in the client shop mirror`);
}

for (const [file, expected] of MIGRATIONS) try {
  const raw = await (await fetch(`./supabase/${file}`)).text();
  // Strip -- comments first. Every one of these migrations EXPLAINS in prose
  // what it does or deliberately does not do to shop_items_slot_cat_check and
  // mhq_equip, and the slot checks below look for those names — reading the
  // comments made a migration that correctly leaves both alone (wave 2 adds
  // no slot) fail all seven of its slots.
  const sql = raw.replace(/--[^\n]*/g, "");
  const seeded = [...sql.matchAll(/^\s*\('([a-z0-9-]+)',\s*'([a-z]+)',\s*(\d+),\s*(\d+),\s*true/gim)]
    .map((m) => ({ id: m[1], slot: m[2], price: +m[3], minLevel: +m[4] }));
  tick(seeded.length === expected, `${file} seeds ${seeded.length} rows, expected ${expected}`);
  // Neither a trinket, a food nor a piece of furniture is a cosmetic: none of
  // them reaches the `shop` payload, so each is checked against its own
  // mirror — and against its ABSENCE from the shop. Furniture is matched by
  // SLOT rather than by anything cleverer, so a fifth furniture slot added
  // one day without touching this line lands in `cosmeticRows` and fails
  // loudly against the cosmetic mirror instead of being waved through.
  const FURN_SLOT_IDS = ["bed", "desk", "window", "door"];
  const cosmeticRows = seeded.filter((r) => r.slot !== "trinket" && r.slot !== "food" && !FURN_SLOT_IDS.includes(r.slot));
  const trinketRows = seeded.filter((r) => r.slot === "trinket");
  const foodRows = seeded.filter((r) => r.slot === "food");
  const furnRows = seeded.filter((r) => FURN_SLOT_IDS.includes(r.slot));
  for (const row of cosmeticRows) {
    if (retired.has(row.id)) continue;
    const mirror = shop.find((it) => it.id === row.id);
    tick(!!mirror, `"${row.id}" is in ${file} but not in the client shop mirror`);
    if (mirror) {
      tick(mirror.price === row.price, `"${row.id}" price differs: SQL ${row.price}, client ${mirror.price}`);
      tick(mirror.minLevel === row.minLevel, `"${row.id}" minLevel differs: SQL ${row.minLevel}, client ${mirror.minLevel}`);
      tick(mirror.slot === row.slot, `"${row.id}" slot differs: SQL ${row.slot}, client ${mirror.slot}`);
    }
  }
  for (const row of trinketRows) {
    tick(!!TRINKETS[row.id], `trinket "${row.id}" is in ${file} but has no js/companion/trinkets.js entry`);
    tick(row.price === 0, `trinket "${row.id}" is priced ${row.price} — trinkets are never sold`);
    tick(!shop.some((it) => it.id === row.id), `trinket "${row.id}" leaked into the shop payload`);
    tick(!ACCESSORIES[row.id], `trinket "${row.id}" is also an ACCESSORY — it would become wearable`);
  }
  /* S4 — the drift this catches is a grocery whose price or level gate was
     changed in the SQL and not in js/local-backend.js (or the other way
     round), which would make ?local=1 quietly disagree with live. */
  for (const row of foodRows) {
    const mirror = foodShop.find((it) => it.id === row.id);
    tick(!!mirror, `"${row.id}" is in ${file} but not in the client foodShop mirror`);
    if (mirror) {
      tick(mirror.price === row.price, `food "${row.id}" price differs: SQL ${row.price}, client ${mirror.price}`);
      tick(mirror.minLevel === row.minLevel, `food "${row.id}" minLevel differs: SQL ${row.minLevel}, client ${mirror.minLevel}`);
      tick(mirror.kind === row.id, `food "${row.id}" kind is "${mirror.kind}" — the server sends item_id as the kind`);
    }
    tick(!shop.some((it) => it.id === row.id), `food "${row.id}" leaked into the cosmetic shop payload`);
    tick(!ACCESSORIES[row.id], `food "${row.id}" is also an ACCESSORY — it would become wearable`);
    tick(!!FOODS[row.id], `food "${row.id}" is in ${file} but has no js/companion/food.js entry (no label, no art)`);
  }
  /* S5v2 — the same drift check as food, one category along: a furniture
     price or level gate changed in the SQL and not in js/local-backend.js
     (or the other way round) would make ?local=1 quietly disagree with
     live. Plus the two absences that matter: furniture must not reach the
     cosmetic shop payload (where it would be offered as wearable AND land
     in both treasure-box loot pools) and must not be an ACCESSORY. */
  for (const row of furnRows) {
    const mirror = furnShop.find((it) => it.id === row.id);
    tick(!!mirror, `"${row.id}" is in ${file} but not in the client furnitureShop mirror`);
    if (mirror) {
      tick(mirror.price === row.price, `furniture "${row.id}" price differs: SQL ${row.price}, client ${mirror.price}`);
      tick(mirror.minLevel === row.minLevel, `furniture "${row.id}" minLevel differs: SQL ${row.minLevel}, client ${mirror.minLevel}`);
      tick(mirror.slot === row.slot, `furniture "${row.id}" slot differs: SQL ${row.slot}, client ${mirror.slot}`);
    }
    tick(!shop.some((it) => it.id === row.id), `furniture "${row.id}" leaked into the cosmetic shop payload`);
    tick(!foodShop.some((it) => it.id === row.id), `furniture "${row.id}" leaked into the foodShop payload`);
    tick(!ACCESSORIES[row.id], `furniture "${row.id}" is also an ACCESSORY — it would be worn on Blip`);
    tick(!!FURNITURE[row.id], `furniture "${row.id}" is in ${file} but has no js/companion/furniture.js entry (no label, no art, nowhere to stand)`);
  }
  // A slot is never just new rows: mhq_equip hard-codes the allowed equipped
  // keys and shop_items_slot_cat_check hard-codes the slots. Missing either
  // is what made an equipped cape return bad_equipped in July, so assert
  // that every slot this migration seeds is named in BOTH.
  for (const slot of new Set([...cosmeticRows, ...furnRows].map((r) => r.slot))) {
    const inConstraint = new RegExp(`slot in \\([^)]*'${slot}'`).test(sql);
    const inEquip = new RegExp(`k not in \\([^)]*'${slot}'`).test(sql);
    tick(inConstraint || !sql.includes("shop_items_slot_cat_check"),
      `${file} seeds slot "${slot}" but does not allow it in shop_items_slot_cat_check`);
    tick(inEquip || !sql.includes("mhq_equip"),
      `${file} seeds slot "${slot}" but does not allow it in mhq_equip's key list`);
  }
  // The trinket slot is the mirror image: it MUST be allowed by the category
  // constraint and MUST NOT appear in mhq_equip's key list. A trinket that
  // became equippable would need an ATTACH point it does not have.
  if (trinketRows.length) {
    tick(/category = 'trinket'\s+and slot = 'trinket'/.test(sql),
      `${file} seeds trinkets but shop_items_slot_cat_check does not allow the trinket category`);
    tick(!/k not in \([^)]*'trinket'/.test(sql),
      `${file} added 'trinket' to mhq_equip's key list — trinkets must not be equippable`);
  }
  say(`${file}: ${seeded.length} rows (${cosmeticRows.length} cosmetic, ${trinketRows.length} trinket, ${foodRows.length} food, ${furnRows.length} furniture), all cross-checked`);
} catch (e) {
  tick(false, `could not read supabase/${file}: ` + e.message);
}

/* ---------- 6b. the level curve (room build S2) ----------
   cost(L) = 200 + 60*(L-1), cap 40. The SQL is the source of truth and
   js/companion/level.js is its ONLY mirror, so both the arithmetic and the
   agreement between the two files are asserted here. The anchors are the
   ones ROOM-BUILD-PLAN.md's pacing was designed around — if they move, the
   milestone levels and every shop level gate quietly mean something else. */
{
  tick(MAX_LEVEL === 40, `MAX_LEVEL is ${MAX_LEVEL}, expected 40`);
  tick(costForLevel(1) === 200 && costForLevel(2) === 260 && costForLevel(10) === 740,
    `cost(L) is not 200 + 60*(L-1): got ${costForLevel(1)}/${costForLevel(2)}/${costForLevel(10)}`);
  const ANCHORS = [[0, 1], [199, 1], [200, 2], [3959, 9], [3960, 10], [14060, 20], [30160, 30], [52260, 40]];
  for (const [xp, lvl] of ANCHORS) {
    tick(levelInfo(xp).level === lvl, `levelInfo(${xp}).level is ${levelInfo(xp).level}, expected ${lvl}`);
  }
  tick(levelInfo(3960).intoLevel === 0, "level 10 should land exactly on the boundary (intoLevel 0)");
  tick(levelInfo(52260).nextCost === null, "nextCost must be null at the cap — there is no level 41");
  tick(levelInfo(999999).level === 40, "the cap does not hold above the last anchor");
  tick(levelInfo(-50).level === 1 && levelInfo(null).level === 1, "negative/absent xp must read as level 1");
  say(`curve: L10 ${3960} XP · L20 ${14060} · L30 ${30160} · L40 ${52260} (cap ${MAX_LEVEL})`);

  // Same curve in SQL, in both places a schema change is meant to land.
  for (const f of ["migration-level-curve-40.sql", "schema.sql"]) try {
    const sql = (await (await fetch(`./supabase/${f}`)).text()).replace(/--[^\n]*/g, "");
    tick(/cost\s*:=\s*200\s*\+\s*60\s*\*\s*\(\s*lvl\s*-\s*1\s*\)/.test(sql),
      `supabase/${f} does not carry cost(L) = 200 + 60*(lvl-1)`);
    tick(/lvl\s*>=\s*40/.test(sql), `supabase/${f} does not cap _mhq_level at 40`);
    tick(!/power\(1\.5/.test(sql), `supabase/${f} still has the old 1.5^(L-1) curve in it`);
  } catch (e) { tick(false, `could not read supabase/${f}: ` + e.message); }
}

/* ---------- 6c. trinkets are complete, and are not cosmetics ---------- */
{
  tick(TRINKET_IDS.length === 6, `expected 6 trinkets, found ${TRINKET_IDS.length}`);
  for (const id of TRINKET_IDS) {
    const def = TRINKETS[id];
    tick(!!def.label && trinketLabel(id) === def.label, `trinket "${id}" has no label`);
    tick(!!def.line, `trinket "${id}" has no reveal line`);
    tick(!!def.svg !== !!def.img, `trinket "${id}" must have exactly one of svg / img`);
    if (def.svg) tick(/viewBox="0 0 100 100"/.test(def.svg), `trinket "${id}" is not drawn in the shared 100x100 box`);
    tick(!ACCESSORIES[id], `trinket "${id}" is also in ACCESSORIES — it would be wearable`);
    tick(!shop.some((it) => it.id === id), `trinket "${id}" is in the shop payload`);
  }
  /* S5v2: Megan's own drawings replaced the six placeholder SVGs, so the art
     can now go missing — and a missing shelf tile is silent in the app (an
     empty 52px box reads as "that one just isn't drawn yet"). */
  const missingTk = [];
  await Promise.all(TRINKET_IDS.filter((id) => TRINKETS[id].img).map(async (id) => {
    try {
      const r = await fetch(`./assets/companion/trinkets/${TRINKETS[id].img}?v=${Date.now()}`, { method: "HEAD" });
      if (!r.ok) missingTk.push(id);
    } catch { missingTk.push(id); }
  }));
  tick(missingTk.length === 0, `${missingTk.length} trinket PNG(s) missing: ${missingTk.join(", ")}`);
  say(`trinkets: ${TRINKET_IDS.map(trinketLabel).join(", ")} — ${TRINKET_IDS.length - missingTk.length}/${TRINKET_IDS.length} of Megan's drawings present`);
}

/* ---------- 6d. milestone mystery boxes, end to end ----------
   The grant path is the part that can silently pay twice (or never), so it
   is exercised for real against the local backend rather than asserted from
   the source: cross level 10, get exactly ONE box; replay, get nothing. */
{
  const mu = "verify_ms_" + Math.random().toString(36).slice(2, 8);
  await LocalBackend.signup(mu, "Milestone", "pw12");
  tick(MILESTONE_LEVELS.join(",") === "10,20,30,40", "MILESTONE_LEVELS is not 10/20/30/40");

  // 3 fresh rounds at the 1000-XP cap = 3,000 XP — level 8, no milestone yet.
  for (const q of ["q1", "q2", "q3"]) {
    const r = await LocalBackend.submitQuest(mu, "pw12", q, { score: 0.9, xp: 1000 });
    tick(r.mysteryAwarded === 0, `a milestone box was awarded at level ${r.level} — too early`);
  }
  const pre = await LocalBackend.getState(mu, "pw12");
  tick(pre.levelInfo.level === 8, `3,000 XP should be level 8, got ${pre.levelInfo.level}`);
  tick(pre.boxes.mystery === 0, "a mystery box exists before level 10");

  // the 4th round crosses 3,960 XP -> level 10 -> exactly one box
  const cross = await LocalBackend.submitQuest(mu, "pw12", "q4", { score: 0.9, xp: 1000 });
  tick(cross.level === 10, `4,000 XP should be level 10, got ${cross.level}`);
  tick(cross.mysteryAwarded === 1, `crossing level 10 awarded ${cross.mysteryAwarded} boxes, expected exactly 1`);
  tick(cross.boxes.mystery === 1 && cross.boxes.pending === 1,
    `box counts after crossing are wrong: ${JSON.stringify(cross.boxes)}`);

  // a replay of the same quest must award nothing (the grant list is the dedupe)
  const replay = await LocalBackend.submitQuest(mu, "pw12", "q4", { score: 0.9, xp: 1000 });
  tick(replay.mysteryAwarded === 0, "replaying at level 10 awarded another milestone box");
  tick(replay.boxes.mystery === 1, "the replay changed the mystery-box count");

  // opening it: milestone boxes come first, and the loot obeys the S2 rules
  const st1 = await LocalBackend.getState(mu, "pw12");
  tick(st1.boxes.mystery === 1, "getState lost the mystery box");
  tick(Array.isArray(st1.trinkets) && st1.trinkets.length === 0, "a new learner starts with an empty shelf");
  const open = await LocalBackend.openBox(mu, "pw12");
  tick(open.ok && open.boxKind === "milestone", `expected a milestone box, got ${JSON.stringify(open.boxKind)}`);
  tick(open.milestone === 10, `the box should be stamped milestone 10, got ${open.milestone}`);
  tick(["gold", "cosmetic", "trinket"].includes(open.loot.kind), `milestone loot kind "${open.loot.kind}" is not one of the three`);
  tick(open.boxes.mystery === 0 && open.boxes.pending === 0, "opening did not consume the box");
  const empty = await LocalBackend.openBox(mu, "pw12");
  tick(!empty.ok && empty.error === "no_box", "a second open should report no_box");

  /* Loot pool rules, over enough boxes to see all three branches. Milestone
     20 so the diamond payout (10 x milestone) is distinguishable from the
     homework chest's 15-40 roll. */
  const seenTrinkets = new Set(), seenCosmetics = new Set();
  /* ⚠️ SEED THESE FROM THE LEVEL-10 BOX OPENED ABOVE. That box has already
     paid out, and a quarter of the time it pays a TRINKET — which lands on
     the shelf without being recorded here. The "shelf and the drops
     disagree" check at the end then compares a shelf of N+1 against N
     recorded drops and fails.
     This made the check ~25% flaky from S2 onward; it passed several runs
     today and then failed, which is exactly how a flaky check trains you to
     ignore a red banner. The app was never wrong — only the bookkeeping in
     here was. (Found 2026-08-08 while re-running the suite.) */
  if (open.loot.kind === "trinket") seenTrinkets.add(open.loot.id);
  if (open.loot.kind === "cosmetic") seenCosmetics.add(open.loot.id);
  const kinds = { gold: 0, cosmetic: 0, trinket: 0 };
  for (let i = 0; i < 60; i++) {
    globalThis.__BLIP_DEV__.grantMysteryBox(20, mu);
    const r = await LocalBackend.openBox(mu, "pw12");
    if (!tick(r.ok && r.boxKind === "milestone", "a granted mystery box did not open as one")) break;
    kinds[r.loot.kind] = (kinds[r.loot.kind] || 0) + 1;
    if (r.loot.kind === "gold") {
      tick(r.loot.amount === 200, `milestone-20 diamonds paid ${r.loot.amount}, expected 10 x 20 = 200`);
    } else if (r.loot.kind === "cosmetic") {
      const row = shop.find((it) => it.id === r.loot.id);
      tick(!!row && row.price >= 120, `milestone box paid "${r.loot.id}" (price ${row && row.price}) — the pool is price >= 120`);
      tick(r.loot.isNew && !seenCosmetics.has(r.loot.id), `milestone box handed back a duplicate: ${r.loot.id}`);
      seenCosmetics.add(r.loot.id);
    } else if (r.loot.kind === "trinket") {
      tick(TRINKET_IDS.includes(r.loot.id), `unknown trinket "${r.loot.id}"`);
      tick(!seenTrinkets.has(r.loot.id), `the shelf received a duplicate ${r.loot.id}`);
      seenTrinkets.add(r.loot.id);
      tick((r.trinkets || []).includes(r.loot.id), `"${r.loot.id}" was not added to the shelf`);
    }
  }
  tick(kinds.cosmetic > 0 && kinds.trinket > 0 && kinds.gold > 0,
    `60 milestone boxes did not hit all three branches: ${JSON.stringify(kinds)}`);
  say(`60 milestone boxes: ${kinds.gold} diamonds · ${kinds.cosmetic} rares · ${kinds.trinket} trinkets`);

  // a trinket is on the shelf, and is still not buyable or wearable
  const st2 = await LocalBackend.getState(mu, "pw12");
  tick(st2.trinkets.length === seenTrinkets.size, "the shelf and the drops disagree");
  const oneTrinket = [...seenTrinkets][0];
  if (oneTrinket) {
    const buy = await LocalBackend.buyItem(mu, "pw12", oneTrinket);
    tick(!buy.ok && buy.error === "no_item", `a trinket was purchasable: ${JSON.stringify(buy)}`);
    const wear = await LocalBackend.equip(mu, "pw12", { slot: 1, equipped: { hat: oneTrinket } });
    tick(!wear.ok, "a trinket was equippable");
  }

  /* The homework chest must be untouched by all of this: same 15-40 gold
     roll, same at-or-below-level cosmetic pool, and it only opens once the
     mystery queue is empty. */
  globalThis.__BLIP_DEV__.grantBox(1, mu);
  const hw = await LocalBackend.openBox(mu, "pw12");
  tick(hw.ok && hw.boxKind === "assignment", `the homework chest reported boxKind ${JSON.stringify(hw.boxKind)}`);
  tick(hw.milestone === null, "an assignment box should carry no milestone stamp");
  if (hw.loot.kind === "gold") tick(hw.loot.amount >= 15 && hw.loot.amount <= 40,
    `the homework chest paid ${hw.loot.amount} — its band is 15-40`);
  if (hw.loot.kind === "cosmetic") {
    const row = shop.find((it) => it.id === hw.loot.id);
    tick(!!row && row.price > 0 && row.minLevel <= 10, `the homework chest paid an out-of-pool item: ${hw.loot.id}`);
  }
  tick(hw.loot.kind !== "trinket", "the homework chest paid a trinket — trinkets are milestone-only");
}

/* ---------- 6e. mystery collections (room build S3) ----------
   Every active, sellable cosmetic must belong to EXACTLY ONE collection —
   the failure mode this guards is a new item shipped without a home,
   which would silently vanish from the grouped shop panel (buyableItems
   would never match any collection's item list, so it just never renders,
   not even as an error). */
{
  const seen = new Map(); // id -> collection key, to also catch duplicates
  for (const key of COLLECTION_ORDER) {
    for (const id of COLLECTIONS[key].items) {
      tick(!seen.has(id), `"${id}" is listed in both "${seen.get(id)}" and "${key}" — must be exactly one collection`);
      seen.set(id, key);
    }
  }
  for (const it of shop) {
    const key = collectionForItem(it.id);
    tick(!!key, `shop item "${it.id}" belongs to no collection in js/companion/collections.js`);
  }
  // and the reverse: a collection must never claim an id that isn't an
  // actual active cosmetic (a retired or mistyped id would otherwise sit
  // there silently, never rendering, never caught anywhere else)
  const shopIds = new Set(shop.map((it) => it.id));
  for (const key of COLLECTION_ORDER) {
    for (const id of COLLECTIONS[key].items) {
      tick(shopIds.has(id), `collection "${key}" lists "${id}", which is not an active cosmetic in the shop payload`);
    }
  }
  tick(!ACCESSORIES["star-wand"], `"star-wand" was wired into ACCESSORIES — it has no slot and must stay cut`);
  say(`collections: ${COLLECTION_ORDER.map((k) => `${COLLECTIONS[k].label}(Lv${COLLECTIONS[k].unlockLevel}, ${COLLECTIONS[k].items.length})`).join(" · ")}`);
}

/* ---------- 6f. eye-pair overlays hide the painted eyes underneath ----------
   The six eye-pair items are PNG art (not inline SVG), so they can't bake a
   mask into their own `svg` field like sleepy-eyes does — renderCompanion
   is expected to mount a SEPARATE generic mask layer (blip-eye-mask) first. */
{
  const EYE_PAIR_IDS = ["star-eyes", "angry-eyes", "happy-eyes", "lash-eyes", "dreamy-eyes", "wink-eyes"];
  for (const id of EYE_PAIR_IDS) {
    tick(!!ACCESSORIES[id] && ACCESSORIES[id].mask === true, `eye pair "${id}" is not flagged mask:true — the painted eyes would show through`);
    const host = document.createElement("div");
    renderCompanion(host, { colour: "blue", accessories: [id] });
    tick(!!host.querySelector(".blip-eye-mask"), `equipping "${id}" did not mount the eye-mask layer`);
    const maskEl = host.querySelector(".blip-eye-mask");
    const artEl = host.querySelector(`[data-accessory="${id}"]`);
    if (maskEl && artEl) {
      tick(Array.from(artEl.parentNode.children).indexOf(maskEl) < Array.from(artEl.parentNode.children).indexOf(artEl),
        `"${id}": the eye mask is not painted BEFORE (underneath) the eye art`);
    }
  }
}

/* ---------- 6g. the grocery store (room build S4) ----------
   44 groceries beside the 3 pharmacy rows. The failure modes guarded here:
   a food with no label/art (it renders as a broken image), a food in no
   tier (it silently never appears in the panel, exactly like an
   uncollected cosmetic), and a tier gate that disagrees with the row's own
   min_level (the shop would offer something the server then refuses). */
{
  tick(FOOD_IDS.length === 44, `expected 44 groceries in js/companion/food.js, found ${FOOD_IDS.length}`);
  tick(foodShop.length === 47, `foodShop should carry 44 groceries + soup + medicine + treat = 47, got ${foodShop.length}`);

  // soup / medicine / treat are food rows but NOT groceries: no label entry,
  // no tier, and mhq_eat_food refuses them by name.
  for (const id of NON_GROCERY_FOOD) {
    tick(!!foodShop.find((it) => it.id === id), `the pharmacy row "${id}" vanished from foodShop`);
    tick(!FOODS[id], `"${id}" is listed as a grocery in food.js — it is a care supply, not a snack`);
    tick(!foodCollectionForItem(id), `"${id}" was put in a food tier — the Pharmacy sells it, not the grocery store`);
  }

  // every grocery: label, exactly one tier, and the tier gate == its min_level
  const seenFood = new Map();
  for (const key of FOOD_COLLECTION_ORDER) {
    for (const id of FOOD_COLLECTIONS[key].items) {
      tick(!seenFood.has(id), `"${id}" is in both food tiers "${seenFood.get(id)}" and "${key}"`);
      seenFood.set(id, key);
    }
  }
  for (const id of FOOD_IDS) {
    const row = foodShop.find((it) => it.id === id);
    tick(!!row, `grocery "${id}" has a label but no shop row — it can never be bought`);
    tick(foodLabel(id) !== id, `grocery "${id}" has no friendly label`);
    const key = foodCollectionForItem(id);
    tick(!!key, `grocery "${id}" belongs to no food tier — it would never render in the panel`);
    if (key && row) {
      tick(FOOD_COLLECTIONS[key].unlockLevel === row.minLevel,
        `"${id}": tier "${key}" unlocks at Lv ${FOOD_COLLECTIONS[key].unlockLevel} but the row says min_level ${row.minLevel}`);
    }
    if (row) tick(row.price > 0, `grocery "${id}" is free — food is a gold sink, nothing in the shop may be free`);
  }
  // and the reverse: a tier must not claim an id that has no shop row
  const foodShopIds = new Set(foodShop.map((it) => it.id));
  for (const key of FOOD_COLLECTION_ORDER) {
    for (const id of FOOD_COLLECTIONS[key].items) {
      tick(foodShopIds.has(id), `food tier "${key}" lists "${id}", which is not in the foodShop payload`);
    }
  }
  // and every grocery in the payload has a tier (the mirror of the above)
  for (const it of foodShop) {
    if (NON_GROCERY_FOOD.includes(it.id)) continue;
    tick(!!foodCollectionForItem(it.id), `foodShop item "${it.id}" belongs to no tier in collections.js`);
  }
  say(`food tiers: ${FOOD_COLLECTION_ORDER.map((k) => `${FOOD_COLLECTIONS[k].label}(Lv${FOOD_COLLECTIONS[k].unlockLevel}, ${FOOD_COLLECTIONS[k].items.length})`).join(" · ")}`);

  /* The art. Same trap as the Tripo accessories: a missing PNG is silent in
     the app (a broken <img> in a small tile reads as "the art is just
     plain"), so this is the only place it gets caught. */
  const missingFood = [];
  await Promise.all(FOOD_IDS.map(async (id) => {
    try {
      const r = await fetch(`${foodImgSrc(id)}?v=${Date.now()}`, { method: "HEAD" });
      if (!r.ok) missingFood.push(id);
    } catch { missingFood.push(id); }
  }));
  tick(missingFood.length === 0, `${missingFood.length} food PNG(s) missing from assets/companion/food/: ${missingFood.join(", ")}`);
  say(`food art: ${FOOD_IDS.length - missingFood.length}/${FOOD_IDS.length} PNGs present`);
}

/* ---------- 6h. buy a grocery, eat it, and the rules around eating ----------
   Exercised for real against the local backend, because every one of these
   is a server decision the client must not second-guess: the level gate,
   the consume, "eating is today's feeding", and the three things that are
   food rows but are not snacks. */
{
  const fu = "verify_food_" + Math.random().toString(36).slice(2, 8);
  await LocalBackend.signup(fu, "Fridge", "pw12");
  /* Gold, deterministically: a submitted round pays a flat 10 gold, and
     with xp 0 it pays no XP at all, so this learner stays at level 1 and
     the level-gate check below means what it says. (Opening treasure boxes
     for gold would have been random — and a check that is right 99.99% of
     the time is exactly how the S2 flake got in.) */
  for (let i = 0; i < 10; i++) await LocalBackend.submitQuest(fu, "pw12", "q" + ((i % 3) + 1), { score: 0.9, xp: 0 });
  let st = await LocalBackend.getState(fu, "pw12");
  tick(st.levelInfo.level === 1, `the food learner should still be level 1, got ${st.levelInfo.level}`);
  tick(st.gold === 100, `10 rounds should pay 100 💎, got ${st.gold}`);

  // the level gate is the SERVER's, not the panel's
  const locked = await LocalBackend.buyItem(fu, "pw12", "steak");
  tick(!locked.ok && locked.error === "locked" && locked.minLevel === 11,
    `a level-1 learner bought a Lv 11 steak: ${JSON.stringify(locked)}`);
  // …and the pharmacy is untouched by it (soup is min_level 1, always open)
  const soup = await LocalBackend.buyItem(fu, "pw12", "soup");
  tick(soup.ok, `the pharmacy stopped selling soup: ${JSON.stringify(soup)}`);

  const goldBefore = (await LocalBackend.getState(fu, "pw12")).gold;
  const buy = await LocalBackend.buyItem(fu, "pw12", "apple");
  tick(buy.ok, `buying an apple failed: ${JSON.stringify(buy)}`);
  tick(buy.gold === goldBefore - 5, `an apple cost ${goldBefore - buy.gold}, expected 5`);
  st = await LocalBackend.getState(fu, "pw12");
  tick((st.tray || {}).apple === 1, `the apple did not land on today's tray: ${JSON.stringify(st.tray)}`);
  tick(st.canFeedToday === true, "buying food should not use up the daily cookie");

  /* Eating: consumed, resets the sickness clock, and — HER RULING
     2026-08-08 — leaves the free cookie completely alone. These four are
     the check that would fail if `last_cookie_day` ever got folded back
     into `last_fed_day`, which is exactly how the bug happened once. */
  const feedBefore = st.blips[0].feedCount;
  const eat = await LocalBackend.eatFood(fu, "pw12", "apple");
  tick(eat.ok && eat.item === "apple", `eating the apple failed: ${JSON.stringify(eat)}`);
  tick(eat.tray.apple === undefined, `an eaten apple is still on the tray: ${JSON.stringify(eat.tray)}`);
  tick(eat.blips[0].feedCount === feedBefore, "eating a bought grocery grew him — growth is cookie-only, or it becomes buyable");
  tick(eat.canFeedToday === true, "eating a grocery ate the free cookie — her ruling is that it never may");
  const stEat = await LocalBackend.getState(fu, "pw12");
  tick(stEat.canFeedToday === true, "getState says the cookie is gone after a grocery feeding");
  const gone = await LocalBackend.eatFood(fu, "pw12", "apple");
  tick(!gone.ok && gone.error === "none_left", `eating an apple we do not have: ${JSON.stringify(gone)}`);

  // …and the cookie, still sitting there, is what grows him
  const cookie = await LocalBackend.feed(fu, "pw12");
  tick(cookie.ok, `the free cookie was refused after a grocery feeding: ${JSON.stringify(cookie)}`);
  tick(cookie.blips[0].feedCount === feedBefore + 1, "the free cookie did not grow him");
  const twice = await LocalBackend.feed(fu, "pw12");
  tick(!twice.ok && twice.error === "already_fed", "the free cookie was claimed twice in one day");

  // a snack AFTER the cookie is still eaten, and still hands nothing back
  await LocalBackend.buyItem(fu, "pw12", "banana");
  const snack = await LocalBackend.eatFood(fu, "pw12", "banana");
  tick(snack.ok, `a snack after the cookie was refused: ${JSON.stringify(snack)}`);
  tick(snack.canFeedToday === false, "a snack handed the already-claimed cookie back");
  tick(snack.blips[0].feedCount === feedBefore + 1, "a snack grew him on top of the cookie");

  // the three food rows that are not snacks, and one that is not food at all
  for (const id of NON_GROCERY_FOOD) {
    const r = await LocalBackend.eatFood(fu, "pw12", id);
    tick(!r.ok && r.error === "not_edible", `"${id}" was eaten as a snack: ${JSON.stringify(r)}`);
  }
  const notFood = await LocalBackend.eatFood(fu, "pw12", "beanie");
  tick(!notFood.ok && notFood.error === "no_item", `a cosmetic was eaten: ${JSON.stringify(notFood)}`);

  /* Eating REALLY resets the sickness clock. Worth doing properly: the
     sandbox's term toggle starts OFF, so daysUnfed is 0 no matter what and
     a naive "is it 0?" check proves nothing. Turn the term on, let days
     pass until he is genuinely tired, then feed him a grocery. Everything
     is put back afterwards — this clock is global to the sandbox. */
  {
    await LocalBackend.adminSetTerm("admin", true);
    /* One day at a time until he is TIRED (stage 1), not a fixed jump:
       weekends do not count toward days_unfed, so "skip 6" lands on a
       different stage depending on what weekday it happens to be today —
       and at stage 2 he refuses food outright, which is correct behaviour
       and made a fixed jump fail for the wrong reason. */
    let sick = await LocalBackend.getState(fu, "pw12");
    for (let d = 0; d < 14 && sick.health.stage < 1; d++) {
      globalThis.__BLIP_DEV__.skipDays(1);
      sick = await LocalBackend.getState(fu, "pw12");
    }
    tick(sick.health.stage === 1 && sick.health.daysUnfed >= 3,
      `stepping days should have stopped at tired (stage 1), got ${JSON.stringify(sick.health)}`);
    await LocalBackend.buyItem(fu, "pw12", "carrot");
    const fed = await LocalBackend.eatFood(fu, "pw12", "carrot");
    tick(fed.ok && fed.health.daysUnfed === 0 && fed.health.stage === 0,
      `a real meal did not reset the sickness clock: ${JSON.stringify(fed.health)}`);
    tick(fed.canFeedToday === true, "the clock reset cost him his cookie");
    globalThis.__BLIP_DEV__.reset();
    await LocalBackend.adminSetTerm("admin", false);
  }

  // buying a grocery must never touch the cosmetic closet
  const after = await LocalBackend.getState(fu, "pw12");
  tick(!(after.blip.owned || []).includes("apple"), "an apple ended up in the cosmetic closet");
  say(`food round-trip: bought apple (5 💎) → tray → eaten (clock reset, cookie untouched, no growth) → cookie still claimable and IS what grows him`);
}

/* ---------- 6h2. the tray expires at day-roll — NO REFUND (S4b) ----------
   Her ruling, 2026-08-08: "they can't just buy and buy and expect a
   refund." A stale tray is discarded lazily, the next time anything
   touches it — buy, eat, or a plain state read — and never restored.
   Soup/medicine (the pantry) are exercised alongside it to prove they are
   genuinely untouched by the day roll, not just uninvolved by luck. */
{
  const tu = "verify_tray_" + Math.random().toString(36).slice(2, 8);
  await LocalBackend.signup(tu, "Tray", "pw12");
  for (let i = 0; i < 10; i++) await LocalBackend.submitQuest(tu, "pw12", "q" + ((i % 3) + 1), { score: 0.9, xp: 0 });

  const buyA = await LocalBackend.buyItem(tu, "pw12", "apple");
  tick(buyA.ok && buyA.tray.apple === 1, `the apple did not land on today's tray: ${JSON.stringify(buyA)}`);
  const buyB = await LocalBackend.buyItem(tu, "pw12", "banana");
  tick(buyB.ok && buyB.tray.banana === 1, `the banana did not join it: ${JSON.stringify(buyB)}`);
  const buySoup = await LocalBackend.buyItem(tu, "pw12", "soup");
  tick(buySoup.ok, `soup purchase failed: ${JSON.stringify(buySoup)}`);

  const before = await LocalBackend.getState(tu, "pw12");
  tick((before.tray || {}).apple === 1 && (before.tray || {}).banana === 1, "getState lost today's tray before the roll");
  tick((before.pantry || {}).soup === 1, "soup did not land in the pantry");

  globalThis.__BLIP_DEV__.skipDays(1);
  const after = await LocalBackend.getState(tu, "pw12");
  tick(Object.keys(after.tray || {}).length === 0, `the tray should be empty after a day roll, got ${JSON.stringify(after.tray)}`);
  tick((after.pantry || {}).soup === 1, "soup vanished across the day roll — only groceries expire");

  const eatStale = await LocalBackend.eatFood(tu, "pw12", "apple");
  tick(!eatStale.ok && eatStale.error === "none_left", `yesterday's apple was still edible: ${JSON.stringify(eatStale)}`);

  // no gold refund for the expired food — she was explicit about this
  tick(after.gold === before.gold, `the day roll changed the gold balance: before ${before.gold}, after ${after.gold}`);

  // a fresh buy the next day starts a fresh tray, unaffected by yesterday's
  const buyC = await LocalBackend.buyItem(tu, "pw12", "grapes");
  tick(buyC.ok && buyC.tray.grapes === 1 && buyC.tray.apple === undefined,
    `today's tray carried over yesterday's apple: ${JSON.stringify(buyC)}`);

  globalThis.__BLIP_DEV__.reset();
  say("tray expiry: buy apple+banana → day rolls → both gone, no refund, apple un-eatable; soup survives in the pantry; a fresh buy the next day starts clean");
}

/* ---------- 6i. the drag gesture itself (room build S4) ----------
   Exercised by dispatching real pointer events at two plain divs, because
   the whole reason drag-feed.js knows nothing about food or Blip is so
   this could be tested without mounting the Blip screen.

   ⚠️ POINTER EVENTS, NOT rAF — the preview pane never fires
   requestAnimationFrame (PROJECT-STATUS), which is exactly why the drag is
   built this way, and why the fly-home is torn down on a timer. */
{
  const host = document.createElement("div");
  host.style.cssText = "position:fixed;left:0;top:0;width:420px;height:340px;opacity:0;z-index:-1";
  const src = document.createElement("div");
  src.style.cssText = "position:absolute;left:10px;top:280px;width:44px;height:44px";
  const tgt = document.createElement("div");
  tgt.style.cssText = "position:absolute;left:200px;top:40px;width:80px;height:80px";
  host.append(src, tgt);
  document.body.appendChild(host);

  const pe = (type, x, y) => new PointerEvent(type,
    { bubbles: true, cancelable: true, clientX: x, clientY: y, pointerId: 1, button: 0, isPrimary: true, pointerType: "touch" });

  let log = [];
  let blocked = false;
  const destroy = makeDraggable(src, {
    target: () => tgt,
    ghost: () => { const g = document.createElement("div"); g.className = "test-ghost"; return g; },
    disabled: () => blocked,
    onStart: () => log.push("start"),
    onEnd: () => log.push("end"),
    onTap: () => log.push("tap"),
    onDropOn: () => log.push("on"),
    onDropAway: () => log.push("away"),
  });
  const ghostsInBody = () => document.querySelectorAll("body > .feed-ghost").length;

  // the pad maths, on its own
  tick(isOverTarget(tgt, 240, 80), "a point in the middle of the target did not register");
  tick(isOverTarget(tgt, 240, 120 + DEFAULT_DROP_PAD_PX - 2), "the drop pad below the target is missing");
  tick(!isOverTarget(tgt, 240, 120 + DEFAULT_DROP_PAD_PX + 30), "the drop pad extends further than it should");
  tick(!isOverTarget(null, 240, 80), "a missing target counted as a hit");

  // 1. a press that never moves is a TAP, not a drag (this is what keeps
  //    the daily cookie tappable now that it is also draggable)
  log = [];
  src.dispatchEvent(pe("pointerdown", 30, 300));
  src.dispatchEvent(pe("pointerup", 32, 301));
  tick(log.join(",") === "end,tap", `a still press should be a tap, got [${log}]`);
  tick(ghostsInBody() === 0, "a tap left a ghost behind");

  // 2. dragged ONTO him: eaten. No ghost survives — it does not fly anywhere.
  log = [];
  src.dispatchEvent(pe("pointerdown", 30, 300));
  src.dispatchEvent(pe("pointermove", 70, 270));
  tick(log.join(",") === "start", `the drag did not begin after crossing the threshold: [${log}]`);
  tick(ghostsInBody() === 1, "no ghost followed the finger");
  src.dispatchEvent(pe("pointermove", 240, 80));
  tick(tgt.classList.contains("feed-target-over"), "Blip did not light up when the food was over him");
  src.dispatchEvent(pe("pointerup", 240, 80));
  tick(log.join(",") === "start,end,on", `dropping on the target should feed him, got [${log}]`);
  tick(!tgt.classList.contains("feed-target-over"), "the drop highlight was left on");
  tick(ghostsInBody() === 0, "the eaten food is still on screen");

  // 3. dropped ANYWHERE else: no penalty, the sad face, and it flies home
  log = [];
  src.dispatchEvent(pe("pointerdown", 30, 300));
  src.dispatchEvent(pe("pointermove", 70, 270));
  src.dispatchEvent(pe("pointermove", 20, 100));      // well clear of target + pad
  tick(!tgt.classList.contains("feed-target-over"), "Blip lit up for a food that was nowhere near him");
  src.dispatchEvent(pe("pointerup", 20, 100));
  tick(log.join(",") === "start,end,away", `dropping away should be a miss, got [${log}]`);
  const flying = document.querySelector("body > .feed-ghost.flying-home");
  tick(!!flying, "the missed food did not fly home");
  await new Promise((r) => setTimeout(r, 460));
  tick(ghostsInBody() === 0, "the flown-home ghost was never cleaned up");

  // 4. a cancelled gesture flies home SILENTLY — no sad face. A cancel is
  //    the browser taking the gesture away, not the child missing.
  log = [];
  src.dispatchEvent(pe("pointerdown", 30, 300));
  src.dispatchEvent(pe("pointermove", 70, 270));
  src.dispatchEvent(pe("pointercancel", 70, 270));
  tick(log.join(",") === "start,end", `a cancel should not report a miss, got [${log}]`);
  await new Promise((r) => setTimeout(r, 460));
  tick(ghostsInBody() === 0, "a cancelled drag left a ghost behind");

  // 5. disabled() is honoured (this is how a sick Blip refuses the gesture)
  log = []; blocked = true;
  src.dispatchEvent(pe("pointerdown", 30, 300));
  src.dispatchEvent(pe("pointerup", 30, 300));
  tick(log.length === 0, `a disabled handle still reacted: [${log}]`);
  blocked = false;

  // 6. keyboard: Enter feeds him, so the gesture is not the only way in
  log = [];
  src.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }));
  tick(log.join(",") === "tap", `Enter should feed him, got [${log}]`);

  // 7. destroy() really unbinds
  destroy();
  log = [];
  src.dispatchEvent(pe("pointerdown", 30, 300));
  src.dispatchEvent(pe("pointerup", 30, 300));
  tick(log.length === 0, `destroy() left a live listener: [${log}]`);

  host.remove();
  say("drag-to-feed: tap · drop-on · drop-away (flies home, no penalty) · cancel · disabled · keyboard · destroy");
}

/* ---------- 6j. FURNITURE (room build S5v2) ----------
   Four new equip slots. The failure this guards above all others is the
   July cape bug: rows seeded, slot NOT added to mhq_equip's key list, so
   everything looks right until you try to put the bed in the room and get
   `bad_equipped`. That is asserted twice over — statically against the SQL
   text (section 6 above) and for real against the local backend here. */
{
  tick(FURNITURE_IDS.length === 18, `expected 18 furniture pieces in js/companion/furniture.js, found ${FURNITURE_IDS.length}`);
  tick(furnShop.length === 18, `furnitureShop should carry 18 rows, got ${furnShop.length}`);
  tick(FURNITURE_SLOTS.join(",") === "door,window,desk,bed",
    `FURNITURE_SLOTS is "${FURNITURE_SLOTS.join(",")}" — it is also the PAINT ORDER, back to front (walls, then floor)`);

  // every piece: label, art, a slot, a home collection, and a placement that
  // actually lands somewhere on the shell
  const seenFurn = new Map();
  for (const key of FURNITURE_COLLECTION_ORDER) {
    for (const id of FURNITURE_COLLECTIONS[key].items) {
      tick(!seenFurn.has(id), `"${id}" is in both furniture collections "${seenFurn.get(id)}" and "${key}"`);
      seenFurn.set(id, key);
    }
  }
  for (const id of FURNITURE_IDS) {
    const def = FURNITURE[id];
    const row = furnShop.find((it) => it.id === id);
    tick(!!row, `furniture "${id}" has a catalogue entry but no shop row — it can never be bought`);
    tick(furnitureLabel(id) !== id, `furniture "${id}" has no friendly label`);
    tick(FURNITURE_SLOTS.includes(def.slot), `furniture "${id}" has slot "${def.slot}", which is not one of the four`);
    if (row) tick(row.slot === def.slot, `"${id}" slot differs: payload ${row.slot}, catalogue ${def.slot}`);
    tick(/^[a-z0-9-]+\.png$/.test(def.img), `furniture "${id}" img must be a bare .png filename`);
    tick(!ACCESSORIES[id], `furniture "${id}" is also an ACCESSORY — it would be worn on Blip`);
    // exactly one collection, and its gate must equal the row's own min_level
    const key = furnitureCollectionForItem(id);
    tick(!!key, `furniture "${id}" belongs to no collection — it would never render in the panel`);
    if (key && row) {
      tick(FURNITURE_COLLECTIONS[key].unlockLevel === row.minLevel,
        `"${id}": collection "${key}" unlocks at Lv ${FURNITURE_COLLECTIONS[key].unlockLevel} but the row says min_level ${row.minLevel}`);
    }
    // placement: on the picture, and anchored somewhere inside its own box
    const p = placementFor(id);
    tick(p.widthPct > 0 && p.widthPct <= 100, `"${id}" widthPct ${p.widthPct} is not a sane % of the room`);
    tick(p.attach.x > 0 && p.attach.x < 1 && p.attach.y > 0 && p.attach.y < 1,
      `"${id}" attaches at (${p.attach.x}, ${p.attach.y}) — off the room shell`);
    tick(p.anchor.x >= 0 && p.anchor.x <= 1 && p.anchor.y >= 0 && p.anchor.y <= 1,
      `"${id}" anchor (${p.anchor.x}, ${p.anchor.y}) is outside its own picture`);
  }
  // and the reverse: a collection must not claim an id with no shop row
  const furnShopIds = new Set(furnShop.map((it) => it.id));
  for (const key of FURNITURE_COLLECTION_ORDER) {
    for (const id of FURNITURE_COLLECTIONS[key].items) {
      tick(furnShopIds.has(id), `furniture collection "${key}" lists "${id}", which is not in the furnitureShop payload`);
    }
  }
  for (const it of furnShop) {
    tick(!!furnitureCollectionForItem(it.id), `furnitureShop item "${it.id}" belongs to no collection in collections.js`);
  }

  /* THE FREE DEFAULTS. One per slot, price 0 at level 1, so a brand-new
     learner has a complete room and can fill every slot before earning a
     crystal — the same rule the cosmetic free tier lives under. */
  tick(Object.keys(DEFAULT_FURNITURE).length === 4, "DEFAULT_FURNITURE must name all four slots");
  for (const slot of FURNITURE_SLOTS) {
    const id = DEFAULT_FURNITURE[slot];
    const row = furnShop.find((it) => it.id === id);
    tick(!!row, `slot "${slot}" has no default furniture row (${id})`);
    if (row) {
      tick(row.price === 0 && row.minLevel === 1, `the "${slot}" default (${id}) is not free at level 1: ${row.price}💎 / Lv ${row.minLevel}`);
      tick(row.slot === slot, `the "${slot}" default (${id}) is actually a ${row.slot}`);
    }
    tick(furnShop.filter((it) => it.slot === slot).length >= 2,
      `slot "${slot}" sells ${furnShop.filter((it) => it.slot === slot).length} piece(s) — every slot wants a real choice`);
  }
  /* An EMPTY room is never a hole: roomFurniture() fills each slot with its
     free default, and an unknown id (a retired piece still sitting in an old
     equipped blob) falls back the same way rather than rendering nothing. */
  const bare = roomFurniture({});
  tick(FURNITURE_SLOTS.every((s) => bare[s] === DEFAULT_FURNITURE[s]), `an empty room did not fall back to the defaults: ${JSON.stringify(bare)}`);
  const junk = roomFurniture({ bed: "not-a-real-bed", desk: "techy-desk" });
  tick(junk.bed === DEFAULT_FURNITURE.bed, "an unknown equipped id did not fall back to the free default");
  tick(junk.desk === "techy-desk", "roomFurniture dropped a perfectly good equipped desk");

  /* ⚠️ HER RULING: THE DOOR COLOURS ALL SHARE ONE PICTURE. Nine door items,
     ONE png between them, tinted in code. This is the check that catches a
     future session "fixing" it by generating door-mint.png. */
  const doors = FURNITURE_IDS.filter((id) => FURNITURE[id].slot === "door");
  tick(doors.length === 9, `expected 9 doors (white + 8 colours), found ${doors.length}`);
  tick(new Set(doors.map((id) => FURNITURE[id].img)).size === 1,
    `the door colours use ${new Set(doors.map((id) => FURNITURE[id].img)).size} different PNGs — her ruling is ONE drawing tinted in code`);
  tick(doors.filter((id) => !FURNITURE[id].tint).length === 1, "exactly one door (door-white) should be untinted");
  tick(!FURNITURE["door-white"].tint, "door-white must be the untinted one");
  for (const id of doors.filter((d) => d !== "door-white")) {
    tick(/^#[0-9a-f]{6}$/i.test(FURNITURE[id].tint || ""), `door "${id}" has no usable tint hex`);
  }
  tick(new Set(doors.filter((d) => d !== "door-white").map((id) => FURNITURE[id].tint)).size === 8,
    "two door colours share a tint hex — they would be indistinguishable");
  // the tint really produces a DIFFERENT picture, and a null tint really is free
  {
    const src = furnitureImgSrc("door-white");
    const plain = await tintedImageSrc(src, null);
    tick(plain === src, "an untinted item did not resolve straight to its own file (that path must cost no canvas work)");
    const tinted = await tintedImageSrc(src, FURNITURE["door-mint"].tint);
    tick(typeof tinted === "string" && tinted.startsWith("data:image/png"), `tinting produced ${String(tinted).slice(0, 24)}…, expected a data URL`);
    tick(tinted !== src, "the tinted door came back as the original file");
    const again = await tintedImageSrc(src, FURNITURE["door-mint"].tint);
    tick(again === tinted, "the tint cache handed back a different result for the same (file, colour)");
  }

  /* The art. Same trap as the accessories and the food: a missing PNG is
     silent in the app (a piece of furniture simply does not appear, which
     reads as "that slot is empty"), so this is the only place it is caught.
     Distinct FILES, not items — the nine doors share one. */
  const furnFiles = [...new Set(FURNITURE_IDS.map((id) => furnitureImgSrc(id)))];
  const missingFurn = [];
  await Promise.all(furnFiles.map(async (src) => {
    try {
      const r = await fetch(`${src}?v=${Date.now()}`, { method: "HEAD" });
      if (!r.ok) missingFurn.push(src);
    } catch { missingFurn.push(src); }
  }));
  tick(missingFurn.length === 0, `${missingFurn.length} furniture PNG(s) missing: ${missingFurn.join(", ")} — run tools/tripo_sheet.py over art-source/tripo/furniture-iso-*.png, windows.png and door.png`);
  // the shell itself, which is the whole room's backdrop
  {
    let shellOk = false;
    try { shellOk = (await fetch(`./assets/companion/room-shell.png?v=${Date.now()}`, { method: "HEAD" })).ok; } catch { shellOk = false; }
    tick(shellOk, "assets/companion/room-shell.png is missing — the room would render as an empty box");
  }
  say(`furniture: ${FURNITURE_COLLECTION_ORDER.map((k) => `${FURNITURE_COLLECTIONS[k].label}(Lv${FURNITURE_COLLECTIONS[k].unlockLevel}, ${FURNITURE_COLLECTIONS[k].items.length})`).join(" · ")}`);
  say(`furniture art: ${furnFiles.length - missingFurn.length}/${furnFiles.length} PNGs present (9 doors share 1 file)`);

  /* ---- and now for real, against the backend ---- */
  const wu = "verify_furn_" + Math.random().toString(36).slice(2, 8);
  await LocalBackend.signup(wu, "Furniture", "pw12");
  // flat 10 gold a round, no XP, so this learner stays at level 1 and the
  // level-gate check below means what it says (the S2 flake lesson).
  for (let i = 0; i < 30; i++) await LocalBackend.submitQuest(wu, "pw12", "q" + ((i % 3) + 1), { score: 0.9, xp: 0 });
  let fs = await LocalBackend.getState(wu, "pw12");
  tick(fs.levelInfo.level === 1, `the furniture learner should still be level 1, got ${fs.levelInfo.level}`);

  // a level gate the server owns, not the panel
  const tooHigh = await LocalBackend.buyItem(wu, "pw12", "techy-bed");
  tick(!tooHigh.ok && tooHigh.error === "locked" && tooHigh.minLevel === 8,
    `a level-1 learner bought a Lv 8 capsule bed: ${JSON.stringify(tooHigh)}`);
  // equipping something you do not own is refused — this is the check that
  // would pass for the WRONG reason if the slot were missing from
  // VALID_SLOTS, so the owned case below is what really proves the slot.
  const unowned = await LocalBackend.equip(wu, "pw12", { slot: 1, equipped: { bed: "princess-bed" } });
  tick(!unowned.ok && unowned.error === "bad_equipped", `an unowned bed was equipped: ${JSON.stringify(unowned)}`);

  // buy + equip + unequip, on ALL FOUR slots
  for (const slot of FURNITURE_SLOTS) {
    const id = DEFAULT_FURNITURE[slot];
    const goldBefore = (await LocalBackend.getState(wu, "pw12")).gold;
    const buy = await LocalBackend.buyItem(wu, "pw12", id);
    tick(buy.ok, `buying the free ${slot} (${id}) failed: ${JSON.stringify(buy)}`);
    tick(buy.gold === goldBefore, `a free ${slot} changed the gold balance (${goldBefore} -> ${buy.gold})`);
    tick((buy.owned || []).includes(id), `${id} is not in owned_items after buying`);

    const on = await LocalBackend.equip(wu, "pw12", { slot: 1, equipped: { [slot]: id } });
    tick(on.ok, `equipping the "${slot}" slot was REJECTED — this is the July cape bug: ${JSON.stringify(on)}`);
    const worn = await LocalBackend.getState(wu, "pw12");
    tick(worn.blip.equipped && worn.blip.equipped[slot] === id, `${id} did not stick in the ${slot} slot`);
    // and it must NOT have become something Blip wears
    tick(!(worn.blip.equipped.hat === id || worn.blip.equipped.back === id), `${id} ended up in a cosmetic slot`);

    const off = await LocalBackend.equip(wu, "pw12", { slot: 1, equipped: { [slot]: "" } });
    tick(off.ok, `taking the ${slot} out failed: ${JSON.stringify(off)}`);
    const bareAgain = await LocalBackend.getState(wu, "pw12");
    tick(roomFurniture(bareAgain.blip.equipped)[slot] === DEFAULT_FURNITURE[slot],
      `an emptied "${slot}" slot did not fall back to its free default`);
  }

  // a door colour costs what it says, and a trinket is STILL not buyable
  // (the same guard in mhq_buy_item lets furniture through and must not
  // have widened any further than that)
  {
    const before = (await LocalBackend.getState(wu, "pw12")).gold;
    const buy = await LocalBackend.buyItem(wu, "pw12", "door-mint");
    tick(buy.ok && buy.gold === before - 10, `the mint door cost ${before - buy.gold}, expected 10`);
    const again = await LocalBackend.buyItem(wu, "pw12", "door-mint");
    tick(!again.ok && again.error === "owned", `the mint door was bought twice: ${JSON.stringify(again)}`);
    const trinket = await LocalBackend.buyItem(wu, "pw12", "rubber-duck");
    tick(!trinket.ok && trinket.error === "no_item", `a trinket became purchasable when furniture did: ${JSON.stringify(trinket)}`);
    const wearTrinket = await LocalBackend.equip(wu, "pw12", { slot: 1, equipped: { bed: "rubber-duck" } });
    tick(!wearTrinket.ok, "a trinket was equippable into a furniture slot");
  }

  // furniture must never touch the cosmetic side of the closet: a bed is in
  // owned_items (that is how ownership works) but it is not an accessory, so
  // the Inventory panel — which filters by COSMETIC_SLOTS — must not show it
  {
    const after = await LocalBackend.getState(wu, "pw12");
    const closetish = (after.blip.owned || []).filter((id) => COSMETIC_SLOTS.includes(accessorySlot(id)));
    tick(!closetish.some((id) => FURNITURE_IDS.includes(id)), "a piece of furniture would show up in the cosmetic Inventory");
    tick(!after.shop.some((it) => FURNITURE_IDS.includes(it.id)), "furniture leaked into the cosmetic shop payload");
  }
  say("furniture round-trip: all four slots buy → equip → unequip (falls back to the free default); unowned rejected; Lv 8 gate held at Lv 1; door colours priced; trinkets still unbuyable");
}

/* ---------- 6k. THE ROOM IS HOME (room build §1, 2026-08-09) ----------
   The routing itself (app.js/auth.js -> go("blip"); the desk's tap ->
   go("hub")) lives in blip.js/app.js/auth.js, which this page does not
   import — DOM screens are the browser-walk's job, not this file's (see
   PROJECT-STATUS.md). What IS assertable here without a full render:
     - hasActiveAssignment() is the exact condition the desk badge uses,
       and it must agree with renderAssignmentCard's own "nothing to pin"
       logic — they are two hand-synced copies in assignment.js, and this
       is what would catch them drifting apart.
     - homeworkBadgeLayer() really disappears on a failed image load — no
       drawn placeholder, no broken-image icon, per her art rule (the
       badge art, assets/companion/homework-badge.png, may not even be in
       the repo yet — this must stay green either way). */
{
  const fakeApp = (assignment) => ({ state: { assignment } });
  tick(hasActiveAssignment(fakeApp(null)) === false, "hasActiveAssignment(null) should be false");
  tick(hasActiveAssignment(fakeApp(undefined)) === false, "hasActiveAssignment(undefined) should be false");
  tick(hasActiveAssignment(fakeApp({})) === false, "an assignment with no questId should be false");
  tick(hasActiveAssignment(fakeApp({ questId: "not-a-real-quest" })) === false,
    "an assignment pointing at an unknown quest id should be false — matches renderAssignmentCard's 'unknown quest id — fail quiet' rule");
  // "stats" / "q1" are real ids from config.js (CHAPTERS) — a genuinely resolvable assignment
  tick(hasActiveAssignment(fakeApp({ questId: "q1", chapterId: "stats" })) === true,
    "a real, resolvable assignment should read as active");
  // Review fix 2026-08-09: DONE homework must not badge the desk. The card
  // still pins its gentle ✓ state, but a red "!" has no done state — "no
  // nagging repeat once it's done" (assignment.js header ruling).
  tick(hasActiveAssignment(fakeApp({ questId: "q1", chapterId: "stats", done: true })) === false,
    "a DONE assignment must not show the desk badge — no nagging repeat once it's done");
  tick(hasActiveAssignment({}) === false && hasActiveAssignment(null) === false,
    "hasActiveAssignment must not throw on a bare/missing app");

  const host = document.createElement("div");
  document.body.appendChild(host);
  const badge = homeworkBadgeLayer();
  host.appendChild(badge);
  tick(host.contains(badge), "homeworkBadgeLayer() did not attach to its host");
  const img = badge.querySelector("img");
  tick(!!img, "homeworkBadgeLayer() has no <img>");
  tick(!!img && /(^|\/)assets\/companion\/homework-badge\.png$/.test(img.getAttribute("src") || ""),
    `homework badge points at "${img && img.getAttribute("src")}", expected assets/companion/homework-badge.png`);
  if (img) img.dispatchEvent(new Event("error"));
  tick(!host.contains(badge), "a failed homework-badge image load should remove the badge, not leave a broken-image icon");
  host.remove();
  say("room home screen: hasActiveAssignment() matches renderAssignmentCard's own decision; homework badge hides itself on a failed image load");
}

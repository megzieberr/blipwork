<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store &amp; closet · verification</title>
<link rel="stylesheet" href="./css/styles.css">
<style>
  body{font-family:"JetBrains Mono",monospace;padding:24px;max-width:1180px;margin:0 auto}
  #banner{font-weight:700;font-size:18px;padding:14px 18px;border-radius:14px;margin:14px 0 22px;border:1px solid var(--brd)}
  #banner.pass{background:var(--good-bg);color:var(--good)} #banner.fail{background:var(--bad-bg);color:var(--bad)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .card{background:rgba(255,255,255,.03);border:1px solid var(--brd);border-radius:14px;padding:10px;text-align:center}
  .card h3{font-size:12px;margin-bottom:4px}
  .card .meta{font-size:10px;color:var(--muted)}
  .stage{width:120px;margin:0 auto 6px}
  pre{white-space:pre-wrap;font-size:12px;color:var(--muted);background:rgba(255,255,255,.03);padding:12px;border-radius:10px;border:1px solid var(--brd)}
  h2{font-size:15px;margin:24px 0 10px}
</style>
</head>
<body>
<h1 style="font-family:'Space Grotesk',sans-serif">Store &amp; closet · verification</h1>
<div id="banner">running…</div>

<h2>Assertions</h2>
<pre id="log">…</pre>

<h2>Every accessory, alone on the body (eyeball these)</h2>
<div class="grid" id="solo"></div>

<h2>Full outfits — one item in every slot at once</h2>
<div class="grid" id="outfits"></div>

<script type="module">
import { ACCESSORIES, ATTACH, COLOURS, renderCompanion } from "./js/companion/renderer.js";
import { ITEM_LABELS, itemRarity, accessorySlot, COSMETIC_SLOTS, SLOT_LABELS } from "./js/companion/blip-ui.js";
import { LocalBackend } from "./js/local-backend.js";

let total = 0; const fails = [];
const tick = (cond, label) => { total++; if (!cond) fails.push(label); return cond; };
const lines = [];
const say = (s) => lines.push(s);

/* ---------- the client's own catalogue mirror ---------- */
// local-backend keeps SHOP_ITEMS module-private, so read the catalogue the
// way the app does: through a real signed-up learner's state payload.
const uname = "verify_store_" + Math.random().toString(36).slice(2, 8);
await LocalBackend.signup(uname, "Verify", "pw12");
const state = await LocalBackend.getState(uname, "pw12");
const shop = (state.shop || []);
say(`shop payload: ${shop.length} cosmetic items`);

/* ---------- 1. every sellable id can actually be drawn ---------- */
for (const it of shop) {
  tick(!!ACCESSORIES[it.id], `shop item "${it.id}" has no ACCESSORIES entry (would render as an empty card)`);
  tick(!!ITEM_LABELS[it.id], `shop item "${it.id}" has no friendly label (would show its raw id)`);
  if (ACCESSORIES[it.id]) {
    tick(ACCESSORIES[it.id].slot === it.slot,
      `slot mismatch for "${it.id}": shop says ${it.slot}, renderer says ${ACCESSORIES[it.id].slot}`);
  }
}

/* ---------- 2. every drawable accessory has a home ---------- */
for (const [id, def] of Object.entries(ACCESSORIES)) {
  tick(!!ATTACH[def.slot], `accessory "${id}" uses slot "${def.slot}" with no ATTACH point`);
  tick(!!ITEM_LABELS[id], `accessory "${id}" has no friendly label`);
  tick(typeof def.widthPct === "number" && def.widthPct > 0, `accessory "${id}" has no widthPct`);
  // An accessory is drawn EITHER as inline SVG or as a Tripo PNG, never both.
  tick(!!def.svg !== !!def.img, `accessory "${id}" must have exactly one of svg / img`);
  if (def.svg) {
    tick(/viewBox="0 0 \d+ \d+"/.test(def.svg), `accessory "${id}" svg has no plain viewBox`);
    // {{UID}} placeholders must be paired with an internal id, else a stray
    // token ends up in the DOM
    tick(!def.svg.includes("{{UID}}") || /id="[^"]*\{\{UID\}\}/.test(def.svg),
      `accessory "${id}" uses {{UID}} but defines no id with it`);
  } else {
    tick(/^[a-z0-9-]+\.png$/.test(def.img), `accessory "${id}" img must be a bare .png filename`);
  }
}

/* ---------- 2b. every Tripo PNG accessory's art is actually there ----------
   The renderer drops a layer whose image 404s (so a missing file is silent
   in the app on purpose). That makes this the only place it gets caught. */
{
  const pngItems = Object.entries(ACCESSORIES).filter(([, d]) => d.img);
  const missing = [];
  await Promise.all(pngItems.map(async ([id, d]) => {
    try {
      // Cache-bust: sw.js serves images CACHE-FIRST and its cache.match does
      // not ignore search params, so a unique query is the only way to ask
      // the network. Without it a deleted file still reported present.
      const r = await fetch(`./assets/companion/items/${d.img}?v=${Date.now()}`, { method: "HEAD" });
      if (!r.ok) missing.push(id);
    } catch { missing.push(id); }
  }));
  tick(missing.length === 0,
    `${missing.length} Tripo item PNG(s) missing: ${missing.join(", ")} — ` +
    `run tools/tripo_sheet.py over the sheets in art-source/tripo/`);
  say(`Tripo PNG items: ${pngItems.length - missing.length}/${pngItems.length} present`);
}

/* ---------- 3. the free tier really does cover every slot ---------- */
for (const slot of COSMETIC_SLOTS) {
  const inSlot = shop.filter((it) => it.slot === slot);
  tick(inSlot.length >= 2, `slot "${slot}" sells ${inSlot.length} item(s) — the point of this work was a real choice in every slot`);
  const free = inSlot.filter((it) => it.price === 0 && it.minLevel === 1);
  tick(free.length >= 1, `slot "${slot}" has no free level-1 item — a new learner can't fill it`);
}
say(`slots: ${COSMETIC_SLOTS.map((s) => `${SLOT_LABELS[s]} ${shop.filter((i) => i.slot === s).length}`).join(" · ")}`);

/* ---------- 4. rarity bands ---------- */
tick(itemRarity(0) === "free" && itemRarity(50) === "common" && itemRarity(120) === "rare" && itemRarity(200) === "rare",
  "itemRarity bands are wrong");
const rare = shop.filter((it) => itemRarity(it.price) === "rare");
tick(rare.every((it) => it.minLevel >= 6), "a rare item is buyable below level 6");
say(`rares: ${rare.map((r) => `${r.id}(L${r.minLevel}/${r.price})`).join(", ")}`);

/* ---------- 5. free items must not be treasure-box loot ---------- */
// The box pool is `price > 0 && minLevel <= level && !owned`. Rebuilt here
// from the same payload the backend filters, so a free item creeping back
// into the pool shows up as a failure rather than as a sad box on a phone.
const freeIds = new Set(shop.filter((it) => it.price === 0).map((it) => it.id));
tick(freeIds.size === COSMETIC_SLOTS.length,
  `expected one free item per slot (${COSMETIC_SLOTS.length}), found ${freeIds.size}`);
const levelOnePool = shop.filter((it) => it.price > 0 && it.minLevel <= 1);
tick(levelOnePool.every((it) => !freeIds.has(it.id)), "a free item is inside the level-1 loot pool");
tick(levelOnePool.length > 0, "the level-1 loot pool is empty — every box would pay gold instead");
say(`level-1 loot pool: ${levelOnePool.length} paid items (${levelOnePool.map((i) => i.id).join(", ")})`);

/* ---------- 6. the SQL seed and the client mirror agree ---------- */
// This is the drift that bites: a new item added to one side only. Parse the
// ids straight out of the migration and compare sets.
for (const [file, expected] of [
  ["migration-store-expansion.sql", 16],
  ["migration-effects-slot.sql", 12],
]) try {
  const sql = await (await fetch(`./supabase/${file}`)).text();
  const seeded = [...sql.matchAll(/^\s*\('([a-z0-9-]+)',\s*'([a-z]+)',\s*(\d+),\s*(\d+),\s*true/gim)]
    .map((m) => ({ id: m[1], slot: m[2], price: +m[3], minLevel: +m[4] }));
  tick(seeded.length === expected, `${file} seeds ${seeded.length} rows, expected ${expected}`);
  for (const row of seeded) {
    const mirror = shop.find((it) => it.id === row.id);
    tick(!!mirror, `"${row.id}" is in ${file} but not in the client shop mirror`);
    if (mirror) {
      tick(mirror.price === row.price, `"${row.id}" price differs: SQL ${row.price}, client ${mirror.price}`);
      tick(mirror.minLevel === row.minLevel, `"${row.id}" minLevel differs: SQL ${row.minLevel}, client ${mirror.minLevel}`);
      tick(mirror.slot === row.slot, `"${row.id}" slot differs: SQL ${row.slot}, client ${mirror.slot}`);
    }
  }
  // A slot is never just new rows: mhq_equip hard-codes the allowed equipped
  // keys and shop_items_slot_cat_check hard-codes the slots. Missing either
  // is what made an equipped cape return bad_equipped in July, so assert
  // that every slot this migration seeds is named in BOTH.
  for (const slot of new Set(seeded.map((r) => r.slot))) {
    const inConstraint = new RegExp(`slot in \\([^)]*'${slot}'`).test(sql);
    const inEquip = new RegExp(`k not in \\([^)]*'${slot}'`).test(sql);
    tick(inConstraint || !sql.includes("shop_items_slot_cat_check"),
      `${file} seeds slot "${slot}" but does not allow it in shop_items_slot_cat_check`);
    tick(inEquip || !sql.includes("mhq_equip"),
      `${file} seeds slot "${slot}" but does not allow it in mhq_equip's key list`);
  }
  say(`${file}: ${seeded.length} rows, all cross-checked against the client mirror`);
} catch (e) {
  tick(false, `could not read supabase/${file}: ` + e.message);
}

/* ---------- 7. buying, wearing and taking off actually work ---------- */
{
  const freeCape = shop.find((it) => it.id === "cape");
  tick(!!freeCape && freeCape.price === 0, "the free cape is missing from the shop");
  const before = (await LocalBackend.getState(uname, "pw12")).gold;
  const buy = await LocalBackend.buyItem(uname, "pw12", "cape", 1);
  tick(buy && buy.ok, "buying the free cape failed: " + JSON.stringify(buy));
  const after = await LocalBackend.getState(uname, "pw12");
  tick(after.gold === before, `a free item changed the gold balance (${before} -> ${after.gold})`);
  tick((after.blip.owned || []).includes("cape"), "cape not in owned_items after buying");

  const wear = await LocalBackend.equip(uname, "pw12", { slot: 1, equipped: { back: "cape" } });
  tick(wear && wear.ok, "equipping to the new BACK slot was rejected: " + JSON.stringify(wear));
  const worn = await LocalBackend.getState(uname, "pw12");
  tick(worn.blip.equipped && worn.blip.equipped.back === "cape", "cape did not stick in the back slot");

  const off = await LocalBackend.equip(uname, "pw12", { slot: 1, equipped: { back: "" } });
  tick(off && off.ok, "taking the cape off failed");

  const bogus = await LocalBackend.equip(uname, "pw12", { slot: 1, equipped: { back: "not-a-real-item" } });
  tick(bogus && !bogus.ok, "the back slot accepted an item the learner does not own");
}

/* ---------- 8. every accessory renders a real, sized layer ---------- */
const soloHost = document.getElementById("solo");
const ids = Object.keys(ACCESSORIES);
for (const id of ids) {
  const def = ACCESSORIES[id];
  const shopRow = shop.find((it) => it.id === id);
  const card = document.createElement("div");
  card.className = "card";
  const price = shopRow ? (shopRow.price === 0 ? "FREE" : shopRow.price + " 💎") : "retired";
  card.innerHTML = `<div class="stage"></div><h3>${ITEM_LABELS[id] || id}</h3>
    <div class="meta">${SLOT_LABELS[def.slot] || def.slot} · ${price}${shopRow ? " · L" + shopRow.minLevel : ""}</div>`;
  soloHost.appendChild(card);
  renderCompanion(card.querySelector(".stage"), { colour: "blue", accessories: [id] });
  const layers = card.querySelectorAll(`[data-accessory="${id}"]`);
  const paired = Array.isArray(ATTACH[def.slot]);
  tick(layers.length === (paired ? 2 : 1),
    `"${id}" rendered ${layers.length} layer(s); ${paired ? "paired" : "single"} slot expects ${paired ? 2 : 1}`);
  for (const l of layers) {
    if (def.img) {
      const im = l.querySelector("img");
      tick(!!im, `"${id}" layer has no <img>`);
      tick(!!im && im.getAttribute("src").endsWith(`/${def.img}`),
        `"${id}" layer points at the wrong file`);
    } else {
      tick(!!l.querySelector("svg"), `"${id}" layer has no <svg>`);
      tick(!l.innerHTML.includes("{{UID}}"), `"${id}" left an unreplaced {{UID}} in the DOM`);
    }
  }
}

/* ---------- 9. a whole outfit at once, in a few colours ---------- */
const outfitHost = document.getElementById("outfits");
const oneOf = (slot, prefer) => prefer.find((id) => ACCESSORIES[id] && ACCESSORIES[id].slot === slot)
  || ids.find((id) => ACCESSORIES[id].slot === slot);
const outfits = [
  { label: "Free tier, every slot", colour: "blue",
    items: ["beanie", "study-specs", "ear-tufts", "mitts", "nub-wings", "cape"] },
  { label: "All rares", colour: "lilac",
    items: ["crown", "visor", "bunny-ears", "boxing-gloves", "bat-wings", "jetpack"] },
  { label: "Techy set", colour: "mint",
    items: ["bolt-antenna", "star-shades", "headphones", "power-gloves", "aurora-wings", "schoolbag"] },
  { label: "Sleepy + horns", colour: "peach",
    items: ["horns", "sleepy-eyes", "ear-tufts", "mitts", "nub-wings", "schoolbag"] },
  // Tripo wave 1: a full PNG outfit, and the rare effect at the same time.
  { label: "Tripo set", colour: "blue",
    items: ["wizard-hat", "cyber-visor", "ear-tufts", "mitts", "gold-wings", "back-sword", "spark-halo"] },
  { label: "Monarch", colour: "lilac",
    items: ["royal-crown", "eye-mask", "bunny-ears", "power-gloves", "dragon-wings", "jetpack", "shadow-crown"] },
];
for (const o of outfits) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<div class="stage" style="width:150px"></div><h3>${o.label}</h3>
    <div class="meta">${o.colour}</div>`;
  outfitHost.appendChild(card);
  renderCompanion(card.querySelector(".stage"), { colour: o.colour, accessories: o.items });
  // one layer per requested item, and nothing silently dropped
  for (const id of o.items) {
    const paired = Array.isArray(ATTACH[ACCESSORIES[id].slot]);
    tick(card.querySelectorAll(`[data-accessory="${id}"]`).length === (paired ? 2 : 1),
      `outfit "${o.label}" lost "${id}"`);
  }
  // the body must sit BETWEEN the back/wings layers and the face layers
  const kids = [...card.querySelector(".blip-stage").children];
  const bodyAt = kids.findIndex((k) => k.classList.contains("blip-body"));
  const backAt = kids.findIndex((k) => k.dataset && k.dataset.slot === "back");
  const hatAt = kids.findIndex((k) => k.dataset && k.dataset.slot === "hat");
  tick(backAt >= 0 && backAt < bodyAt, `outfit "${o.label}": back item is not painted behind the body`);
  tick(hatAt > bodyAt, `outfit "${o.label}": hat is not painted in front of the body`);
  // effects sit behind EVERYTHING, back item included — an aura painted
  // over the cape would read as a sticker rather than as a glow
  const fxAt = kids.findIndex((k) => k.dataset && k.dataset.slot === "effects");
  if (o.items.some((id) => ACCESSORIES[id] && ACCESSORIES[id].slot === "effects")) {
    tick(fxAt >= 0 && fxAt < backAt, `outfit "${o.label}": effect is not painted behind the back item`);
  }
}

/* ---------- report ---------- */
const banner = document.getElementById("banner");
banner.className = fails.length ? "fail" : "pass";
banner.textContent = fails.length
  ? `${fails.length} of ${total} checks FAILED`
  : `all ${total} checks passed`;
say("");
say(fails.length ? "FAILURES:\n" + fails.map((f) => "  ✗ " + f).join("\n") : "no failures");
document.getElementById("log").textContent = lines.join("\n");
</script>
</body>
</html>

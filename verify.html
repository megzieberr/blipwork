<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stats Graph Engine · verification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Dev tool: renders every graph type and confirms each drawn feature
   reads back to its declared value. The stats analog of Circle Quest's
   verify.html ("ALL TO SCALE"). */
:root{
  --bg:#04101a; --panel:rgba(10,30,42,.55); --brd:rgba(56,224,210,.16);
  --ink:#eafcff; --muted:#7fb6c4; --faint:#4d8493;
  --g-ink:#cfeef4; --g-muted:#7fb6c4; --g-axis:rgba(180,230,240,.45);
  --g-grid:rgba(127,182,196,.16); --g-read:#fcd34d; --g-out:#fb7185;
  --ok:#34d399; --bad:#fb7185;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"JetBrains Mono",monospace;background:linear-gradient(180deg,var(--bg),#06182a);color:var(--ink);min-height:100vh;padding:28px 18px 80px}
.wrap{max-width:980px;margin:0 auto}
h1{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:22px;letter-spacing:.5px}
.lead{color:var(--muted);font-size:13px;margin:4px 0 22px}
#banner{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:18px;padding:16px 20px;border-radius:14px;margin-bottom:24px;border:1px solid var(--brd)}
#banner.pass{background:rgba(52,211,153,.12);color:var(--ok);border-color:rgba(52,211,153,.4)}
#banner.fail{background:rgba(251,113,133,.12);color:var(--bad);border-color:rgba(251,113,133,.4)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--brd);border-radius:16px;padding:16px;backdrop-filter:blur(8px)}
.card h3{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:14px;margin-bottom:4px}
.card .meta{color:var(--faint);font-size:11px;margin-bottom:10px}
.gbox{background:rgba(255,255,255,.02);border:1px solid var(--brd);border-radius:12px;padding:8px;margin-bottom:12px}
.checks{list-style:none;font-size:11.5px;line-height:1.55}
.checks li{display:flex;gap:8px;padding:2px 0;color:var(--muted)}
.checks li .i{flex:0 0 auto;font-weight:700}
.checks li.ok .i{color:var(--ok)} .checks li.bad .i{color:var(--bad);}
.checks li.bad{color:var(--bad)}
.sg{width:100%;height:auto;display:block;font-family:"JetBrains Mono",monospace}
.sg text{fill:var(--g-muted)}
.sg-axis{stroke:var(--g-axis);stroke-width:1}
.sg-grid{stroke:var(--g-grid);stroke-width:.5}
.sg-lab{font-size:9px}
.sg-title{font-size:10px;fill:var(--g-ink)}
.sg-val{font-size:9px;fill:var(--g-ink)}
.sg-box{stroke:var(--accent);stroke-width:2;fill:color-mix(in srgb,var(--accent) 16%,transparent)}
.sg-med{stroke:var(--accent);stroke-width:2.6}
.sg-whisk{stroke:var(--accent);stroke-width:1.6}
.sg-outlier{fill:var(--g-out)}
.sg-line{stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;fill:none}
.sg-pt{fill:var(--accent)}
.sg-read{stroke:var(--g-read);stroke-width:1.2;stroke-dasharray:3 3}
.sg-read-dot{fill:var(--g-read)}
.sg-read-lab{fill:var(--g-read);font-size:9px;font-weight:700}
.sg-bar{fill:color-mix(in srgb,var(--accent) 28%,transparent);stroke:var(--accent);stroke-width:1.2}
h2{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:16px;margin:26px 0 12px;color:var(--ink)}
pre{white-space:pre-wrap;font-size:12px;color:var(--muted);background:rgba(255,255,255,.03);padding:12px;border-radius:10px;border:1px solid var(--brd)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Stats graph engine · verification</h1>
  <p class="lead">Every graph is drawn from real data; each check re-derives a declared value back out of the geometry. If everything matches, no graph can mislead a learner.</p>
  <div id="banner">running…</div>
  <div class="grid" id="grid"></div>

  <h2>Quests — 8 quests, fresh-number generations</h2>
  <pre id="quests">…</pre>
</div>

<script type="module">
import { renderGraph, verifyGraph } from "./js/engine/stats-graph.js";
import { questDef } from "./js/quests/index.js";
import { CHAPTERS } from "./js/config.js";
import { getConcept } from "./js/concepts.js";
import { answerCorrect } from "./js/check.js";
import { checkStep, normalizeTokens } from "./js/steps-check.js";

/* Test specs — a few of every type, including edge cases (outliers,
   skewed shapes, read-offs). These are ENGINE tests, not game content. */
const SPECS = [
  { title: "Box plot · symmetric", accent: "#a855f7", spec: {
    type: "box", five: { min: 12, q1: 34, med: 48, q3: 67, max: 89 }, title: "marks" } },

  { title: "Box plot · with outliers", accent: "#a855f7", spec: {
    type: "box", five: { min: 5, q1: 7, med: 8.5, q3: 9, max: 12 },
    outliers: [1, 15], axis: { min: 0, max: 16, step: 2 }, dp: 1 } },

  { title: "Box plot · skewed right", accent: "#c084fc", spec: {
    type: "box", five: { min: 20, q1: 30, med: 34, q3: 48, max: 80 },
    axis: { min: 0, max: 80, step: 10 } } },

  { title: "Ogive · read median, Q1, Q3", accent: "#38e0d2", spec: {
    type: "ogive", title: "marks",
    classes: [
      { lower: 20, upper: 30, freq: 80 }, { lower: 30, upper: 40, freq: 140 },
      { lower: 40, upper: 50, freq: 20 }, { lower: 50, upper: 60, freq: 10 },
      { lower: 60, upper: 70, freq: 5 }, { lower: 70, upper: 80, freq: 0 },
      { lower: 80, upper: 90, freq: 45 },
    ],
    readCum: [75, 150, 225] } },

  { title: "Ogive · read a percentile", accent: "#38e0d2", spec: {
    type: "ogive", title: "time (min)",
    classes: [
      { lower: 0, upper: 10, freq: 4 }, { lower: 10, upper: 20, freq: 11 },
      { lower: 20, upper: 30, freq: 20 }, { lower: 30, upper: 40, freq: 9 },
      { lower: 40, upper: 50, freq: 6 },
    ],
    readVal: [25] } },

  { title: "Histogram · class frequencies", accent: "#7dd3fc", spec: {
    type: "hist", title: "marks",
    classes: [
      { lower: 0, upper: 20, freq: 3 }, { lower: 20, upper: 40, freq: 8 },
      { lower: 40, upper: 60, freq: 14 }, { lower: 60, upper: 80, freq: 9 },
      { lower: 80, upper: 100, freq: 4 },
    ] } },

  { title: "Number line · tap to read", accent: "#fcd34d", spec: {
    type: "numline", min: 0, max: 50, step: 5,
    marks: [{ value: 18, label: "18" }, { value: 37, label: "37" }] } },
];

const grid = document.getElementById("grid");
let total = 0, passed = 0;

SPECS.forEach(t => {
  const checks = verifyGraph(t.spec);
  const svg = renderGraph(t.spec);
  const allOk = checks.every(c => c.ok);
  total += checks.length;
  passed += checks.filter(c => c.ok).length;

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <h3>${t.title}</h3>
    <div class="meta">${t.spec.type} · ${checks.length} checks · ${allOk ? "✓ to scale" : "✗ FAIL"}</div>
    <div class="gbox">${svg}</div>
    <ul class="checks">${checks.map(c => `<li class="${c.ok ? "ok" : "bad"}"><span class="i">${c.ok ? "✓" : "✗"}</span><span>${c.label}</span></li>`).join("")}</ul>`;
  grid.appendChild(card);
});

/* ---------- 2) quests: generate each skill many times and validate ----------
   Added 2026-08-30 audit day (the SPLIT-1 session) — this file previously
   checked only the graph-rendering engine above, with no per-skill
   dispatch to hang a "steps" branch on. Built to match verify-trig.html /
   verify-prob.html's own quest-dispatch, so q3's new outBound step chain
   (and everything else in the stats chapter) actually gets exercised. */
const statsChapter = CHAPTERS.find(c => c.id === "stats");
const RUNS = 120;
const lines = [];
const fails = [];
let qTotalChecks = 0, qFails = 0;

function checkGraph(g) {
  if (!g) return true;
  return verifyGraph(g).every(c => c.ok);        // one engine covers box/ogive/hist/numline
}

statsChapter.quests.forEach(qmeta => {
  const def = questDef(qmeta.id);
  const skillIssues = {};
  def.skills.forEach(skill => {
    if (!getConcept(skill.concept)) { skillIssues[skill.id] = `missing concept "${skill.concept}"`; }
    for (let i = 0; i < RUNS; i++) {
      let q;
      try { q = skill.gen(); }
      catch (e) { skillIssues[skill.id] = "threw: " + e.message; break; }
      qTotalChecks++;
      if (q.concept && !getConcept(q.concept)) { skillIssues[skill.id] = `q.concept "${q.concept}" not found`; qFails++; }
      if (q.type === "mc" || q.type === "reason") {
        const labels = q.options.map(o => o.label);
        const corrects = q.options.filter(o => o.correct).length;
        const dupes = labels.length !== new Set(labels).size;
        if (corrects !== 1) { skillIssues[skill.id] = `has ${corrects} correct options`; qFails++; }
        if (dupes) { skillIssues[skill.id] = `duplicate option labels: ${labels.join(" | ")}`; qFails++; }
        if (q.options.length < 2) { skillIssues[skill.id] = "too few options"; qFails++; }
      } else if (q.type === "calc") {
        if (!Number.isFinite(q.expected)) { skillIssues[skill.id] = "non-finite expected"; qFails++; }
        else if (!answerCorrect(q.expected, q.expected, { dp: q.dp, tol: q.tol })) { skillIssues[skill.id] = "expected fails its own check"; qFails++; }
      } else if (q.type === "yesno") {
        if (typeof q.yes !== "boolean") { skillIssues[skill.id] = "q.yes not boolean"; qFails++; }
      } else if (q.type === "tap") {
        const ids = (q.tap.targets || []);
        if (!ids.includes(q.tap.correctId)) { skillIssues[skill.id] = "correctId not in targets"; qFails++; }
      } else if (q.type === "steps") {
        /* the audit-day chain (q3.outBound, 2026-08-30) — same structural
           floor verify-trig.html's dispatch checks. */
        const steps = q.steps || [];
        if (steps.length < 2) { skillIssues[skill.id] = `chain of ${steps.length} steps`; qFails++; }
        if (!steps.length || steps[steps.length - 1].kind !== "calc") { skillIssues[skill.id] = "chain does not end on a typed number"; qFails++; }
        if (q.method) { skillIssues[skill.id] = "chain carries q.method (spoils the steps)"; qFails++; }
        steps.forEach((st, si) => {
          if (!st.prompt || !st.hint) { skillIssues[skill.id] = `step ${si} missing prompt/hint`; qFails++; }
          if (st.kind === "mc") {
            const rights = st.options.filter(o => o.correct).length;
            const labels = st.options.map(o => o.label);
            if (rights !== 1) { skillIssues[skill.id] = `step ${si} has ${rights} correct options`; qFails++; }
            if (labels.length !== new Set(labels).size) { skillIssues[skill.id] = `step ${si} duplicate options`; qFails++; }
          } else if (st.kind === "calc") {
            if (!Number.isFinite(st.expected)) { skillIssues[skill.id] = `step ${si} non-finite expected`; qFails++; }
            else if (!checkStep(st, st.expected)) { skillIssues[skill.id] = `step ${si} rejects its own answer`; qFails++; }
            if (st.expected < 0 && !st.allowNeg) { skillIssues[skill.id] = `step ${si} negative expected without allowNeg`; qFails++; }
          } else if (st.kind === "tokenpad") {
            const slots = (st.frame || []).filter(f => f === "☐").length;
            const need = String(st.expected).split(" ").filter(Boolean);   // U+2009 — the pad's own separator
            const keysNorm = (st.keys || []).map(normalizeTokens);
            if (need.length !== slots) { skillIssues[skill.id] = `step ${si}: ${need.length} pieces for ${slots} boxes`; qFails++; }
            if (need.some(t => !keysNorm.includes(normalizeTokens(t)))) { skillIssues[skill.id] = `step ${si} not buildable from its chips`; qFails++; }
            if (new Set(keysNorm).size !== keysNorm.length) { skillIssues[skill.id] = `step ${si} duplicate chips`; qFails++; }
            if (!checkStep(st, st.expected)) { skillIssues[skill.id] = `step ${si} rejects its own fill`; qFails++; }
          } else { skillIssues[skill.id] = `step ${si} unknown kind "${st.kind}"`; qFails++; }
        });
        if (steps.length && typeof q.expected === "number"
            && Math.abs(steps[steps.length - 1].expected - q.expected) > 1e-9) {
          skillIssues[skill.id] = "chain end ≠ question's headline answer"; qFails++;
        }
      }
      if (!checkGraph(q.graph)) { skillIssues[skill.id] = "graph not to scale"; qFails++; }
    }
  });
  const bad = Object.keys(skillIssues);
  total++; if (bad.length === 0) passed++; else fails.push(`${qmeta.id} ${qmeta.title}`);
  lines.push(`${bad.length === 0 ? "✓" : "✗"} ${qmeta.id}  ${qmeta.title}  (${def.skills.length} skills × ${RUNS})`
    + (bad.length ? "\n    " + bad.map(b => `${b}: ${skillIssues[b]}`).join("\n    ") : ""));
});

document.getElementById("quests").textContent =
  `${qTotalChecks} generations checked · ${qFails} integrity failures\n\n` + lines.join("\n");

const banner = document.getElementById("banner");
const ok = passed === total && qFails === 0;
banner.className = ok ? "pass" : "fail";
banner.textContent = ok
  ? `✓ ALL GOOD — ${passed}/${total} engine/quest checks passed, ${qTotalChecks} generations clean`
  : `✗ ${total - passed} check group(s) failed; ${qFails} generation failures — see below`;

// surface the result for headless checks too
window.__VERIFY__ = { total, passed, qTotalChecks, qFails, ok, fails };
console.log(`[verify] engine&quest ${passed}/${total}, generations ${qTotalChecks}, failures ${qFails} — ${ok ? "OK" : "FAIL"}`);
if (fails.length) console.log("FAILS:\n" + fails.join("\n"));
</script>
</body>
</html>
